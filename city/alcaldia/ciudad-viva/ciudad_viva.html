<title>Ciudad viva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Concepto: una maqueta nocturna donde cada casa se enciende cuando su habitante trabaja y los mensajes cruzan la ciudad como cartas.
   Paleta: noche azulada, ámbar de ventana encendida, verde azulado del bus, rosa de las entregas. */
:root{--bg:#0b1020;--panel:#121a30;--fg:#ebe6d8;--mut:#8f99b5;--line:#27325a;--amber:#f2b84b;--teal:#4fd1b8;--rose:#ec6a8d;--violet:#9b8cff;
  --serif:'Fraunces',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin-inline:auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;justify-content:space-between}
h1{font:600 clamp(1.5rem,3vw,2.1rem)/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.estado{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--mut)}
.punto{width:9px;height:9px;border-radius:50%;background:#5b6585}
.punto.vivo{background:var(--teal);box-shadow:0 0 0 0 rgba(79,209,184,.6);animation:latido 1.8s infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(79,209,184,.55)}70%{box-shadow:0 0 0 9px rgba(79,209,184,0)}100%{box-shadow:0 0 0 0 rgba(79,209,184,0)}}
@media (prefers-reduced-motion:reduce){.punto.vivo{animation:none}}
.escena{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:900px){.escena{grid-template-columns:minmax(0,1fr)}}
.lienzo{position:relative;background:linear-gradient(#0e1530,#0a0f20);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.pie{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 12px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--mut)}
.pie i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
aside h2{font:600 1rem var(--serif);margin:0 0 8px}
#feed{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto;display:grid;gap:7px;font-size:13px}
#feed li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding-bottom:7px;border-bottom:1px solid var(--line)}
#feed .hora{font:11px var(--mono);color:var(--mut);white-space:nowrap;padding-top:2px}
#feed .txt{min-width:0;overflow-wrap:anywhere}
#feed b{font-weight:600}
#feed .tag{display:inline-block;font:500 10px var(--mono);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:4px;color:var(--mut)}
#feed li.nuevo{animation:entra .6s ease-out}
@keyframes entra{from{background:rgba(242,184,75,.18)}to{background:transparent}}
.vacio{color:var(--mut);font-size:13px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
<div class="wrap">
<header>
<h1>Ciudad viva</h1>
<div class="estado" role="status"><span class="punto" id="punto"></span><span id="estadotxt">conectando…</span></div>
</header>
<div class="escena">
<div class="lienzo">
<canvas id="c" width="900" height="620" role="img" aria-label="Mapa animado de la ciudad: cada casa se enciende cuando su habitante trabaja y los mensajes viajan entre casas"></canvas>
<div class="pie"><span><i style="background:#4fd1b8"></i>Haiku</span><span><i style="background:#f2b84b"></i>Sonnet</span><span><i style="background:#9b8cff"></i>Opus</span><span><i style="background:#ec6a8d"></i>entrega</span><span>luz = trabajando · carta = mensaje del bus · bandera = commit</span></div>
</div>
<aside><h2>Lo que va pasando</h2><ul id="feed" aria-live="polite"><li class="vacio">Esperando eventos de la ciudad…</li></ul></aside>
</div>
</div>
<script>
const CASAS=[
 ['casa-mosca','Neuro','Haiku'],['casa-conectoma','Cartógrafa','Haiku'],['casa-mb-real','Neuro-2','Sonnet'],['casa-flyhash','Hash','Sonnet'],
 ['casa-taller','Pintora','Haiku'],['casa-empresa','Fundador','Haiku'],['casa-agora','Tendera','Haiku'],['casa-forja','Cazador','Haiku'],
 ['casa-notaria','Notario','Haiku'],['casa-auditoria','Auditor','Sonnet'],['casa-micelio','Hifa','Sonnet'],['casa-ministro','Ministro','Opus']];
const COL={Haiku:'#4fd1b8',Sonnet:'#f2b84b',Opus:'#9b8cff'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=900,H=620,dpr=1;
const casas={},cartas=[],chispas=[],conf=[];
const alc={id:'alcalde',nombre:'Alcalde',x:0,y:0,activo:0,bocadillo:null,bandera:0};
CASAS.forEach(([id,hab,mod],i)=>{casas[id]={id,hab,mod,x:0,y:0,activo:0,bocadillo:null,entregada:0,estado:''}});
casas.alcalde=alc;
function layout(){
  const r=cv.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(320,Math.round(r.width)); H=Math.round(W<560?W*1.05:W*0.68);
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
  alc.x=W/2; alc.y=H/2;
  const rx=W*0.385,ry=H*0.37;
  CASAS.forEach(([id],i)=>{const a=-Math.PI/2+i*2*Math.PI/CASAS.length; casas[id].x=W/2+Math.cos(a)*rx; casas[id].y=H/2+Math.sin(a)*ry;});
}
const ahora=()=>performance.now();
function dibujaCasa(c,t,esAlc){
  const s=esAlc?1.25:1, u=Math.max(.72,Math.min(1,W/900))*s, w=44*u, h=30*u, x=c.x, y=c.y+8*u;
  const luz=c.activo>t?1:Math.max(0,1-(t-c.activo)/6000), col=esAlc?'#ec6a8d':COL[c.mod];
  if(luz>0){const g=ctx.createRadialGradient(x,y,4,x,y,70*u);g.addColorStop(0,'rgba(242,184,75,'+(.38*luz)+')');g.addColorStop(1,'rgba(242,184,75,0)');ctx.fillStyle=g;ctx.fillRect(x-80*u,y-80*u,160*u,160*u);}
  ctx.fillStyle='#1b2547';ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.rect(x-w/2,y-h/2,w,h);ctx.fill();ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-w/2-6*u,y-h/2);ctx.lineTo(x,y-h/2-20*u);ctx.lineTo(x+w/2+6*u,y-h/2);ctx.closePath();ctx.fill();
  const lit=luz>0.05;ctx.fillStyle=lit?'rgba(255,214,120,'+(.55+.45*luz)+')':'#2b3763';
  ctx.fillRect(x-w/2+6*u,y-h/2+7*u,9*u,9*u);ctx.fillRect(x+w/2-15*u,y-h/2+7*u,9*u,9*u);ctx.fillRect(x-4*u,y,8*u,h/2);
  if(esAlc){ctx.fillStyle='#ebe6d8';ctx.fillRect(x-1,y-h/2-34*u,2,16*u);ctx.fillStyle=c.bandera>t?'#f2b84b':'#ec6a8d';ctx.beginPath();ctx.moveTo(x+1,y-h/2-34*u);ctx.lineTo(x+14*u,y-h/2-29*u);ctx.lineTo(x+1,y-h/2-24*u);ctx.fill();}
  // habitante
  const bob=lit?Math.sin(t/180+x)*2.2:0;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+w/2+11*u,y+h/2-6*u+bob,5*u,0,7);ctx.fill();
  ctx.fillStyle='#0b1020';ctx.fillRect(x+w/2+9*u,y+h/2-8*u+bob,1.6,1.6);ctx.fillRect(x+w/2+12.5*u,y+h/2-8*u+bob,1.6,1.6);
  if(!lit&&!esAlc){ctx.fillStyle='#8f99b5';ctx.font='10px JetBrains Mono,monospace';ctx.fillText('z',x+w/2+17*u,y+h/2-12*u+Math.sin(t/700+x)*2);}
  ctx.fillStyle=lit?'#ebe6d8':'#9aa3bf';ctx.font=(W<560?'10':'11')+'px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText(esAlc?'Alcaldía':c.hab,x,y+h/2+16*u);ctx.textAlign='left';
  if(c.entregada>t){const k=(c.entregada-t)/3500;ctx.strokeStyle='rgba(236,106,141,'+k+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,30*u+(1-k)*50,0,7);ctx.stroke();}
}
function bocadillo(c,t){const b=c.bocadillo;if(!b||b.hasta<t)return;ctx.font='11px system-ui,sans-serif';
  const maxw=Math.min(190,W*0.4),words=b.txt.split(' ');let lines=[],cur='';for(const w of words){if(ctx.measureText(cur+' '+w).width>maxw-14){lines.push(cur);cur=w}else cur=(cur?cur+' ':'')+w}lines.push(cur);lines=lines.slice(0,3);
  const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+14,bh=lines.length*14+10;let bx=Math.max(4,Math.min(W-bw-4,c.x-bw/2)),by=c.y-52-bh;if(by<4)by=c.y+34;
  const a=Math.min(1,(b.hasta-t)/600);ctx.globalAlpha=a;ctx.fillStyle='#161f3d';ctx.strokeStyle=b.color;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect?ctx.roundRect(bx,by,bw,bh,7):ctx.rect(bx,by,bw,bh);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ebe6d8';lines.forEach((l,i)=>ctx.fillText(l,bx+7,by+16+i*14));ctx.globalAlpha=1;}
function frame(t){
  ctx.clearRect(0,0,W,H);
  // estrellas fijas
  ctx.fillStyle='rgba(235,230,216,.5)';for(let i=0;i<46;i++){const sx=(i*137.5)%W,sy=(i*71.3)%(H*.9);ctx.fillRect(sx,sy,1.2,1.2)}
  // caminos
  ctx.strokeStyle='rgba(143,153,181,.16)';ctx.lineWidth=7;ctx.lineCap='round';CASAS.forEach(([id])=>{const c=casas[id];ctx.beginPath();ctx.moveTo(alc.x,alc.y);ctx.lineTo(c.x,c.y);ctx.stroke()});
  CASAS.forEach(([id])=>dibujaCasa(casas[id],t,false));dibujaCasa(alc,t,true);
  // cartas
  for(let i=cartas.length-1;i>=0;i--){const k=cartas[i],p=(t-k.t0)/k.dur;if(p>=1){const d=casas[k.to]||alc;d.activo=Math.max(d.activo,t+2500);cartas.splice(i,1);continue}
    const a=casas[k.from]||alc,b=casas[k.to]||alc,mx=(a.x+b.x)/2+(a.y-b.y)*.18,my=(a.y+b.y)/2+(b.x-a.x)*.18-30;
    const q=p<0?0:p,x=(1-q)*(1-q)*a.x+2*(1-q)*q*mx+q*q*b.x,y=(1-q)*(1-q)*a.y+2*(1-q)*q*my+q*q*b.y;
    for(let j=1;j<6;j++){const qq=Math.max(0,q-j*.035);const tx=(1-qq)*(1-qq)*a.x+2*(1-qq)*qq*mx+qq*qq*b.x,ty=(1-qq)*(1-qq)*a.y+2*(1-qq)*qq*my+qq*qq*b.y;ctx.fillStyle='rgba(79,209,184,'+(.35-j*.055)+')';ctx.beginPath();ctx.arc(tx,ty,3.2-j*.4,0,7);ctx.fill()}
    ctx.fillStyle='#4fd1b8';ctx.fillRect(x-7,y-5,14,10);ctx.strokeStyle='#0b1020';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x-7,y-5);ctx.lineTo(x,y+1);ctx.lineTo(x+7,y-5);ctx.stroke();}
  for(let i=chispas.length-1;i>=0;i--){const s=chispas[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.04;s.v-=1;if(s.v<=0){chispas.splice(i,1);continue}ctx.fillStyle=s.c+Math.max(0,s.v/s.max)+')';ctx.fillRect(s.x,s.y,2.6,2.6)}
  CASAS.forEach(([id])=>bocadillo(casas[id],t));bocadillo(alc,t);
  requestAnimationFrame(frame);
}
function brillo(c,color,n){for(let i=0;i<n;i++)chispas.push({x:c.x,y:c.y-10,vx:(Math.random()-.5)*2.4,vy:-Math.random()*2.2-.6,v:44,max:44,c:color})}
const feed=document.getElementById('feed');let vistos=new Set(),ultimo=0,primera=true;
const HORA=t=>new Date(t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function nombre(id){return id==='alcalde'?'Alcalde':(casas[id]?casas[id].hab:id)}
function linea(ev,nuevo){
  const li=document.createElement('li');if(nuevo)li.className='nuevo';
  const h=document.createElement('span');h.className='hora';h.textContent=ev.hist?'·':HORA(ev.t);
  const tx=document.createElement('span');tx.className='txt';const b=document.createElement('b');
  let cuerpo='';
  if(ev.tipo==='bus'){b.textContent=nombre(ev.de)+' → '+(ev.a==='*'?'todos':nombre(ev.a));cuerpo=' '+(ev.texto||'');if(ev.etiqueta){const g=document.createElement('span');g.className='tag';g.textContent=ev.etiqueta;tx.append(b,g,document.createTextNode(cuerpo));li.append(h,tx);return li}}
  else if(ev.tipo==='commit'){b.textContent='Commit';cuerpo=' '+(ev.texto||'')}
  else if(ev.tipo==='trabajo'){b.textContent=ev.casas&&ev.casas.length?ev.casas.map(nombre).join(', '):'actividad';cuerpo=' está trabajando'+(ev.n?' ('+ev.n+' archivos cambiados)':'')}
  else if(ev.tipo==='estado'){b.textContent=nombre(ev.casa);cuerpo=' '+(ev.texto||'')}
  else {b.textContent=ev.tipo||'evento';cuerpo=' '+(ev.texto||'')}
  tx.append(b,document.createTextNode(cuerpo));li.append(h,tx);return li}
function aplica(ev,rapido){
  const t=ahora();
  if(ev.tipo==='bus'){const de=casas[ev.de]?ev.de:'alcalde',a=ev.a==='*'||!casas[ev.a]?'alcalde':ev.a;if(!rapido||Math.random()<1){cartas.push({from:de,to:a,t0:t,dur:rapido?900:1700});}
    const c=casas[de]||alc;c.activo=t+4000;c.bocadillo={txt:(ev.texto||'').slice(0,96),hasta:t+(rapido?2500:6500),color:'#4fd1b8'};brillo(c,'rgba(79,209,184,',8)}
  else if(ev.tipo==='commit'){alc.bandera=t+4000;alc.activo=t+4000;alc.bocadillo={txt:'commit: '+(ev.texto||'').slice(0,70),hasta:t+(rapido?1800:5000),color:'#f2b84b'};brillo(alc,'rgba(242,184,75,',16)}
  else if(ev.tipo==='trabajo'){(ev.casas||[]).forEach(id=>{const c=casas[id];if(c){c.activo=t+9000;brillo(c,'rgba(242,184,75,',3)}})}
  else if(ev.tipo==='estado'){const c=casas[ev.casa];if(c){c.estado=ev.texto||'';if(/entreg|termin|cerr/i.test(ev.texto||'')){c.entregada=t+3500;brillo(c,'rgba(236,106,141,',26)}}}
}
function estadoVivo(){const el=document.getElementById('estadotxt'),p=document.getElementById('punto');
  if(!ultimo){el.textContent='sin eventos todavía';p.className='punto';return}
  const s=Math.round((Date.now()-ultimo)/1000);
  if(s<120){p.className='punto vivo';el.textContent='en directo · último evento hace '+s+' s'}
  else{p.className='punto';el.textContent='en pausa · último evento hace '+(s<3600?Math.round(s/60)+' min':Math.round(s/3600)+' h')}}
setInterval(estadoVivo,5000);
function ingiere(snap){
  const cambios=snap.docChanges().filter(c=>c.type==='added').map(c=>c.doc.data()).filter(ev=>ev&&!vistos.has(ev.id));
  cambios.sort((a,b)=>a.t-b.t);if(!cambios.length)return;
  if(feed.querySelector('.vacio'))feed.replaceChildren();
  if(primera){primera=false;
    cambios.slice().reverse().forEach(ev=>{vistos.add(ev.id);feed.appendChild(linea(ev,false));if(!ev.hist&&ev.t>ultimo)ultimo=ev.t});
    const reciente=cambios.filter(e=>e.tipo==='bus'||e.tipo==='commit').slice(-8);reciente.forEach((ev,i)=>setTimeout(()=>aplica(ev,true),400+i*700));
    cambios.filter(e=>e.tipo==='estado').forEach(ev=>aplica(ev,true));
  }else{
    cambios.forEach((ev,i)=>{vistos.add(ev.id);setTimeout(()=>{feed.insertBefore(linea(ev,true),feed.firstChild);while(feed.children.length>80)feed.lastChild.remove();aplica(ev,false)},i*900);if(!ev.hist&&ev.t>ultimo)ultimo=ev.t});
  }
  estadoVivo();
}
layout();new ResizeObserver(layout).observe(cv.parentElement);requestAnimationFrame(frame);
(async()=>{
  const db=await (window.claude&&claude.use?claude.use('db'):null);
  if(!db){document.getElementById('estadotxt').textContent='sin conexión en vivo (solo el mapa)';feed.innerHTML='<li class="vacio">Esta vista no tiene acceso al canal de eventos.</li>';return}
  db.collection('eventos').orderBy('t','desc').limit(120).onSnapshot(ingiere,e=>{document.getElementById('estadotxt').textContent='canal interrumpido ('+(e&&e.code||'error')+')'});
})();
</script>
