ectura (+11,4 pp a 2,5k, +1,6 pp a 80k); como primera capa fija de una red pequeña (fly_hid) pierde 1-3 pp frente a una capa densa. Real vs nulo en la capa fly: |d| \u003c 0,5 pp (media) en todos los presupuestos. Con PC1→hub la capa con grados de la mosca (real o nulo) gana +4 a +6 pp a F6, pero sigue por debajo de las ReLU aleatorias densas.\n9. **Comprobación con regresión logística** (digits): real - nulo +0,03 pp [-0,20, +0,26]; real - F6 -0,24 pp [-0,55, +0,07]: la lectura no cambia las conclusiones.\n\n## Qué se hizo\n\n- **Datos** (`src/extract_pnkc.py`, `data/pnkc.npz`, 71 KB): KC = `type` que empieza por KC (4064); PN = `class == ALPN` con ≥1 arista a KC (314); peso = nº de sinapsis. 252 KC (6,2 %) no reciben\n  ningún PN: **se descartan en todas las variantes** (3812 KC vivas) para no regalar unidades al comparador (E13 las cuenta: cambia 0,2 puntos).\n- **Entradas**: digits (sklearn, sin red), MNIST y Fashion-MNIST (bucket público de TensorFlow, `src/fetch_datasets.sh`), 20 Newsgroups → TF-IDF → SVD 400 (**LSA, no es un embedding neuronal**).\n  Mapeos entrada→314 PN (aleatorizados por réplica; el resultado no depende de uno afortunado): `proj` (gaussiana fija), `select` (canales al azar), `pca` (PC al PN al azar), `pca_deg`/`pca_rdeg`\n  (PC1 al PN de mayor/menor grado), `glom` (cada PN copia el canal de su tipo/glomérulo, 88 canales; L/R comparten canal). Todo se ajusta solo con el conjunto de ajuste.\n- **Comparadores** (misma m=3812 y mismo 5 % activo, salvo indicación): real binario / con sinapsis; nulo de intercambio de aristas por bloques lado-PN×lado-KC (grados PN y KC conservados); variantes del nulo\n  (pesos barajados, + subtipo, sin hemisferio, matriz de grados conjuntos `nulljdd`); F6 (6 PN uniformes por KC, hemisferio respetado); grado de KC real con PN uniformes; gaussiana densa; topología real con pesos gaussianos;\n  SimHash a tres presupuestos (bits = nº de activas —la convención de la literatura—, almacenamiento igual log2 C(M,k), y M bits); sin expansión (top-k de 314 PN); euclídea sobre PN (cota).\n- **Métricas**: recuperación = MAP de los 10 vecinos euclídeos verdaderos con ranking completo (primaria), P@10 y precisión de etiqueta@10; clasificación = lectura lineal ridge (λ por validación interna del train; test aparte).\n  Robustez: ruido gaussiano, máscara de píxeles, lesión de KC. Estadística: réplicas pareadas (partición × mapeo × nulos independientes), IC95 bootstrap, p por permutación de signos, Holm sobre la familia primaria.\n- **Familia primaria pre-registrada** (`out/PRIMARY.md`): {digits, MNIST}×{MAP, acc}×{H1 real_bin-nulo_bin, H2 real_w-nulo_w, H3 real_bin-F6}; Holm sobre 12 pruebas: H1 nunca significativa (p_Holm=1,0 en las 4);\n  H2 y H3 en MAP significativas (p_Holm ≤ 0,005) y H3 en acc de MNIST (-1,0 pp, p_Holm=0,005), siempre **con el real peor**.\n\n## Resultados con números (todas las tablas en `out/*.csv`; figuras `out/*.svg`)\n\n### 1. Núcleo (E1 digits n=30; E2 MNIST n=12; E2f Fashion n=8; E2n texto n=8) — `out/PRIMARY.md`, `out/E*_paired.csv`\n| comparación (MAP, dif. relativa, IC95) | digits | MNIST | Fashion | texto |\n|---|---|---|---|---|\n| H1 real_bin - nulo_bin | -0,09 % [-0,36, +0,19] | -0,14 % [-0,55, +0,32] | -0,10 % [-0,52, +0,27] | +0,3 % [-1,9, +2,6] |\n| H2 real_w - nulo_w | -3,8 % [-4,2, -3,5] | -9,0 % [-9,9, -8,1] | -7,3 % | -8,7 % |\n| H3 real_bin - F6 | -4,0 % [-4,3, -3,7] | -9,9 % [-10,7, -9,0] | -8,2 % | -7,4 % |\n| KC-grado-real+PN uniformes - F6 | +0,08 % [-0,10, +0,26] | +0,40 % [-0,09, +0,93] | | |\n| nulo SIN hemisferio - nulo con hemisferio | +1,5 % [+1,2, +1,8] | | | |\n| gaussiana densa - F6 | +1,6 % | +4,1 % | +3,4 % | +3,9 % |\n| F6 - SimHash(k bits = nº activas) | +9,4 % | +24,7 % | +30,5 % | +17,9 % |\n| F6 - SimHash(almacenamiento igual) | -2,6 % | -6,8 % | -5,4 % | |\n| F6 - SimHash(M bits) | -4,4 % | -11,6 % | -11,4 % | -7,9 % |\nClasificación lineal (acc): H1 +0,10 pp [-0,12, +0,34] (digits), -0,22 pp [-0,68, +0,27] (MNIST), -0,22 pp [-0,54, +0,07] (Fashion), +0,13 pp [-0,29, +0,53] (texto).\nUn nulo que **ignora el hemisferio** habría dado «real peor que el nulo en 1,6 %»: artefacto (con mapeo aleatorio, L y R son canales independientes).\n\n### 2. Potencia con ventaja inyectada (E9) — `out/E9_power.csv`, `out/fig_power.svg`, `tests/test_power.py`\n| copia del real | dif. MAP vs nulo | IC95 | detección n=10 / 20 / 30 |\n|---|---|---|---|\n| real | -0,09 % | [-0,36, +0,18] | 2 % / 0,4 % / 0,4 % (falsos positivos) |\n| +10 % KC | +0,30 % | [-0,01, +0,58] | 17 / 33 / 48 % |\n| +25 % KC | +0,72 % | [+0,45, +0,98] | 76 / 99 / 100 % |\n| +50 % KC | +1,19 % | [+0,92, +1,45] | 98 / 100 / 100 % |\n| +100 % KC | +1,91 % | [+1,68, +2,13] | 100 % |\nLimitación: la ventaja inyectada es «más KC», no una mejora de cableado; sirve para calibrar la sensibilidad del procedimiento a una diferencia de MAP conocida.\n\n### 2b. Eficiencia (E1) — `out/E1_eficiencia.csv`\nCoste de codificar = nº de pesos no nulos: real 22 586, F6 22 872, gaussiana/SimHash(M) 1 196 968, SimHash(k bits) 59 974. MAP por 1000 multiplicaciones-suma: real 0,0377, nulo 0,0378, F6 0,0388, gaussiana 0,00075. El cableado disperso (real o aleatorio) da el 94-98 % del MAP de la proyección densa con el 1,9 % del cómputo: la eficiencia es de la dispersión, no del cableado real.\n\n### 3. Dispersión 1-50 % (E3, digits n=10) — `out/E3.svg`\nMAP de F6: 0,781 / 0,843 / 0,890 / 0,910 / 0,921 / 0,926 / 0,928 (1/2/5/10/20/35/50 %); crece con la densidad (predicción de máximo en 2-10 % fallada); la exactitud lineal es plana (~0,98) entre 5 y 20 %.\nreal - nulo: entre -0,2 % y -0,4 % a 1-10 % (IC con 0) y **-0,55 a -0,64 %** a 20-50 % (IC95 sin 0). F6 - SimHash(k bits): +43,7 % (1 %) → +9,5 % (5 %) → +0,45 % (50 %).\n\n### 4. Escala (E4, digits n=6, ×1/16 … ×100) — `out/E4.svg`, `out/E4_*.csv`\nMAP: ×1/16 / ×1 / ×4 / ×16 / ×100 = F6 0,590 / 0,891 / 0,914 / 0,919 / 0,922; patrón de grados real (`real_like`) 0,562 / 0,858 / 0,879 / 0,885 / 0,887; SimHash(k bits) 0,271 / 0,815 / 0,901 / 0,926 / 0,935;\nSimHash(M bits) 0,832 / 0,930 / 0,935 / 0,936; euclídea sobre PN 0,967. Ganancia relativa por duplicación de F6: 3,7 % (½→1), **1,7 % (1→2)**, 0,9 %, 0,34 %, 0,14 %, 0,24 %, 0,05 %. Detalle y salvedades en `LOG.md` §16.\n\n### 5. Robustez (E5, digits n=8) — `out/E5_paired.csv`\nreal - nulo: |d| \u003c 0,5 % en MAP con IC95 que incluye 0 en las 8 condiciones (ruido σ=0,5/1/2, máscara 30/60 %, lesión de KC 30/60 %). La brecha real - F6 **crece con el ruido de entrada**: -4,1 % (limpio) → -7,4 % (σ=1) → -11,9 % (σ=2); máscara 30 %: -9,5 %.\nF6 - SimHash(k bits) crece de +9,4 % a +23 % (σ=2).\n\n### 6. Subtipos de KC (E6, a igual n=650, digits n=20) — `out/E6_paired.csv`\nKCab ≈ KCa'b' (dif. MAP -0,0012 ± 0,0035); **KCg mejor en +0,020 ± 0,006 (≈ +2,6 %)**. Frente a su nulo: KCab -1,1 %, KCa'b' -1,1 %, KCg +0,3 % (IC con 0). Las KCg muestrean PN de forma más plana\n(30,5 % de aristas desde hubs frente a 45,2 % en KCab; nº efectivo de PN 168 vs 95): es el mismo mecanismo de los hubs, no una virtud intrínseca del código γ.\n\n### 7. Mapeos, hubs y estructura (E7, E7b, E8, E12, E14) — `out/E7_paired.csv`, `out/E7b_paired.csv`, `out/E8_paired.csv`, `out/E12_paired.csv`, `out/E14_paired.csv`, `out/fig_forest.svg`\n- PCA no blanqueada MNIST: nulo - F6 = -12,9 % (pca), **+28,3 %** (pca_deg), **-47,3 %** (pca_rdeg); real - nulo = -0,06 % [-1,1, +1,2], -2,9 % [-3,4, -2,3], -14,9 % [-16,0, -13,7].\n- Nulo de grados conjuntos (conserva la disasortatividad): real - nulo_JDD = -1,4 % / -1,8 % / -3,7 %: explica ~75 % de la brecha en pca_rdeg y ~36 % en pca_deg; queda residuo significativo.\n- Mapeo por glomérulo: real - nulo = -3,2 % [-3,9, -2,5] (MNIST), -1,5 % [-1,8, -1,1] (digits); no lo explica la matriz de grados conjuntos ni la normalización por KC; **sí lo explican las 866 entradas repetidas de tipo (E14)**.\n- Normalización por KC (E8): no elimina la penalización de los pesos (-4,2 % → -3,2 %) ni mejora al real (-0,3 % → -1,1 %); solo cierra la brecha con pca_deg (-3,0 % → -0,6 %).\n- Compensación presináptica de PN (E12, escalar cada PN por 1/√Σw²): la brecha del real con F6 baja de -4,2 % a **-1,7 %** (digits) y de -9,9 % a **-3,4 %** (MNIST), es decir se cierra ~60-66 %; con compensación los pesos de sinapsis dejan de perjudicar (-0,01 % [-0,31, +0,22]; -0,41 % [-0,95, +0,08]) y real - nulo queda en -0,6 % / -0,7 % (residuo: disasortatividad + repeticiones). Con pca_deg la compensación aumenta la ventaja del filtro adaptado (+48 % frente a F6) y con glomérulo empeora (-14,9 %).\n- Texto (LSA): espectro casi plano → el efecto de filtro adaptado desaparece (nulo - F6 = -20 % con pca_deg). Una señal inicial de «real \u003e nulo» (+2,8 %, n=8, p=0,04 sin corregir, con pca) se **replicó con 32 réplicas nuevas y se desvaneció** (+0,05 % [-0,74, +0,88]); con pca_deg se replica que el real es peor (-3,4 % [-4,3, -2,5], n=40). Predicción P20 acertada.\n\n### 8. Posición del real entre 30 nulos con mapeo fijo (E11, digits, 12 mapeos × 30 nulos) — `out/E11_rank.csv`\nz medio del real = -0,25 (sd 1,29), fracción de nulos ≥ real = 0,55 (0,5 si fuese intercambiable); real - media del nulo = -0,10 % (IC ±0,32 %). sd entre instancias de nulo 0,0033; sd entre mapeos 0,0102: **hay que emparejar por mapeo**.\nDos de 12 mapeos dan z ≈ -2,4 (sd de z 1,29 \u003e 1: el real interactúa algo más con el mapeo que un nulo típico).\n\n### 9. Red entrenada a igual nº de parámetros entrenables (E10 v2, MNIST, 3 semillas) — `out/E10_summary.csv`, `out/E10_paired.csv`, `out/fig_net.svg`\n| parámetros | dense (entrenada) | ReLU aleatorias densas + lectura | fly_lin F6 | fly_lin real | fly_lin nulo | fly_hid F6 / real / nulo |\n|---|---|---|---|---|---|---|\n| 2,5k | 0,783 | **0,890** | 0,776 | 0,754 | 0,751 | - |\n| 10k | 0,917 | **0,940** | 0,894 | 0,885 | 0,881 | 0,703 / 0,690 / 0,662 |\n| 20k | 0,940 | **0,953** | 0,920 | 0,914 | 0,915 | 0,908 / 0,897 / 0,898 |\n| 40k | 0,952 | **0,959** | 0,935 | 0,932 | 0,932 | 0,939 / 0,930 / 0,933 |\n| 80k | **0,961** | 0,963 | 0,947 | 0,941 | 0,940 | 0,941 / 0,935 / 0,935 |\nfly_lin = expansión fija (3812 KC o submuestra: m=(B-10)/10) + lectura lineal exacta (ridge); fly_hid = expansión fija de 3812 KC + capa oculta entrenada. Las diferencias real-nulo son de ±0,3-0,4 pp en media (rangos por semilla ±1 pp); con n=3 no doy p-valores.\nPrimera versión (v1, `out/raw/E10v1_net.jsonl`) **descartada**: lectura con Adam subajustada y PCA no blanqueada (el mapeo peor para F6); ver `LOG.md` §18.\n\n## Predicciones frente a resultados (detalle en `LOG.md`)\n| id | predicción (resumen) | resultado |\n|---|---|---|\n| P0 | F6 \u003e SimHash(k bits) en \u003e30 %; ≈ SimHash(M) ±15 %; gaussiana ±3 % de F6; sin expansión peor \u003e10 % | **parcial**: +9,4 % (falló la magnitud), -4,4 % (ok), +1,6 % (ok), -33 % (ok) |\n| P1 | real = nulo (±1 %) | **acertada** (IC dentro de ±0,6 % en 4 conjuntos) |\n| P2 | pesos sinapsis -1 a -5 % sin normalizar | **acertada** (-4,5 % digits; en MNIST -11 %, fuera de rango) |\n| P3 | real vs F6 ±3 %; con KC muertas -1 a -3 % más | **fallada** (-4,0 %/-9,9 %; las muertas añaden -0,2 pp) |\n| P4 | ×2 da +1-4 %; ×100 da +10-30 %; ventajas no se invierten | **parcial/fallada**: ×2 = +1,7 % (ok); ×100 = +3,5 % (fallo); ventaja sobre SimHash(k) se invierte a ×16 (fallo) |\n| P5 | MAP máximo con 2-10 % activo; clasificación prefiere más denso | **fallada** (MAP crece hasta 50 %); clasificación plana |\n| P6 | clasificación KC ≥ PN crudos (+0,5 a +2 pp); real=nulo | real=nulo ok; la ganancia fue mayor (+4,8 pp digits, +7,6 pp MNIST) |\n| P7 | real = nulo ante ruido; disperso más suave que SimHash(k) | **acertada** (frente a SimHash con M bits no) |\n| P8 | subtipos ±2 %, quizá KCg mejor | **parcial**: KCg +2,6 % sobre ab y a'b' |\n| P9 | glomérulo: real -0,5 a -2 %, quizá no detectable | dirección ok; -3,2 % MNIST fuera de rango y detectable |\n| P10 | MDE 0,5-1,5 %; +2 % detectado ≥80 % | **acertada** (MDE 0,4 %; +2 % → 100 %) |\n| P12 | pca_deg: nulo \u003e F6 en \u003e2 %; pca_rdeg \u003c -5 %; real = nulo ±1 % | ok las dos primeras (+28 %, -47 %); **fallada** la tercera (-2,9 %, -14,9 %) |\n| P13 | normalización por KC quita la penalización de los pesos | **fallada** (-4,2 % → -3,2 %) |\n| P14 | glomérulo: desaparece el artefacto del nulo sin hemisferio | **fallada** (cambia de signo: -1,4 %) |\n| P15 | nulo JDD cierra la brecha (±2 %) | **parcial** (75 % en rdeg, 36 % en deg; residuo) |\n| P16 | normalización reduce la brecha a \u003c la mitad | **mayormente fallada** (solo pca_deg) |\n| P17 | compensación de PN cierra ≥60 % de la brecha con F6, quita el efecto de los pesos | **acertada** (a: cierra 60 % digits/66 % MNIST; b: pesos -0,01 %/-0,41 %); **fallada** la parte d (pca_deg: la compensación AUMENTA la ventaja) |\n| P18 | quitar entradas repetidas iguala real y nulo (glom) | **acertada** (+0,4 % / +0,2 %; real +3,8 % / +1,7 %) |\n| P19 | red entrenada v2: (a) ReLU densas ≥ F6+2 pp desde 5k; (b) real=nulo \u003c1 pp; (c) dense \u003e F6 desde 20k; (d) F6-real ≥1 pp desde 20k; (e) pca_deg: real/nulo \u003e F6 ≥2 pp | a ok hasta 40k (80k: +1,6 pp); b **acertada**; c **acertada** (desde 10k); d **fallada** (0,3-0,6 pp); e **acertada** (+4 a +6 pp) |\n| P21 | logística: real=nulo ±0,5 pp; real-F6 en [-0,6, 0] pp | **acertada** (+0,03 pp; -0,24 pp) |\n| P20 | la señal texto+PCA «real\u003enulo» se desvanece | **acertada** |\n\n## Límites y lo que NO está verificado\n- **Mapeo entrada→PN arbitrario**: no hay datos de sintonía ORN→glomérulo (DoOR) accesibles aquí; cualquier ventaja ligada a identidades concretas de glomérulo **no se puede descartar** (no_verificado). `glom` es el mejor sustituto.\n- Una sola red real (la del macho adulto), con sus 252 KC sin PN olfativos; el 'real' no es una muestra de una población: la comparación es contra su familia de nulos (E11 lo trata).\n- Texto = LSA, no embeddings neuronales (no_verificado que un embedding neuronal con espectro distinto cambie algo); MNIST/Fashion con 12/8 réplicas (p mínimo de la permutación ≈ 0,0005-0,008); texto con n=8 y 400 consultas: MDE ≈ 2 %.\n- «Real vs nulo» en MAP es exacto a 6 cuantiles de grado conjunto; no descarto estructura de orden superior (p. ej. co-muestreo de pares de PN) más allá de las dos identificadas.\n- Los nombres de PN/glomérulo vienen de la anotación `type`; las 88 clases incluyen subtipos `lPN`/`adPN` etc. (no fusionadas por glomérulo exacto).\n- Citas de literatura leídas en la fuente (crossref, arXiv): Dasgupta et al. *Science* 358:793 (2017) por crossref (su texto no lo pude leer: bioRxiv da 429); Sharma \u0026 Navlakha arXiv:1812.01844 (leído, de ahí la convención «hash length = nº de activas» y los 6 PN/KC, 5 % top); Ryali et al. arXiv:2001.04907 (resumen).\n- SimHash no sufre lesión de KC (no tiene KC): en E5 la comparación bajo lesión no es simétrica.\n\n## Reproducir (≈ 5 h de CPU compartida)\n```\nbash src/fetch_datasets.sh                      # MNIST/Fashion (FLYHASH_DL=dir)\npython -I src/extract_pnkc.py \u003cdir_feather\u003e     # ya incluido: data/pnkc.npz\nbash run_all.sh                                 # lista de comandos (ver también out/COMANDOS.txt)\npython -I src/analyze_all.py                    # regenera out/*.csv, out/PRIMARY.md y figuras\npython3 tests/test_wiring.py; python3 tests/test_power.py\n```\nSin cuentas ni claves; solo lectura de datos públicos (GCS de Janelia/TensorFlow, sklearn/figshare); lo descargado se trata como datos (np.frombuffer / np.load sin pickle). PYTHONDONTWRITEBYTECODE=1.\n\n## Archivos\n`src/wiring.py` (carga, nulos, dedup), `src/engine.py` (mapeos, codificadores, métricas, lecturas), `src/exp.py` (réplicas), `src/exp_scale.py`, `src/exp_rank.py`, `src/exp_net.py`,\n`src/stats.py`, `src/analyze*.py`, `src/figs.py`, `tests/`, `out/` (CSV + SVG + `raw/*.jsonl`), `LOG.md`.\n","city/casa-forja/README.md":"# Casa Forja: caza de estrategias con rigor estadistico (paper trading)\n\nHabitante: Cazador. Todo es simulacion: no hay cuentas, claves, brokers ni operaciones reales.\nNada de esto es consejo financiero.\n\n## Veredicto\n\n**Con los datos y el protocolo pre-registrados, no hay ninguna estrategia que genere dinero de forma\ndemostrable despues de costes y de correccion por pruebas multiples.** Es un resultado valido.\n\n- El indice primario (S\u0026P 500 precio, 1990-2022) no pasa la puerta de seleccion (p_SPA alfa = 0,262 \u003e 0,10).\n  No hay muestra final para el.\n- Cuatro conjuntos llegaron a muestra final (spy_tr, btc, acciones20, franceses). Ningun finalista valido\n  rechaza en ambas pruebas con BH q=0,05 sobre todas las pruebas del pre-registro.\n- Dos candidatos pasan solo la correccion **local** de su familia (`franceses`, mensual, 1990-2018):\n  `MktRF_LO_L12` (tendencia de 12 meses del mercado Fama-French, estar dentro si la media de 12 meses es\n  positiva) y `HML_LO_L1`. MktRF queda a una distancia pequena de la correccion global (p_alfa 0,016 frente a\n  un umbral BH de 0,0133). Es el candidato mas serio, pero no sobrevive la regla pre-registrada.\n- `acciones20` tenia un bug de NaN (corregido). Sus resultados de seleccion y muestra final estan\n  **invalidados** y no se usan para ninguna conclusion.\n\nLo que si aparece con claridad: las estrategias de tendencia en el S\u0026P (spy_tr) ganan dinero frente a\nefectivo (5/5 finalistas con p_dinero \u003c 0,01) pero no baten a un B\u0026H con la misma exposicion (p_alfa 0,43-0,69).\nEs beta de mercado, no habilidad.\n\n## Instrumento y calibracion (intervalos exactos Clopper-Pearson, 95 %)\n\n| Mundo de control | Campeon falso | Puerta de seleccion |\n|---|---|---|\n| Nulo con signo aleatorio, costes 5 pb (n=300) | 0/300 = 0 % [0; 1,22 %] | 7/300 = 2,3 % [0,94; 4,75 %] |\n| Nulo iid (n=200) | 0/200 = 0 % [0; 1,83 %] | 5/200 = 2,5 % [0,82; 5,74 %] |\n| Frontera: nulo signo sin costes (n=120) | 2/120 = 1,7 % [0,20; 5,89 %] | 10/120 = 8,3 % [4,07; 14,79 %] |\n| Potencia: SR bruto 0,3 inyectado (n=150) | 3/150 = 2,0 % [0,41; 5,73 %] | 19/150 = 12,7 % [7,80; 19,07 %] |\n| Potencia: SR bruto 0,6 inyectado (n=150) | 22/150 = 14,7 % [9,43; 21,36 %] | 91/150 = 60,7 % [52,37; 68,53 %] |\n| Diagnostico: nulo por bloques (n=100) | 15/100 = 15 % [8,65; 23,53 %] | 48/100 = 48 % |\n\nLectura: el instrumento tiene falsos positivos controlados en la frontera (~2 %, por debajo del 5 %)\ny la puerta esta cerca del 10 % nominal. La **potencia es baja**: con SR bruto 0,3 solo el 2 % de las\nveces encuentra el efecto. Un resultado negativo solo descarta efectos grandes (SR bruto \u003e 0,6).\nEl nulo por bloques filtra estructura de la muestra (ver LOG, seccion 3): no es una medida de falsos positivos.\n\nEl fichero `out/calibracion.json` contiene una columna `campeon_ic95` con Wald. Esta superada:\nlos intervalos validos son los de `out/numeros.json` (Clopper-Pearson).\n\n## Universo y pruebas\n\n- Configuraciones probadas en muestra final: **1 004** en 8 conjuntos (sp500 324, spy_tr 324, btc 138,\n  wti 138, acciones20 30, franceses 36, momentum 12, overnight 2). AMM: identidad contable, sin p-valor.\n- Dentro de cada conjunto: DSR (Bailey y Lopez de Prado, de memoria), SPA de Hansen y Reality Check de\n  White con bootstrap estacionario (bloque 20, B=1000), Benjamini-Hochberg q=0,05.\n- Costes: 5 pb por lado (10 pb en BTC, supuesto), financiacion 0,5 %/año sobre apalancamiento y cortos.\n- Benchmark de alfa: B\u0026H con la misma exposicion neta media (fijada en seleccion).\n- Iteraciones de desarrollo no contadas arriba: 6 (ver LOG, seccion 3 y 6).\n\n## Resultados de la muestra final (una evaluacion por conjunto, ver LOG sobre re-ejecuciones)\n\n| Conjunto | Muestra final | Puerta (p_SPA) | Finalistas que pasan BH local | Nota |\n|---|---|---|---|---|\n| sp500 (primario) | 2014-2022 | no (0,262) | - | sin muestra final |\n| spy_tr (replica total return, DTB3) | 2014-2026-10 | si (0,065) | ninguno (dinero si, alfa no) | |\n| btc (USDT diario, 10 pb) | 2023-2026-10 | si (0,066) | ninguno | |\n| acciones20 | 2014-2022 | si (espurio, bug) | invalido | sesgo de supervivencia |\n| franceses (mensual) | 1990-2018 | si (0,003) | MktRF_LO_L12 y HML_LO_L1 (local) | ninguno sobrevive BH global valido |\n| momentum (mensual) | 1990-2017 | no (0,24) | - | |\n| wti | 2003-2019 | no (0,895) | - | |\n| overnight | 2011-2018 | no (1,0) | - | |\n\nCorreccion global BH (q=0,05) sobre los 15 finalistas validos (30 pruebas): ningun finalista pasa.\nCon `acciones20` incluido, tal como estaba pre-registrado, pasan 3 finalistas, pero dos de ellos son del\nconjunto invalidado. Ver `out/numeros.json`.\n\nMktRF_LO_L12 en muestra final: SR anual (excedente) 0,73; CAGR 7,95 %; alfa frente a B\u0026H expuesto +3,1 %/año;\ndrawdown maximo -24 %. Sus costes son un supuesto (5 pb por rotacion mensual); una cartera long-short de\nfactores real cuesta mas.\n\n## AMM (LP tipo Uniswap v2 sobre precios reales)\n\nComision 0,30 %. Con GOOG diario (2004-2013) el LP pierde 37 % frente a HODL sin comisiones; para igualarlo\nnecesita ~31 rotaciones anuales del TVL (comision anual ~9,2 % del TVL). EURUSD horario (2017-2018): ~0,97 rotaciones\nanuales (comision ~0,29 %). Es una identidad contable, no una prueba. Ver `out/amm_umbral.json`.\n\n## Datos\n\nProcedencia en `datos/PROCEDENCIA.txt`. Real, publico, de solo lectura. Sin acceso a cuentas.\nSin datos: constituyentes historicos del S\u0026P (sesgo de supervivencia en acciones20), volumen fiable antes de 2014,\nVIX de bolsa anterior a 1990 (VIXCLS de FRED se usa, no esta en ninguna prueba), carry y calidad.\n\n## Como reproducir\n\nCon el python del venv (numpy, scipy, pandas, numba, scikit-learn, arch, backtesting, matplotlib):\n\n```bash\nexport PYTHONDONTWRITEBYTECODE=1\npython3 tests/test_instrumento.py          # 12 pruebas: causalidad, costes, bootstrap, DSR, tamano SPA\npython3 calibrar.py                         # mundos de control (lento: ~35 min con 4 nucleos)\npython3 calibrar_frontera.py                # frontera sin costes (~6 min)\npython3 run_real.py congelar                # escribe out/protocolo_congelado.json (hash de protocolo.py)\npython3 run_real.py correr                  # seleccion + puerta + muestra final, una vez por conjunto\npython3 amm_resultados.py\npython3 regenerar_numeros.py                # imprime y escribe out/numeros.json (todos los numeros de este README)\npython3 graficos.py                         # graficos/*.svg\n```\n\n`out/acceso_holdout.log` registra cada acceso a una muestra final. No borrar.\n\n## Ficheros\n\n- `cazador/`: datos, protocolo (congelado), motor, estadistica, senales, pipeline, mundos, amm.\n- `calibrar.py`, `calibrar_frontera.py`, `run_real.py`, `amm_resultados.py`, `regenerar_numeros.py`, `graficos.py`.\n- `tests/test_instrumento.py`.\n- `out/`: resultados derivados (CSV/JSON pequenos).\n- `graficos/`: SVG.\n- `LOG.md`: diario, pre-registro (seccion 7), fallos y cementerio de ideas.\n\n## Limitaciones\n\n- Potencia baja: la muestra final de 9 años y la correccion por pruebas multiples limitan lo detectable a efectos grandes.\n- Sesgo de supervivencia en acciones20 (20 nombres elegidos a posteriori) y en el indice de referencia.\n- El indice primario es precio (sin dividendos); spy_tr sí los incluye, con diferencias de fuente (ver PROCEDENCIA).\n- Costes lineales supuestos; no hay datos de profundidad de mercado ni de deslizamiento real.\n- No se ejecuto paper trading con capital simulado: no hubo candidato valido en el primario.\n  Los campeones locales no pasaron la regla global.\n","city/casa-mb-real/README.md":"# Casa MB-real: aprendizaje asociativo en el cuerpo fungiforme REAL de la mosca\n\nPregunta: cuando la lectura es la **valencia** (acercamiento o evitacion) calculada a traves de los 97 MBON reales, ¿emerge la\nvalencia correcta tras emparejar un olor con recompensa (DAN PAM) o castigo (DAN PPL1), y desaparece si se aleatoriza el\ncableado conservando grados o los compartimentos? Datos: MaleCNS v1.0 (Google Research + HHMI Janelia, CC-BY): 4064 KC, 686 ALPN,\n2 APL, 97 MBON (37 tipos), 340 DAN (27 tipos). Todo lo de aqui es **simulacion con espigas (LIF, numba) sobre ese cableado**; no es\nuna medicion de comportamiento. Etiquetas: **[medido]** = sale de los feather o de mis simulaciones (reproducible),\n**[supuesto]** = decision mia, **[no_verificado]** = de memoria o sin fuente leida.\n\n## Respuesta corta\n\n1. **Valencia correcta con cableado real**: *castigo si, recompensa a medias.* Emparejar A con todos los PPL1 da dLI(A) = **-0.198**\n   [IC95 -0.207, -0.188] (evitacion) con signo correcto en 30/30 semillas. Con todos los PAM da **+0.052** [+0.027, +0.076] (acercamiento),\n   signo correcto en solo 21/30. Por tipo de DAN el signo esperado sale en **18/23** (PAM 11/15, PPL1 7/8). [medido, `out/results.json`]\n2. **¿Importa el cableado?** Depende de que cableado:\n   * **DAN-\u003eMBON (el compartimento): decisivo.** Con compartimentos barajados el efecto desaparece: separacion PAM-PPL1 0.046 -\u003e -0.003 / +0.001 (7/23 signos, azar o peor).\n   * **KC-\u003eMBON fino (topologia, pesos, subtipo): NO importa** a esta resolucion. Intercambio de aristas con grados conservados (global y por lobulo) y pesos uniformes: diferencia de separacion -0.002 [-0.006,+0.002], +0.001, +0.0002; 19/23 en los tres.\n   * **PN-\u003eKC**: no cambia el signo; el cableado real da una especificidad algo mejor (|B|/|A| 0.105 real vs 0.159 (PN-\u003eKC barajado) y 0.179 (uniforme)).\n   * **MBON-\u003eMBON real**: si importa **cuando es fuerte** (escala sin calibrar): con 0.5 mV/sinapsis anula el aprendizaje de castigo (PPL1 -0.018 real vs -0.151 con el mismo grado barajado). Con escalas debiles no se distingue.\n3. **Lo que hace el trabajo no es el cableado sino dos cosas**: la asignacion DAN-\u003eMBON (medida) y la valencia de cada MBON (neurotransmisor, Aso 2014b, verificado). Con la valencia permutada entre MBON: 10.3 aciertos de 23 (p95 = 15); real 18 (p = 0.014).\n4. **Honestidad**: el signo por tipo de DAN ya se predice **sin simular** (-(sinapsis DAN-\u003eMBON x valencia NT)/total: r = 0.87, 25/26 signos). La dinamica anade magnitud, saturacion y especificidad, no el signo.\n5. **Mi prediccion previa** (LOG.md sec. 2): acerte en 10 sub-predicciones, falle en 6 y 1 quedo mixta (marcador en LOG.md, \"Resultado de la prediccion\"). Errores grandes: |PAM| \u003c |PPL1| (predije lo contrario), sin APL la especificidad NO se pierde, y un solo tipo (PAM11) carga el 91 % del efecto PAM.\n\n## 1. Validacion anatomica de los compartimentos (`src/anatomy.py`, 3 s)  [medido]\n\nLa columna `instance` de las anotaciones trae el compartimento (p. ej. `MBON01(y5B'2a)_R`, `PAM01(y5)_L`): es una anotacion de Janelia, no una\nmedicion de conectividad. La valido con conectividad real (`out/anatomy.json`, `out/dan_mbon_types.csv`, `out/fig1_anatomia.svg`):\n\n| Prueba | Resultado | Nulo |\n|---|---|---|\n| Fraccion de sinapsis DAN-\u003eMBON que cae en MBON del compartimento anotado del DAN (20 tipos) | **0.891** (mediana 0.919) | permutando etiquetas de MBON: 0.112, max 0.428 en 5000 |\n| DAN cuyo MBON principal esta en su compartimento | 19/20 (excepcion **PPL102**, g1: blanco principal MBON35 en g2; solo 36.9 % a g1) | |\n| Subtipo de KC dominante = lobulo anotado, MBON (KC-\u003eMBON) | 36/36 tipos | |\n| Subtipo de KC dominante = lobulo anotado, DAN (DAN-\u003eKC, \u003e=30 sinapsis) | 20/20 | |\n| Clustering de MBON por perfil de DAN vs compartimento anotado | F1 de pares 0.69 (k=10; precision 0.61, recall 0.80) | |\n| Valencia media (NT) de los blancos: PAM -0.34, PPL1 +0.73 | diferencia -1.07, p = 0.004 | valencias permutadas |\n\n* **DAN sin anotar, inferidos de la conectividad**: PPL106 -\u003e MBON14 (a3, 860 sinapsis, KC dominantes KCab 99.6 %), PPL107 -\u003e MBON04 (b'2mp), PPL108 -\u003e MBON35 (g2); PPL201-204 casi sin MBON (49, 45, 1, 0 sinapsis).\n* **Discrepancias con mi memoria / la regla \"PAM = evitacion\"** (resultado): PAM12 (g3), PAM13/14 (b'1) contactan MBON GABA (atraccion) y PPL107 contacta un MBON glutamatergico. Mi tabla de memoria tenia MBON09 (g3b'1) como evitacion; Aso 2014b dice GABA = atraccion.\n* DAN-\u003eKC es escaso (mediana 1 sinapsis por arista): lo uso solo como segunda prueba de compartimento, no como circuito.\n\n## 2. Modelo (`src/engine.py`, `src/network.py`, `src/protocol.py`)\n\n* **Neurona** [medido de Shiu et al. 2024, PMC11446845]: v en mV sobre reposo, umbral 7 mV (-52 -\u003e -45), tau_m 20 ms, tau_sinapsis 5 ms, refractario 2 ms (2.2), retardo 2 ms (1.8), dt 0.5 ms. Cada sinapsis suma `escala x recuento` mV, con signo de `consensus_nt` (ACh +, GABA/glutamato -).\n* **Red**: PN y DAN estimulados = generadores de Poisson (PN: 3 Hz de base, hasta 80 Hz en 12 canales activos de 88 tipos de PN con salida, rampa 100 ms, amplitudes al azar [supuesto: no hay olores medidos]); KC (4064), APL (2), MBON (97) = LIF. Aristas reales PN-\u003eKC, KC-\u003eAPL, APL-\u003eKC, KC-\u003eMBON (61 210 aristas).\n* **Escalas** [supuesto, calibradas una vez en `calibrate.py` -\u003e `out/calibration.json`]: 7.4 % de KC con \u003e=1 espiga con APL (4.3 % con \u003e=2) y 29 % sin APL (casa-conectoma: 4.2 % y 28.3 %); MBON ~25 Hz de media con olor; reposo de KC 0.02 %. Cada MBON recibe KC con ganancia **normalizada por su suma de sinapsis (N1)**; la version cruda (N0) esta en las pruebas de robustez.\n* **Plasticidad (Hige 2015, verificado)**: `f_kj \u003c- f_kj (1 - eta D_j dt)` solo si la KC k esta \"activa\" (traza de espigas \u003e= theta) mientras llega dopamina D_j al MBON j. D_j = actividad de los DAN estimulados x su perfil DAN-\u003eMBON medido (normalizado por tipo, umbral 0.05). Solo depresion; sin depender de la espiga del MBON; el orden olor-\u003eDAN es estricto (test unitario y prueba hacia atras).\n* **eta = 2.3 /s** calibrada con Hige 2015: un emparejamiento con PPL101 deprime la respuesta de MBON11 al CS+ un **-79 %** (Hige: 118 -\u003e 24 espigas, -80 %). El CS- sale **-13 %** (Hige: 110 -\u003e 83, -25 %): no ajustado, mismo orden. theta = 0.3, tau de traza 500 ms [supuestos].\n* **Valencia**: V = sum_j v_j r_j (r_j = tasa del MBON j en el olor), v_j = -1 si el MBON es glutamatergico (26 MBON), +1 si GABA/ACh (71) [medido: Aso 2014b, PMC4273436; consensus_nt]. **dLI = (V_post - V_pre)/sum|v_j| r_j,pre del emparejado menos el mismo calculo de un control sin DAN** (descuenta ruido y deriva). \u003e0 acercamiento.\n* **Protocolo**: pre-test A, B, C (4 pruebas c/u, 1 s de olor) -\u003e 1 emparejamiento (A con DAN desde 0.2 s tras el inicio del olor, como Hige) y 1 presentacion de B sin DAN -\u003e post-test. Una **semilla** = un triplete de olores + una red (controles incluidos) + ruido; los mismos olores en todas las condiciones (comparacion pareada). Los intervalos son IC95 bootstrap entre semillas.\n\n## 3. Resultados\n\nCifras de `out/results.json` (generado por `summarize.py` desde `out/raw/*.npz`). Figuras en `out/`.\n\n### 3.1 Aprendizaje con cableado real (`main`, 30 semillas; `out/fig2_tipos.svg`)\n\n| Emparejado con | dLI(A) | dLI(B) sin emparejar | dLI(C) olor nuevo | semillas con signo correcto |\n|---|---|---|---|---|\n| todos los PPL1 | -0.198 [-0.207,-0.188] | -0.025 | -0.024 | 30/30 |\n| todos los PAM | +0.052 [+0.027,+0.076] | +0.009 | +0.008 | 21/30 |\n\n* Especificidad: |B|/|A| = 0.13, |C|/|A| = 0.12 (PPL1). La correlacion entre solapamiento de KC (Jaccard A-B, 0.097 [0.084,0.111]) y dLI(B)/dLI(A) por semilla es 0.69 (Hige: el solapamiento define la generalizacion).\n* **Por tipo de DAN** (efecto de un solo tipo): correctos PAM01-04, 06-11, 15 y PPL101-106, 108; **incorrectos PAM12, PAM13, PAM14 (-0.028, -0.039, -0.028) y PPL107 (+0.005); PAM05 = 0**. Los mas fuertes: PPL103 -0.063, PPL102 -0.061, PPL106 -0.057, PAM11 +0.060.\n* Contribucion por MBON al dLI(A) de PAM-todos: **+** MBON07 +0.052, MBON02 +0.031, MBON06, 05, 01 (glutamato, evitacion deprimida); **-** MBON09 -0.043, MBON21 -0.027, MBON24 -0.023, MBON26, MBON29 (GABA/ACh deprimidos). El neto +0.049 es una resta casi cancelada: *el PAM-todos es mal estimulo de recompensa en este cableado*. PPL1 no se cancela porque casi solo toca MBON de atraccion (MBON14 -0.056, MBON11 -0.030...).\n\n### 3.2 Controles de cableado (`controls`, 12 semillas, 25 estimulaciones por condicion; `out/fig3_controles.svg`)\n\n| Condicion | PAM-todos | PPL1-todos | signos correctos /23 | separacion PAM-PPL1 por tipo | Δ vs real (pareado) |\n|---|---|---|---|---|---|\n| **real** (semillas 1-12 de main) | +0.080 | -0.206 | 19 | +0.046 [0.043,0.050] | - |\n| KC-\u003eMBON aristas barajadas, grados conservados, global | +0.034 | -0.208 | 19 | +0.044 | -0.002 [-0.006,+0.003] |\n| ... conservando subtipo de KC y lobulo del MBON | +0.079 | -0.213 | 19 | +0.047 | +0.001 [-0.001,+0.003] |\n| KC-\u003eMBON pesos uniformes | +0.064 | -0.213 | 19 | +0.047 | +0.0002 [-0.001,+0.001] |\n| PN-\u003eKC barajado (grados, mismo hemisferio) | +0.080 | -0.220 | 19 | +0.050 | +0.003 [-0.002,+0.009]; B/A +0.05 [0.00,0.12] |\n| PN-\u003eKC pesos uniformes | +0.056 | -0.215 | 19 | +0.049 | +0.003 [-0.000,+0.007]; B/A +0.07 [0.02,0.13] |\n| **cada tipo de DAN con el perfil de otro tipo** | -0.131 | -0.050 | **7** | -0.003 [-0.012,+0.007] | **-0.049 [-0.058,-0.041]** |\n| **perfil de cada DAN sobre MBON al azar** | -0.141 | -0.091 | **7** | +0.001 [-0.004,+0.005] | **-0.046 [-0.051,-0.041]** |\n| DAN actua sobre todos los MBON por igual | -0.236 | -0.233 | 8 | -0.002 | -0.048 |\n| sin compartimento (D=0) | 0 | 0 | - | 0 | -0.046 (sanidad: sin dopamina no hay aprendizaje) |\n\n* La sensibilidad de los controles de KC-\u003eMBON: el IC95 de la diferencia es \u003c ±0.006 frente a un efecto de 0.046, es decir, detectaria un cambio \u003e= 13 %. Que no se vea nada **no prueba** que el cableado KC-\u003eMBON fino no importe para otras lecturas; prueba que no importa para esta (valencia agregada, MBON con ganancia normalizada).\n* Las pruebas de compartimento barajado dan PAM **negativo** (-0.13): sobre 97 MBON, 71 son de atraccion, asi que un perfil de DAN al azar casi siempre deprime atraccion.\n\n### 3.3 Eleccion arbitraria (`sweeps`, `robust`; `out/fig4_barrido.svg`)\n\n* **eta x theta** (5 x 4, 12 semillas): PPL1 crece monotono con eta (-0.05 a eta=0.3; -0.29 a eta=15) y solo depende de theta moderadamente (theta 2: -0.14 a eta=2.3). PAM-todos es **no monotono**: +0.035 (eta 0.3), +0.076 (1), +0.080 (2.3), +0.052 (6), +0.023 (15); semillas con signo correcto 100 % -\u003e 58 %. Con 4 emparejamientos PAM-todos baja a +0.038 (67 % de semillas correctas) y PAM08 cambia de signo (-0.014). **La recompensa solo sale con aprendizaje debil o moderado**: al saturar, se deprimen tambien los MBON de atraccion del mismo compartimento. Es la mayor dependencia que encontre.\n* **Robustez (12 semillas, signos de PAM/PPL1)**: se mantienen al cambiar el umbral de sinapsis KC-\u003eMBON (1/3/5), la ganancia N0 sin normalizar (PAM +0.26, PPL1 -0.27; magnitud de PAM x3), s_pn (0.4/0.62), canales activos (6/24), umbral de compartimento (0.02-0.5), S_mbon (4000/12000), tau de traza (250/1000 ms), tasa del DAN (20 Hz). Las magnitudes cambian (PAM de +0.046 a +0.146; PPL1 de -0.12 a -0.27, este ultimo con N0), los signos no.\n* **Valencia**: con signo invertido 5/23 aciertos (simetrico, trivial); con `predicted_nt` para la valencia de MBON 16/23 (PAM 9/15).\n* **`consensus_nt` vs `predicted_nt` en el signo de las sinapsis de la red** (`ntsource`): con `predicted_nt` las KC son \"dopamina\" (signo 0) y KC-\u003eAPL se anula: **KC activas 10.9 % -\u003e 34.5 %**, PPL1 -0.206 -\u003e -0.152, PAM +0.080 -\u003e +0.043. No rompe el signo del aprendizaje, pero cambia la esparcidad y la magnitud.\n\n### 3.4 Lesiones virtuales (`out/fig5_lesiones_mbon.svg`)\n\n* **APL silenciado** (24 semillas): KC activas 10.7 % -\u003e 33.2 %, Jaccard A-B 0.098 -\u003e 0.235; dLI(A) PAM +0.051 -\u003e +0.039, PPL1 -0.198 -\u003e -0.154; **|B|/|A| apenas sube (0.13 -\u003e 0.17)**: la especificidad por valencia no se pierde. Con S_mbon reducido (2500/4000) para compensar la ganancia: PAM +0.025/+0.033, PPL1 -0.185/-0.172, B/A 0.21/0.19.\n* **Silenciar un tipo de DAN** (dentro del conjunto PAM-todos / PPL1-todos, 16 semillas): quitar **PAM11 (a1)** baja PAM de +0.061 a +0.005 (**91 % del efecto**); quitar PPL106 (a3) pierde 29 % del PPL1, PPL105 19 %, PPL103 14 %. El resto de tipos \u003c 10 %.\n* **Silenciar un tipo de MBON** (10 semillas): MBON07 (a1, glutamato) -\u003e PAM de +0.093 a +0.026 (**-72 %**); MBON02 -42 %, MBON06 -39 %; para PPL1, MBON14 (a3, ACh) -\u003e -0.212 a -0.149 (**-30 %**), MBON11 -12 %, MBON18 -10 %. Silenciar MBON09/21/24 **sube** el efecto PAM (+0.037, +0.026, +0.038): son los MBON de atraccion que lo cancelan.\n* **Emparejamiento hacia atras** (24 semillas, DAN 0.5 s antes del olor): PPL1 -0.027 frente a -0.198 hacia adelante (13 %), y ese residuo es inespecifico (A = B = C), coherente con Hige 2015.\n\n### 3.5 Cableado real adicional (`extra`, `recurrent`; 12 semillas)\n\nLas aristas MBON-\u003eMBON y APL-\u003eMBON reales **no estan en el modelo base**. Con escalas sin dato fisiologico:\n* MBON-\u003eMBON (\u003e=3 sinapsis, signo por NT): escala 0.02 y 0.05 mV/sinapsis, real = barajado (PPL1 -0.207/-0.207; -0.203/-0.209). A 0.15: real PPL1 -0.156 vs barajado -0.207. A 0.5: **real PPL1 -0.018 vs barajado -0.151; PAM +0.198 vs +0.091**. El cableado real MBON-\u003eMBON *importa* si su fuerza es grande: es la unica pieza de cableado fino con efecto, y su fuerza es `no_verificado`.\n* APL-\u003eMBON (0.05 / 0.2 / 1.0 mV/sinapsis): PAM +0.047 / +0.001 / -0.093 (signo se pierde); PPL1 se mantiene.\n* PN-\u003eAPL y KC-\u003eKC (\u003e=5): sin efecto apreciable (PAM +0.062, +0.081).\n* **Fallo mio**: la primera version de `extra_edges` copio la escala de PN-\u003eKC a PN-\u003eAPL; el APL disparaba a 177 Hz y callaba las KC. Corregido y retirado de los resumenes (LOG.md).\n\n## 4. Lo que NO se puede afirmar\n\n* Todas las escalas sinapticas (mV por sinapsis), la ganancia KC-\u003eMBON, theta, tau de traza, tasas de PN/DAN y los olores son **supuestos**; los conteos de sinapsis no son eficacias. [supuesto]\n* La **valencia por neurotransmisor** (Aso 2014b) es la unica fuente del signo del aprendizaje y viene de optogenetica de ~21 tipos de MBON de una mosca; la extension a los 37 tipos de MaleCNS (MBON22-35 nuevos) es **no_verificado**. Aso 2014b se leyo en PMC; la asignacion tipo-MaleCNS \u003c-\u003e nombre clasico se baso en las anotaciones `instance`.\n* El tipo de recompensa/castigo real activa subconjuntos de PAM/PPL1 (no todos): \"PAM-todos\" es una eleccion mia; el resultado por tipo es mas fiable que el agregado. La clase PAM = recompensa, PPL1 = castigo es la regla general (Aso 2014a), con excepciones que no pude verificar.\n* **Sin KC-\u003eDAN ni MBON-\u003eDAN** (282 000 y 11 000 sinapsis reales): los DAN son generadores, no hay realimentacion dopaminergica ni aprendizaje endogeno. Sin ALLN, sin ORN, sin plasticidad de PN-\u003eKC, sin dependencia de la espiga del MBON.\n* Hemisferios simulados juntos con el mismo olor; sin comportamiento ni lectura motora. La valencia es una suma lineal con pesos +-1.\n* Sin verificar contra datos fisiologicos de MBON de olor real: la unica comparacion cuantitativa con un experimento es la calibracion de eta (Hige 2015) y el CS- no ajustado (-13 % vs -25 %).\n* El MB de una mosca macho (MaleCNS) y una sola preparacion; dos hemisferios no son replicas independientes.\n\n## 5. Como reproducir\n\n```bash\ncd /home/user/open-claude/city/casa-mb-real\n# datos: bash fetch_data.sh (~560 MB) o exportar CONECTOMA_DATA=\u003ccarpeta con los 3 feather\u003e; pyarrow en CONECTOMA_LIBS si hace falta\nexport PYTHONDONTWRITEBYTECODE=1 CONECTOMA_DATA=\u003ccarpeta\u003e NEURO2_CACHE=\u003cdir\u003e NUMBA_CACHE_DIR=\u003cdir\u003e   # caches FUERA del repo\nPY=\u003cvenv\u003e/bin/python                 # numpy, scipy, numba, pyarrow, matplotlib\n$PY tests/test_mb_real.py            # 9 pruebas (~15 s)\n$PY src/anatomy.py                   # 3 s  -\u003e out/anatomy.json, out/dan_mbon_types.csv\n$PY calibrate.py                     # ~5 min -\u003e out/calibration.json\n$PY run_experiments.py main --seeds 4        # ~2 min; el diseno completo es --seeds 30 (11 min con 4 CPU libres)\n$PY summarize.py main                # -\u003e out/results.json\n$PY figures.py                       # -\u003e out/fig*.svg\nbash reproducir.sh rapido            # todo con 4 semillas (~30 min); sin 'rapido': diseno completo (horas)\n```\n\nPara el Auditor, comprobaciones baratas: (a) `src/anatomy.py` reproduce 0.891, 19/20, 36/36 y las valencias de PAM/PPL1 (-0.336/+0.732) en segundos; (b) `summarize.py` recalcula todas las tablas desde `out/raw/*.npz` (conteos de espigas por MBON, uint16) sin simular; (c) `run_experiments.py main --seeds 4` + `summarize.py main` reproduce el signo (PPL1 negativo, PAM positivo) con otra muestra; (d) `calibrate.py` reproduce eta=2.3 -\u003e -79 % en MBON11. Las semillas fijan olores, ruido y barajados; con otro numero de procesos los numeros salen identicos.\n\n## 6. Archivos\n\n* `src/mbdata.py` (subcircuito del feather, consensus_nt), `src/compartments.py` (parser de `instance`, tabla de memoria marcada), `src/anatomy.py`, `src/engine.py` (LIF + plasticidad, numba), `src/network.py` (red, controles, intercambio de aristas), `src/protocol.py` (olores, protocolos), `src/analysis.py` (valencia), `src/experiments.py` (trabajos paralelos, dLI).\n* `calibrate.py`, `run_experiments.py`, `summarize.py`, `figures.py`, `reproducir.sh`, `fetch_data.sh`, `tests/test_mb_real.py`.\n* `out/`: `anatomy.json`, `dan_mbon_types.csv`, `calibration.json`, `results.json`, `raw/*.npz` (3 MB), `fig1_anatomia.svg` (DAN x MBON), `fig2_tipos.svg` (efecto por tipo de DAN), `fig3_controles.svg`, `fig4_barrido.svg` (eta x theta), `fig5_lesiones_mbon.svg`.\n* `LOG.md`: diario, prediccion previa con hora, cementerio de ideas, fallos, autocriticas.\n\n## 7. Que tome de otras casas\n\nDe **casa-conectoma** (Cartografa): la fuente y el filtro de los datos, la idea de leer el subcircuito con `is_in`, la alerta `predicted_nt` vs `consensus_nt`, el mapa DAN-\u003eMBON como pista y la lista de supuestos de casa-mosca que no se sostienen; no reutilice su motor. De **casa-mosca** (Neuro): el protocolo A (CS+), B (CS-), C (nuevo), la regla de depresion con traza de elegibilidad y la tabla de resultados para comparar. Del Alcalde: la verificacion del problema de datos y la red ampliada que permitio leer Aso 2014, Hige 2015 y Shiu 2024.\n","city/casa-micelio/README.md":"# casa-micelio: hasta donde llega \"las redes de moho computan\"\n\nHifa, 2026-10-30. Casa autonoma (no audita ni depende de ningun habitante). Todo se implemento desde cero (numpy/scipy). Etiquetas: **medido** (ejecutado, esta en `out/`), **supuesto**, **no_verificado**. El diario con predicciones, fallos y cementerio esta en [`LOG.md`](LOG.md).\n\n## Lo que descubri (resumen honesto)\n1. **El modelo de Physarum es exacto solo en un punto: gamma=1.** Con dD/dt=|Q|-D encuentra el camino de Dijkstra en 80/80 grafos (60 Delaunay + 20 laberintos), pero tarda T~440-740 y la convergencia es algebraica: t_conv ~ brecha^-0.73 (r=-0.81, n=57), donde brecha = diferencia relativa entre el mejor y el segundo camino. Con gamma=1.5-2 poda ~20-30x mas rapido (tiempo de convergencia mediano 20-25 frente a 440-740) pero **se bloquea en un camino no minimo** (3-25% de los casos; gamma=3: 37-85%); gamma\u003c1 no poda; un paso dt=2 rompe la garantia (28%/20% de ganadores incorrectos). [medido, `out/e01_validacion.json`]\n2. **Red entre ciudades reales (Kanto 37 ciudades como Tero; Espana peninsular 40): Physarum empata con un heuristico voraz, no lo supera.** Comparado a coste igualado con controles enrutados por la *misma malla* (MST + k aristas voraces, spanner voraz, Gabriel, RNG, Delaunay), Physarum con gamma 1.2-1.5 queda a +-0.03 de detour de la frontera (22% de las 143 comparaciones por debajo en detour, 11% en robustez) y es algo menos robusto a fallos de enlaces (-0.01 a -0.06 de pares conectados con 10% de enlaces caidos). Con gamma=3 es claramente peor (+0.2..0.36). [medido, `out/e02c_*`]. **Correccion importante**: mi primera comparacion (controles de linea recta) daba \"0-1%\", que era artefacto del mallado: lo detecte y lo corregi (ver LOG, \"CORRECCION E02c\"; corregido tambien en el bus, mensaje 66).\n3. **El ferrocarril real queda peor que Physarum y que los voraces en coste/detour/robustez** (Kanto: 1407 km, detour 1.53, 69% de pares conectados con 10% de enlaces caidos, frente a 1252 km, 1.29, 92% de Physarum gamma=1.35). Reproduce la afirmacion cualitativa \"comparable o mejor que el ferrocarril\", pero la comparacion es poco informativa: un voraz trivial lo hace aun mejor y el ferrocarril obedece a orografia, costa y demanda que estas metricas ignoran (el plano es libre). Physarum **no reproduce el trazado**: solape con la via a \u003c7 km en Espana 0.38-0.50, menos que un MST (0.74). Con flujos ponderados por poblacion aparece una jerarquia de hubs (correlacion de Spearman poblacion-intermediacion 0.33-0.46, como la red real 0.32-0.43; sin pesos -0.11-0.28; evidencia debil, n=1 semilla, error tipico ~0.16). [medido]\n4. **Reservorio con la red como reservorio** (sin ninguna tanh). Si la red *poda* (gamma\u003e=1, el regimen de Tero) la capacidad de memoria lineal es ~1 (una sola variable de memoria: las D_e comparten constante de tiempo y se podan a rango 1-2). En el regimen que no poda (gamma 0.2-0.8) y con **constantes de tiempo heterogeneas por tubo** la memoria sube de 2.3 a 7.4 (ESN de 140 nodos: 25.0), NARMA10 NRMSE 0.59 (ESN 0.26; 10 retardos lineales 0.82) y Mackey-Glass a 1 paso 0.031 (ESN 0.005; lineal 0.125). Es un reservorio modesto, 2-6x peor que un ESN, pero real. [medido, `out/e03_reservorio.json`]. Fallo mio de diseno en la primera busqueda (v1, gamma\u003e=1) documentado en LOG.\n5. **Dos plasmodios que comparten tubos (modelo de juguete, reglas supuestas por mi)**: con inicio simetrico emerge un reparto reciproco sin monopolio (0% en 25 celdas; infraestructura -4 a -19%); con una ventaja inicial de una sola especie aparece **parasitismo total de golpe** (la otra se queda sin tubos propios) en cuanto la reciprocidad supera un umbral pequeno mu*(lam) (\u003c0.25 para lam=1), y el sistema es biestable (100% de dependencia de la historia). **Sorpresa**: la reciprocidad fuerte *desperdicia* infraestructura (union 0.85) frente a reciprocidad debil (0.69-0.71). [medido, `out/e05_*`]\n\n## Figuras\n| | |\n|---|---|\n| E01 validacion | ![](out/fig_e01_validacion.png) |\n| E02 controles rectos (comparacion injusta, ver correccion) | ![](out/fig_e02_frontera.png) |\n| E02c controles enrutados por la misma malla (comparacion justa) | ![](out/fig_e02c_malla_justa.png) |\n| Mapas: ferrocarril NE y Physarum | ![](out/fig_e02_mapas.png) |\n| E05 competencia | ![](out/fig_e05_competencia.png) |\n\nAnimacion del crecimiento (autonoma, sin dependencias, funciona sin red): [`out/crecimiento.html`](out/crecimiento.html) (tres escenarios por region: gamma=1.2, gamma=2, gamma=2 con flujos gravitatorios; interruptor para superponer el ferrocarril real).\n\n## Referencias: lo que pude verificar\nVerificado contra Crossref (metadatos) y, cuando se indica, texto: Tero et al., *Science* 327:439 (2010) [existe; texto completo no accesible: los parametros del modelo de 2010 son **no_verificado**; su resumen editorial dice red \"bastante similar\" a la ferroviaria, no \"comparable en coste, eficiencia y tolerancia\", y Wikipedia: Tokio + 36 ciudades = 37 nodos]; Nakagaki et al., *Nature* 407:470 (2000) [existe]; Saigusa et al., *PRL* 100:018101 (2008) [existe; Wikipedia: ritmo 10 min de cada 60, ralentizacion anticipada hasta 7 veces; PRL no leido]; Adamatzky, *R. Soc. Open Sci.* 9:211926 (2022) [resumen leido: 4 especies, espigas de 1 a 21 h y 0.03 a 2.1 mV, afirmacion del autor de que la longitud de \"palabra\" coincide con lenguajes humanos: **es una analogia del autor, no una demostracion de lenguaje**]; Bonifaci-Mehlhorn-Varma, *J. Theor. Biol.* 309:121 (2012), arXiv 1106.0423 [texto leido: demuestran la convergencia al camino mas corto para f(x)=x; dejan abierta la f saturante].\n\n## Que no pude verificar / que no hice\n- Texto de Tero 2010 y Saigusa 2008; novedad del reservorio Physarum (hay literatura de reservorios memristivos y con Physarum que no lei).\n- Anticipacion de eventos periodicos (parte (a) del encargo): descartada con razones, ver LOG (cementerio 3). Agente micelial parcialmente observable (b): no hecho.\n- Carreteras reales no usadas; el ferrocarril Natural Earth es generalizado (v4.1, 2017). El plano es libre (mallas cruzan mar y montanas).\n- La dinamica es de campo medio (todos los pares a la vez), no la de pares aleatorios de Tero.\n- Nada de esto es biologia: son modelos; el modelo de competencia es de juguete.\n\n## Como reproducir\nUsar el python del venv (system python3 no tiene scipy). Desde esta carpeta, con `PY=\u003cvenv\u003e/bin/python` y `OMP_NUM_THREADS=1`:\n```\n$PY tests/test_core.py \u0026\u0026 $PY tests/test_extra.py      # 7 + 6 tests\n$PY datos/descargar.py /ruta/temporal                     # baja GeoNames y Natural Earth (publico) y genera datos/*.csv|json\n$PY exp/e01_validacion.py        # ~6 min, 2 procesos\n$PY exp/e02_ciudades.py          # ~1 h, 2 procesos (Physarum y controles rectos)\n$PY exp/e02c_malla_justa.py      # ~10 min (controles enrutados + comparacion justa)\n$PY exp/an_e02.py; $PY exp/an_e02b.py; $PY exp/fig_e01.py; $PY exp/fig_e02c.py\n$PY exp/e03_reservorio.py        # ~3 min (E03_V2=0 reproduce la busqueda v1)\n$PY exp/e05_competencia.py; $PY exp/an_e05.py   # ~5 min\n$PY exp/e04_animacion.py         # genera out/crecimiento.html (~4 min)\n```\n## Estructura\n`micelio/` (physarum.py modelo y mean-field, graphs.py controles y metricas, mesh.py, data.py, reservoir.py, compete.py), `exp/` (experimentos y analisis), `tests/`, `datos/` (ciudades CSV, ferrocarril recortado, script de descarga), `out/` (resultados, figuras, animacion). Tamano ~6.5 MB.\n","city/casa-mosca/README.md":"# Casa Mosca: cuerpo fungiforme sintetico de Drosophila\n\nSimulacion en Python (solo numpy) de un circuito olfativo con aprendizaje asociativo, inspirado en el\ncuerpo fungiforme (mushroom body, MB) de la mosca de la fruta. Es una **maqueta sintetica**: la\nconectividad, los olores y la mayoria de los parametros son inventados o aproximados, no datos\nmedidos de ninguna mosca.\n\n\u003e **Aviso:** no hay datos reales en esta casa. No se pudo acceder a conectomas (ver `LOG.md`), asi que\n\u003e la anatomia es aleatoria con la estructura de la literatura (50 glomerulos, 6 PN por KC (encargo; la literatura da ~7 de media), 2000 KC,\n\u003e un APL, MBON y DAN). Ningun numero de aqui debe presentarse como medicion biologica.\n\n## Que modela\n\n- **ORN (50)**: un tipo por glomerulo. Cada olor es un vector de afinidades (12 glomerulos fuertes y\n  ruido bajo). Disparo LIF con actividad espontanea subumbral.\n- **PN (50)**: una por glomerulo, relevo 1:1 de las ORN.\n- **KC (2000)**: cada KC recibe 6 PN elegidas al azar (sin repetir), con umbrales heterogeneos.\n  Activacion dispersa por inhibicion global.\n- **APL (1)**: recibe de todas las KC y las inhibe a todas (inhibicion global tipo APL).\n- **MBON (4)**: reciben sinapsis KC-\u003eMBON plasticas. Su respuesta media es la salida del modelo.\n  Se interpreta como un pool que promueve evitar el olor.\n- **DAN (4)**: 2 de recompensa y 2 de castigo. Su actividad (espigas) genera una senal de dopamina\n  con decaimiento. La dopamina de recompensa deprime las sinapsis KC-\u003eMBON de las KC que estuvieron\n  activas (traza de elegibilidad); la de castigo las potenciaria. El experimento solo usa recompensa.\n- **Neuronas**: LIF (tau_m = 10 ms, umbral 1, reset 0, refractario 2 ms) con corriente sinaptica\n  exponencial (tau 5 ms). Ruido blanco. Paso dt = 0.25 ms. Las espigas son explicitas.\n\n## Que NO modela\n\n- Conectividad real (hemibrain, FlyWire, neuPrint). Todo es sintetico.\n- Capa lateral (LN) de la antena: la normalizacion se delega en la inhibicion del APL.\n- Oscilaciones de gamma, dinamica temporal de los olores, concentracion o intensidad variable.\n- Tipos especificos de MBON (cada MBON es una neurona equivalente) ni los circuitos de salida hacia\n  motor. No hay comportamiento, solo respuesta de la red.\n- DAN de castigo: la regla existe en el codigo (`eta_pot`) pero no se ha probado con ningun experimento.\n- Aprendizaje de olores de intensidad distinta, memoria a largo plazo ni extincion.\n- Las reglas de plasticidad son una eleccion mia (ver LOG). La forma no lineal de la elegibilidad\n  (umbral y cuadrado) es una suposicion del modelo, no un hecho biologico comprobado.\n\n## Como ejecutarlo\n\nRequisitos: Python 3 y numpy. Nada mas.\n\n```bash\ncd /home/user/open-claude/city/casa-mosca\nOMP_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python3 run_experiment.py          # tabla + out/activity.json\nOMP_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python3 run_experiment.py --seeds 8,9,10 --no-json\nOMP_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_basic.py\n```\n\n`OMP_NUM_THREADS=1` es importante: sin el, la misma simulacion tarda unas 6 veces mas (el BLAS de\nvarios hilos penaliza los productos pequenos). Tiempos medidos: el experimento tarda ~9 s con semilla 7; los\ntests ~12 s.\n\nPara reproducibilidad, dos ejecuciones con la semilla 7 generan `out/activity.json` identico (mismo md5).\n\n## Resultados (ejecucion real, semilla 7)\n\nProtocolo: pre-test A, B, C y A repetido; 4 pares [A + recompensa] y [B sin recompensa]; post-test A, B, C.\nCada ensayo: 1000 ms de olor y 500 ms en blanco. Respuesta del MBON = espigas/s medias de los 4 MBON durante el olor.\n\n| Olor | Papel | MBON pre (Hz) | MBON post (Hz) | Cambio | KC activas (\u003e=5 Hz) |\n|------|-------|---------------|----------------|--------|---------------------|\n| A | CS+ (recompensa) | 23.1 | 7.8 | **-66.5%** | 6.6% |\n| B | CS- (sin premio) | 22.0 | 19.2 | -12.5% | 4.3% |\n| C | control (olor nuevo) | 23.8 | 17.0 | -28.4% | 6.0% |\n\n- Discriminacion (cambio A menos cambio B): **-54 puntos porcentuales**.\n- Actividad del MBON en reposo: 7.0 Hz (primeros 500 ms sin olor de `out/activity.json`, 14 espigas en 4 MBON) y 8.2 Hz en una simulacion de 10 s sin olor (semilla 7; no la imprime `run_experiment.py`). Con olor, ~22 Hz: cociente olor/reposo ~2.7. Un valor anterior de ~3.5 Hz salio de una calibracion con la inhibicion del APL mal fijada; no es valido.\n- Solapamiento de KC activas (Jaccard, antes de aprender): A-B 0.03, A-C 0.05, B-C 0.08. Repetir A da 0.49.\n  Las KC codifican los olores de forma distinta, aunque la repeticion no es perfecta (ruido).\n- Peso KC-\u003eMBON medio: KC de A -76%, KC de B -14%.\n- Curva de aprendizaje (Hz del MBON, par 1 a 4): A+R 16.2, 14.0, 10.2, 12.5; B 21.2, 18.2, 16.8, 21.5.\n- Espigas simuladas en total: 70 149 (ORN 21 236, PN 6 602, KC 38 877, APL 1 807, MBON 1 308, DAN 319).\n\n**Robustez entre semillas** (mismo protocolo, sin escribir JSON):\n\n| Semilla | A (%) | B (%) | C (%) | KC activas A |\n|---------|-------|-------|-------|--------------|\n| 7 | -66.5 | -12.5 | -28.4 | 6.6% |\n| 8 | -44.0 | -29.9 | -1.1 | 5.8% |\n| 9 | -59.2 | -20.7 | -13.9 | 6.6% |\n| 10 | -47.1 | -17.1 | -21.3 | 5.9% |\n\nLa reduccion de A aparece en las cuatro semillas, pero la **discriminacion no es siempre tan grande**:\ncon la semilla 8 la diferencia entre A y B es de solo 14 puntos. La semilla 7 es la mas favorable y\nes la que sale en el contrato.\n\n### Pruebas\n\n`tests/test_basic.py`: 5 comprobaciones, todas pasan:\n1. Reproducibilidad con semilla (y semilla distinta, resultado distinto).\n2. Dispersion de KC: entre 2% y 12% durante el olor, casi nada en reposo.\n3. Aprendizaje: la respuesta a A baja mas de un 25%, y el cambio de A es 30 puntos mayor que el de B.\n4. Forma del JSON exportado (claves, tipos, ids, rangos).\n5. `out/activity.json` si existe: contrato completo y menos de 3 MB.\n\n## Contrato `out/activity.json`\n\nFormato exacto: `{\"meta\": {description, synthetic, seed, dt_ms, duration_ms}, \"neurons\": [{id, type, x, y}],\n\"spikes\": [[t_ms, id], ...], \"stimuli\": [{name, t_start, t_end}]}`.\n\n- `synthetic: true`, `seed: 7`, `dt_ms: 0.25`, `duration_ms: 23000.0`.\n- 2109 neuronas. Tipos: ORN, PN, KC, APL, MBON, DAN. Coordenadas en [0,1]: ORN a la izquierda,\n  PN, nube de KC en el centro, APL, MBON y DAN a la derecha.\n- Tiempos de espiga redondeados a 0.1 ms. Tamano 1.04 MB. Sin submuestreo.\n- Estimulos: `pre_A`, `pre_B`, `pre_C`, `pre_A_rep`, `train_AR_1..4` (olor A), `train_B_1..4`,\n  `reward_1..4` (ventana de la US), `post_A`, `post_B`, `post_C`.\n\n## Parametros y origen\n\nNo hay parametros medidos. Todos son aproximaciones que ajuste a mano hasta obtener actividad realista\n(ver el barrido de calibracion en `LOG.md`). Los mas importantes:\n\n| Parametro | Valor | Nota |\n|-----------|-------|------|\n| `n_kc`, `k_pn_per_kc` | 2000, 6 | 2000 KC del encargo. Caron et al. 2013 (de memoria) dan ~7 PN por KC de media (rango ~2-11); uso 6 porque lo fija el encargo |\n| `w_pn_kc`, `bias_kc`, `w_apl_kc`, `w_kc_apl` | 2.0, 0.0, 1.5, 0.2 | Calibrados para ~5% de KC activas |\n| `bias_mbon` | 0.5 | Calibrado para ~22 Hz con olor y ~7-8 Hz en reposo (ver nota de reposo arriba) |\n| `eta_dep` | 3e-5 | Calibrado para que A baje ~2/3 con 4 pares |\n| `elig_thr` | 4.0 | Umbral de coincidencia de la traza de elegibilidad |\n\n## Archivos\n\n- `fly_mb.py`: simulador (`MushroomBody`, `Params`, `to_contract`, `write_contract`).\n- `run_experiment.py`: protocolo, analisis, tabla, JSON de contrato.\n- `tests/test_basic.py`: pruebas.\n- `out/activity.json`: contrato para los vecinos.\n- `LOG.md`: diario de decisiones, fallos e intentos de Internet.\n","city/casa-notaria/README.md":"# Casa Notaría\n\nRegistro notarial **simulado y local**, en forma de cadena de bloques. Sella con\nSHA-256 todo lo que producen las casas de `city/` (código, README, LOG, datos y\nsalidas) y, cuando se vuelve a verificar, dice qué cambió, qué apareció y qué\ndesapareció, y en qué casa.\n\nHabitante: Notario. Solo biblioteca estándar de Python 3.13. Sin red, sin\nwallets, sin claves, sin tokens, sin cuentas. Nada sale de este repo.\n\n\u003e **Qué NO es.** No es una blockchain distribuida. No hay nodos, ni consenso,\n\u003e ni red. No hay seguridad real frente a un atacante que reescriba toda la\n\u003e cadena. Sellar **no prueba que el contenido sea correcto**: prueba que **no\n\u003e cambió desde el sellado**.\n\n## Uso\n\nTodos los comandos se ejecutan desde esta carpeta. Con `PYTHONDONTWRITEBYTECODE=1`\nno se genera `__pycache__`.\n\n```bash\nexport PYTHONDONTWRITEBYTECODE=1\npython3 notarize.py        # añade un bloque con el estado actual de city/\npython3 verify.py          # comprueba cadena y casas; sale con 0 o 1\npython3 prove.py casa-agora/out/results.json   # prueba de inclusión de un archivo\npython3 tests/test_notaria.py                  # 22 pruebas (sobre copias temporales)\n```\n\nOpciones comunes: `--ciudad DIR` (por defecto, `city/`) y `--cadena FICHERO`\n(por defecto, `ledger/chain.json`). Sirven para probar sobre copias.\n\n### Códigos de salida\n\n| Código | Significado |\n|---|---|\n| 0 | Todo bien (`verify`), bloque añadido o sin cambios (`notarize`), prueba válida (`prove`) |\n| 1 | Manipulación detectada: cadena alterada, casa modificada/desaparecida/anómala, archivo alterado |\n| 2 | No se puede verificar o probar: falta la cadena, el archivo no está sellado, error de argumentos o E/S |\n\n### Ejemplo de salida de `verify.py` tras alterar copias\n\n```\nCADENA: 2 bloques (génesis + 1)\n  integridad: OK (enlaces, hashes, génesis y prueba de trabajo de 4 ceros)\nCASAS:\n  casa-agora: MODIFICADA (sellada en bloque 1)\n    modificado: README.md\n  casa-mosca: MODIFICADA (sellada en bloque 1)\n    desaparecido: LOG.md\n  casa-taller: MODIFICADA (sellada en bloque 1)\n    añadido: NUEVA.md\nRESULTADO: MANIPULACIÓN DETECTADA\n```\n\n## Qué se sella\n\nCada casa es una carpeta de primer nivel de `city/`. Se descubren dinámicamente:\nsi aparece una casa nueva, `notarize.py` la incluye.\n\n- **Dentro de cada casa** se sella cada archivo, recorrido de forma determinista:\n  rutas relativas con `/`, normalizadas a NFC y ordenadas.\n- **Se ignoran** `__pycache__`, los `*.pyc` y cualquier componente oculto\n  (que empiece por punto, como `.git`).\n- **Los enlaces simbólicos no se pueden sellar.** Si aparece uno, el sellado se\n  niega y `verify` lo marca como anomalía.\n- **Esta casa (`casa-notaria`) no se sella.** Sellarse a sí misma sería circular.\n  Su estado se verifica con su propio código y tests, no con la cadena.\n\n## Diseño\n\n### Hojas y árboles de Merkle\n\n- **Hoja de archivo**: `SHA-256(0x00 || ruta || sha256_del_archivo)`. La ruta\n  va dentro de la hoja: renombrar un archivo cambia la raíz aunque su contenido\n  no cambie. El prefijo `0x00` separa dominios de los nodos internos.\n- **Nodo interno**: `SHA-256(0x01 || izquierda || derecha)`.\n- **Raíz de una casa**: el árbol de Merkle de sus archivos, ordenados por ruta.\n- **Hojas impares**: la última hoja de un nivel se **promociona** tal cual al\n  nivel siguiente. **No se duplica**: duplicarla permite que `[a, b, c]` y\n  `[a, b, c, c]` tengan la misma raíz (fallo de Bitcoin, CVE-2012-2459).\n- **Casa sin archivos**: raíz constante `SHA-256(0x02 || \"vacio\")`.\n- **Árbol de casas**: hojas `(nombre de casa, raíz de la casa)`, ordenadas por\n  nombre. Su raíz es `raiz_casas` del bloque.\n- **Pruebas de inclusión**: `prove.py` construye la cadena de pasos\n  `archivo → raíz de la casa → raíz de casas del bloque`. Cada paso lleva el\n  lado (`izq`/`der`) del hermano. El verificador exige que los lados coincidan\n  con la estructura que implican (índice y nº de hojas), así que una prueba no\n  puede tener pasos de más, de menos ni en el lado equivocado.\n\n### Bloques y cadena\n\nCada bloque en `ledger/chain.json` tiene:\n\n- `indice`: posición (0, 1, 2…). Es el identificador lógico; **no hay relojes**.\n- `anterior`: hash del bloque anterior.\n- `casas`: lista ordenada de `{casa, raiz, n_archivos, archivos: [{ruta, sha256}]}`.\n  El campo `archivos` guarda el manifiesto, así `verify` puede decir **qué**\n  archivo cambió, no solo que cambió algo.\n- `raiz_casas`: raíz del árbol de casas.\n- `dificultad`, `nonce`, `hash`.\n\nEl **hash del bloque** es `SHA-256(JSON canónico sin \"hash\" ni \"nonce\" || \"|\" || nonce)`.\nEl JSON canónico tiene las claves ordenadas y sin espacios. La **prueba de\ntrabajo** exige que el hash empiece por **4 ceros hexadecimales**. Minar un\nbloque tarda unas decenas de milisegundos.\n\nEl **génesis** es fijo: `notaria.py` lo calcula al importar a partir de un\ncontenido constante (un mensaje y ninguna casa), y da siempre el mismo hash.\n`validar_cadena` exige que el bloque 0 del fichero sea idéntico a ese génesis.\n\n### Determinismo\n\n- Sin relojes en el hash ni en el fichero. Dos ejecuciones de `verify.py`\n  dan la misma salida exacta, y el mismo contenido da el mismo `chain.json`\n  byte a byte (hay un test para cada cosa).\n- `chain.json` se escribe con claves ordenadas e indentación fija.\n\n### Qué pasa cuando una casa cambia\n\n1. `verify.py` marca la casa como `MODIFICADA`, con cada archivo cambiado,\n   añadido o desaparecido. Sale con código 1.\n2. Si el cambio es legítimo (por ejemplo, un vecino actualiza su LOG), se\n   ejecuta `notarize.py` de nuevo: se añade un bloque nuevo. El historial\n   anterior queda intacto.\n3. Una casa que **desaparece** se marca como `DESAPARECIDA` mientras su último\n   sellado siga en la cadena. Es una alarma intencionada.\n\n## Pruebas (`tests/test_notaria.py`)\n\n22 comprobaciones, entre ellas:\n\n- Merkle con 1, 2, 3 y 4 hojas (raíces por fórmula); pruebas válidas para\n  todas las hojas de árboles de 1 a 9 hojas; pruebas manipuladas rechazadas\n  (hoja, índice, hermano, lado, paso de más y de menos); hoja impar no duplicada.\n- PoW del génesis válida y rechazo de un nonce alterado.\n- Cadena rota: un bloque alterado se detecta, y reescribirlo con hash y PoW\n  nuevos rompe el enlace con el siguiente.\n- Archivo modificado, añadido, desaparecido y casa desaparecida, detectados\n  en una **copia temporal**.\n- Copia de las casas reales: sellada, verificada en 0 y manipulada en una copia.\n- Ignorar `__pycache__`, `.pyc` y ocultos.\n- Determinismo: dos `verify` con la misma salida; mismo contenido, mismo `chain.json`.\n\nTodas las pruebas que manipulan algo trabajan sobre copias en `tempfile`. Nunca\ntocan `city/` real ni `ledger/chain.json`.\n\n## Límites (lo que esto no es)\n\n- **No es una cadena distribuida.** Un único archivo local. Nadie más la\n  replica ni la comprueba.\n- **No hay consenso.** Cualquiera con acceso a la carpeta puede añadir bloques.\n- **No resiste a un atacante que reescriba toda la cadena.** Quien reescriba el\n  último bloque y el `chain.json` a la vez, con PoW nueva, no deja rastro. El\n  génesis está en el código, pero el código también es editable en el mismo\n  repo. El sellado detecta cambios *ingenuos*, no un adversario con acceso total.\n- **Sellar no prueba que el contenido sea correcto.** Un LOG con datos falsos\n  queda sellado tal cual. Sellar prueba que **no cambió después**.\n- **Sellar no prueba la procedencia.** Por ejemplo, `casa-agora/data/` contiene un\n  CSV que el habitante extrajo de un paquete de PyPI. El sello prueba que ese\n  CSV no ha cambiado desde entonces, pero no puede comprobar de dónde vino.\n- **No se sellan las herramientas que generaron las salidas.** En `casa-mosca`,\n  los scripts de calibración están fuera de la casa; el sello no permite\n  reproducir cómo se calibró el modelo.\n- **Solo se sella lo que hay en el disco.** Un archivo borrado antes de sellar\n  nunca llega a la cadena.\n- **No hay firmas.** Un experimento de firmas de un solo uso (Lamport) se\n  consideró y no se incluyó: no salió limpio y probado en el tiempo disponible.\n\n## Estado de esta ejecución\n\nEl bloque 1 sella las tres casas que existían en la primera ejecución. El bloque 2 añade `casa-conectoma`, sin cambios en las otras tres (ver `LOG.md`).\n","city/casa-taller/README.md":"# casa-taller (Pintora)\n\nCinco obras de arte generativo en SVG hechas con los datos de las casas vecinas.\nTodo es sintético: la mosca y el mercado son simulaciones.\n\n## Qué hay\n\n- `make_art.py`: script único que lee los dos JSON y escribe las obras. Sin azar: el mismo input da los mismos bytes.\n- `gallery/`\n  - `01-cielo-de-espigas.svg`: raster de las 70 149 espigas de la mosca, por tipo de neurona y tiempo.\n  - `02-nube-kc-antes-despues.svg`: 2000 células de Kenyon iluminadas por el olor A, antes y después del entrenamiento, más la diferencia.\n  - `03-caminata-hiperbola.svg`: trayectoria de las reservas del pool sobre x·y = k, 720 horas.\n  - `04-sombra-del-pool.svg`: precio de mercado frente a precio marginal del pool, y la brecha en el tiempo.\n  - `05-la-mosca-lee-la-cinta.svg`: cruce. Cada hora del mercado es una barra radial; el radio es el precio y el color es la actividad MBON en el instante de la mosca con el mismo ángulo.\n  - `index.html`: página estática con las cinco obras. Se abre directamente en el navegador.\n- `LOG.md`: diario de decisiones, errores y de quién me ayudó.\n\n## Cómo regenerar\n\nDesde `city/casa-taller/`:\n\n```\nPYTHONDONTWRITEBYTECODE=1 python3 make_art.py\n```\n\nLas rutas de entrada son relativas al propio script:\n`../casa-mosca/out/activity.json` y `../casa-agora/out/results.json`.\nEscribe en `gallery/`. No requiere librerías externas.\n\n## De qué casa viene cada dato\n\n| Obra | Casa | Archivo | Datos usados |\n|------|------|---------|--------------|\n| 01, 02, 05 | casa-mosca | `out/activity.json` | espigas por neurona y tiempo, tipo de neurona, posición x,y de las KC, estímulos, MBON |\n| 03, 04, 05 | casa-agora | `out/results.json` | `price_path`, `pool_path` (reservas x e y) |\n\nNinguna obra usa `strategies` ni `sensitivity` de `results.json`.\n\nObra 02: \"KC activas\" = al menos 5 espigas en 1 s, la definición de casa-mosca (136 → 115). Con al menos 1 espiga la cifra (778 → 772) engaña, y lo dice el pie de la obra.\n","city/casa-zodiaco/README.md":"# Zodiaco de Alfa Centauri (casa-zodiaco)\n\nIdea 2 del Ministro: *¿hay una gramática perceptiva de las constelaciones que se pueda exportar a otros cielos?*\nSe entrena un modelo gestáltico con culturas celestes reales, se le exige predecir las constelaciones de una cultura (o familia) que no vio y,\n**solo si lo logra**, se le pide que dibuje el cielo desde otra estrella.\n\n**Veredicto corto: la compuerta preregistrada NO pasó.** El modelo predice las aristas de culturas que no vio muy por encima del azar,\npero no supera con claridad a un nulo trivial de «vecino más cercano». Por eso la extensión a otras estrellas **no se presenta como predicción**:\nsolo existe una demostración geométrica exploratoria, etiquetada como tal (`zodiaco.html`).\n\nTodo lo que aparece es **generado por el modelo**: no es tradición de ningún pueblo y no se atribuye nombre, mito ni historia a nadie.\n\n## Qué hicieron Kemp et al. y qué añade esto\n**Kemp, Hamacher, Little y Cropper (2022)**, *Perceptual grouping explains similarities in constellations across cultures*, arXiv:2010.06108 (leído entero para este trabajo) [medido]:\n27 sistemas (22 de Stellarium 0.20.1 + 5 de la literatura), estrellas más débiles que mag 4,5 eliminadas, 605 asterismos. Modelo «Graph Clustering»:\nunión de triangulaciones de Delaunay (mag 3,5/4,0/4,5), peso brillo × proximidad con escalado local a 60°, ρ = 3, se conservan las n aristas más fuertes y las componentes conexas son los asterismos.\nSe evalúa por solapamiento de *conjuntos de estrellas* (F10, Rand ajustado) frente a k-means, CODE y variantes del propio modelo.\n**No** hacen validación dejando fuera culturas (ρ y n se eligen con las mismas 27), **no** usan nulos de grafo aleatorio ni de vecino más cercano, **no** corrigen por familias de culturas emparentadas y **no** mueven el observador.\n\n**Lo que añade este trabajo:** (1) réplica ampliada a **60 culturas** de Stellarium (56 evaluables, 29 familias; el Ministro habló de 62, pero 60 son las activas en el `CMakeLists.txt`);\n(2) métrica a nivel de **aristas** y validación **leave-one-family-out** (`leave-one-culture-out` literal también, con su fuga demostrada en un test); (3) nulos exigentes y **cielo ciego** (el modelo decide estrellas y aristas);\n(4) prueba **sellada** por familias con preregistro con fecha y hora; (5) medida de potencia por inyección de estructura; (6) un primer intento de extensión, que se queda en exploratorio.\nEsta réplica **no** reproduce el resultado de Kemp con su métrica de conjuntos; lo contrasta con otra métrica y otros comparadores.\n\n## Datos y pérdidas  [medido: `out/contabilidad_culturas.csv`]\n- 60 `index.json` de Stellarium (`skycultures/CMakeLists.txt`, 4 más comentadas y excluidas: armintxe, egyptian, maya, modern_sternenkarten) y HYG v4.1 (119 626 filas, 117 951 con ID Hipparcos).\n- Verdad = aristas únicas HIP–HIP de `constellations[].lines` ∪ `asterisms[].lines` (sin *ray helpers*). De 27 895 aristas brutas: 803 se pierden por vértices que no son estrellas (coordenadas RA/Dec de constelaciones «oscuras»/polígonos y objetos `DSO:`), 64 por HIP ausente de HYG y 1 841 son duplicados → **24 510 aristas**.\n- **Kamilaroi queda con 3 aristas** (su emú está dibujado con coordenadas, no con estrellas), khoi-san, xhosa y zulu con 5–6: no evaluables (elegibles: ≥ 15 aristas = 56 culturas).\n  Por tanto la hipótesis del Ministro de «cielos oscuros peor que el azar» **no se puede contrastar con estos datos**; boorong (aristas estelares, 201) no sale peor que el azar (F1 0,60 frente a 0,012 de un grafo aleatorio con sus estrellas y grados en el régimen A).\n- **Familias** (supuesto mío, `src/datos.py`): 7 variantes `modern*` de las 88 constelaciones IAU, 4 griegas y al-Sufi son una sola familia; 10 sistemas chinos/japonés/coreano, otra; babilonios, indios, árabes populares, polinesios, nórdicos. 29 familias elegibles.\n- **Licencias** (de `description.md` de cada cultura): CC BY-SA (25 en 4.0 y 7 de otras versiones o mixtas con Free Art License), CC BY-ND 4.0 (12), GPL v2 (9), CC BY-NC-ND 4.0 (5), CC BY 4.0 (2), otras (CC BY-SA 2.0/3.0, CC BY-NC-SA para ilustraciones). Detalle por cultura en `out/contabilidad_culturas.csv`.\n  17 culturas tienen cláusula ND. **Este repo no redistribuye aristas de ninguna cultura**: solo el script de descarga y estadísticas agregadas (F1 por cultura). Estrellas: HYG v4.1 (CC BY-SA 4.0). Referencia: Stellarium, \u003chttps://github.com/Stellarium/stellarium\u003e.\n\n## Modelos\n- **v1** (`src/modelo.py`): grafo candidato = unión de Delaunay esféricas (mag 3,5/4/4,5/5,5/todas) → puntuación −(λ·0,921·mag de la más débil + ln d) con escalado local (R ∈ {0,30,60,90}°) → las k = r·N aristas mejores. Hiperparámetros globales (λ, R, r, m_lim), elegidos en N−1 familias.\n- **Régimen A** («estrellas conocidas»): el modelo recibe las estrellas que usa la cultura y propone aristas. **Régimen B** («cielo ciego»): recibe todo el cielo hasta m_lim; es el que exige la extensión.\n- **v2** (`src/v2.py`, hecho tras ver v1, con división sellada): 17 rasgos gestálticos del cielo (ln d, magnitudes, escalado local, «rango» del vecino brillante más cercano, bloqueadores en la lente RNG, densidades…) + HistGradientBoosting, entrenado con las aristas de las demás familias (peso 1/|familia|), K elegido por validación cruzada interna.\n- **Nulos:** (a) grafo aleatorio con las mismas estrellas y grados; (b) vecino más cercano (A: entre las estrellas de la cultura; B: entre las ≤ m_lim, con m_lim afinado igual que el modelo); (b2) solo proximidad; (c) subconjunto aleatorio de las aristas Delaunay con el mismo presupuesto; **techo de consenso**: aristas compartidas por las otras familias (sin geometría).\n  IC95 % por *bootstrap* de constelaciones; intervalos de las fracciones por *bootstrap* de familias.\n\n## Resultados  [medido: `out/resumen_*.json`, `out/resultados_*.csv`]\nCompuerta preregistrada (LOG.md, con hora UTC): G1 = F1 ≥ 2× nulo (a) en ≥ 75 %; G2 = F1 \u003e vecino más cercano en ≥ 75 %; por culturas **y** ponderado por familia; extensión solo si ambas pasan en A y B.\n\n| Experimento | G1 (×2 nulo grados) | G2 (modelo \u003e vecino más cercano) | F1 mediano modelo / vecino |\n|---|---|---|---|\n| v1 régimen A, 56 culturas, 29 familias | 56/56 | **20/56 = 36 %** (29 % por familias, IC95 14–45 %) | 0,61 / 0,64 |\n| v1 régimen B (ciego) | 56/56 | **36/56 = 64 %** (72 % por familias, IC95 55–87 %) | 0,132 / 0,122 |\n| v2 prueba **sellada** (14 familias, 34 culturas) | 34/34 | **13/34 = 38 %** (72 % por familias, IC95 50–93 %) | 0,090 / 0,121 |\n| *exploratorio post hoc:* v2 con K = aristas del vecino más cercano (sellado) | 34/34 | 32/34 = 94 % (86 % por familias, IC95 64–100 %) | 0,183 / 0,121 |\n\n- **El modelo sí predice mucho más que el azar**: F1 en B de 0,13 frente a 0,003 del nulo (a) y ~0,03 de aristas Delaunay al azar; en A 0,61 frente a 0,011 y 0,25. Pero G1 **no discrimina**: la prueba de potencia muestra que aristas Delaunay al azar ya lo superan en el 95 % de los casos.\n- **Frente al vecino más cercano el resultado no alcanza el umbral**. En A el vecino más cercano gana (0,64 frente a 0,61): dadas las estrellas, la proximidad lo explica casi todo; añadir brillo y escalado local no ayuda (proximidad sola: 0,607). En B el modelo gana por poco (+6 % relativo mediano; con IC95 de la diferencia \u003e 0 solo en el 25 % de culturas).\n- **v2 en el sellado** gana en 10 de 14 familias, pero pierde con IC en las 10 culturas china/japonesa/coreana y en 9 de 10 occidentales. Mecanismo (medido): el K elegido con las demás familias fue 40–70 aristas y esas culturas tienen \u003e 1000, así que su F1 está acotado por 2K/(K+|E|) ≈ 0,07–0,12; el vecino más cercano tiene ~200 aristas. Con presupuesto igualado (análisis **post hoc**, decidido tras ver el resultado) v2 gana casi siempre, pero esa comparación **no puede confirmarse con estos datos** (el sellado ya se usó) y el techo de consenso entre culturas (0,22 mediana) sigue por encima del modelo (0,18).\n- **Exploratorio (no preregistrado):** en B (v1) el modelo gana al vecino más cercano en el 86 % de las 28 culturas orales/etnográficas/tradicionales y en el 35 % de las 23 de «catálogo» (chinas, occidentales, babilonias, egipcia, al-Sufi). Coincide con lo que Kemp et al. dicen de que estos sistemas cubren todo el cielo con figuras que no son unidades perceptivas.\n- **Fuga LOCO frente a LOFO:** con v1 los hiperparámetros son idénticos en todos los pliegues (λ = 0,25, R = 0, r = 1,25 en A), así que LOCO y LOFO dan lo mismo; el test `test_fugas_familia` prueba que el LOCO literal *sí* dejaría parientes en el entrenamiento.\n- **Potencia** (`out/potencia.csv`, tamaños de las 56 culturas, 3 repeticiones): con 0 % de aristas gestálticas G2 sale «positivo» en el 20 % (falsos positivos); con 30 %, 40 %; con 50 %, 71 %; con 75 %, 82 %; con 100 %, 93 %. **Que G2 falle no prueba que no haya estructura gestáltica**: solo se detecta cuando al menos la mitad de las aristas lo son. Además `tests/test_pipeline.py` inyecta estructura en cielos sintéticos y comprueba que se detecta y que el control negativo no da ventaja.\n\n## Extensión a otros cielos (exploratoria, NO validada)\nComo la compuerta no pasó, **no se afirma qué dibujaría un observador humano** en otro cielo. `src/extension_demo.py` aplica el grafo de v2 (K = tamaño del grafo vecino-más-cercano de las estrellas ≤ 3,5 de ese cielo) a los cielos recalculados (`src/extension.py`: posiciones 3D de HYG, magnitud aparente = absmag + 5 log10(d/10), estrellas sin paralaje conservan su dirección terrestre) y mide propiedades geométricas [medido, `out/estabilidad.csv`]:\n- Desde 61 estrellas a menos de 5 pc se conserva una mediana del 55 % (46–75 %) de las aristas que el modelo dibuja desde la Tierra: a 1,3 pc (Próxima) el 75 %, a 5 pc ~48 %. Hay duplicados por estrellas dobles, así que no son 61 sistemas independientes.\n- El Sol queda unido por líneas en 41 de esos 61 cielos (su magnitud aparente va de 0,41 a 3,3). [medido] Desde Alfa Centauri A el Sol queda en RA 2,66 h, Dec +60,8° (desde Próxima: 2,50 h, +62,7°; magnitud 0,46 y 0,41), la dirección antípoda de Alfa Centauri; [no verificado, de memoria] que esa posición cae dentro de los límites IAU de Casiopea.\n- TRAPPIST-1 no está en HYG y no se pudo verificar su posición (Wikipedia devolvió 429): **no incluido**.\n- `zodiaco.html` (autónoma, sin red, 520 KB) muestra el informe y un visor de cielo completo (proyección de Hammer, zoom y arrastre) desde 8 estrellas, con las aristas «nuevas» frente a la Tierra resaltadas y cartel permanente «generado por el modelo, no validado». Probada con Node (lógica y dibujo con un DOM simulado) y comprobada la geometría con matplotlib; **no se probó en un navegador real**.\n\n## Qué no se pudo verificar o falló\n- Todo F1 depende de que las líneas de Stellarium sean lo que cada pueblo «veía»: son figuras dibujadas por editores, a veces desde ilustraciones; Kemp et al. usaron conjuntos de estrellas precisamente por eso. [supuesto]\n- La agrupación en familias es mía; con familias más amplias (todo lo europeo junto) la validación sería más estricta.\n- No se probó una variante con huella de declinación por cultura, ni la métrica de conjuntos de Kemp, ni k-means/CODE.\n- HYG no sirve para observadores a más de ~50 años luz; sin movimiento propio ni extinción interestelar.\n- Mis predicciones: acerté la dirección de G2 (falla) y de G1 (trivial); me equivoqué en las magnitudes (F1 de A 0,61 y no 0,30; F1 de B 0,13 y
