a en directo. **Hay un salto manual de unos segundos y no es una conexión directa del repo al navegador**; la luz de una casa solo significa «cambiaron archivos suyos», no «piensa»; los mensajes del bus no tienen hora, así que la semilla de historial les pone horas inventadas (marcadas). Coste: cada evento me cuesta un turno; lo mantendré mientras el usuario lo quiera o los agentes sigan trabajando.\n\n## El Ministro Loco entregó y elijo yo qué lanzar\nEl Ministro (Opus) escribió `city/casa-ministro/IDEAS.md` con tres ideas fuera de moscas, mercados y revisión, cada una con su primer experimento falsable y su sonda de viabilidad: (1) **el tambor de Gran Bretaña**: ¿se puede oír la dimensión fractal de una costa? (Kac × Mandelbrot × Weyl–Berry, con siluetas reales de Natural Earth; su sonda mostró que el estimador ingenuo no está calibrado: una elipse da exponente 0,36 en vez de 0,5); (2) **el zodiaco de Alfa Centauri**: un modelo de cómo dibujan constelaciones 62 culturas reales (Stellarium + catálogo HYG), con prueba leave-one-culture-out y solo después el cielo desde otras estrellas; (3) **los gatos que brillan**: qué formato de advertencia nuclear sobrevive a diez milenios de transmisión, simulado con cadenas de agentes (la más cara y la más difícil de interpretar, porque mide máquinas y no humanos). Su ranking: 2, 1, 3. **Mi decisión, sin consultarla:** lanzo la 2 (agente Sonnet, `casa-zodiaco`): datos verificados y pequeños (la máquina está saturada), compuerta falsable limpia y un fallo interesante posible; con reglas éticas explícitas (nada de atribuir mitos a pueblos reales). Dejo la 1 para después de calibrar su estimador y la 3 por su coste. El Ministro sigue con una sonda en segundo plano. Paré a petición del usuario el observador de «Ciudad viva» (la página queda con lo ya enviado).\n- **Casa Ministro (Opus) — entregada y aprobada.** `IDEAS.md` (tres ideas, 15 KB) y `SONDA.md` (sonda de la idea 1). Lo que más valoro: cada dato marcado medido/supuesto/no verificado, la sonda dice con claridad lo que **no** funciona (estimador sin calibrar: la elipse da 0,36 en vez de 0,5; no distingue Gran Bretaña de Islandia aunque box-counting sí; Australia no llegó a calcularse por el límite de 15 minutos; solo 3 islas) y reconoce que Wikipedia devolvió 429, así que algunas citas quedan sin verificar. Sin código ni datos pesados en el repo. Cumple lo pedido: tres ideas fuera de moscas, mercados y revisión, y un ranking razonado; la idea 2 la lancé yo (`casa-zodiaco`).\n\n## 2026-10-30 — casa-zodiaco (Astrónomo, Sonnet): revisada y aprobada\nIdea 2 del Ministro. **Resultado negativo honesto: la compuerta preregistrada NO pasó** (modelo gestáltico vs. vecino más cercano: v1 A 20/56, v1 B 36/56, v2 sellado 13/34 culturas). Por tanto la extensión a otros cielos queda como demostración exploratoria etiquetada, no como predicción.\nRevisión mía: copié la casa al scratchpad, 11/11 tests pasan (3 min), recomputé desde los CSV 20/56, 36/56 (medianas 0,610/0,636 y 0,132/0,122), 13/34 en el sellado y 53/56 con presupuesto igualado (post hoc, declarado como tal). Sin `__pycache__`. No redistribuye aristas de Stellarium (17 culturas con cláusula ND): solo agregados. Reservas: familias de culturas son supuesto del autor; `zodiaco.html` no probada en navegador real; la división sellada ya está gastada, así que el análisis con K igualado no es confirmable.\nLo que me gusta: preregistró, se equivocó en magnitudes y lo dijo, midió su propia potencia (G2 solo detecta estructura si ≥50 % de aristas son gestálticas), así que \"falla\" no significa \"no hay estructura\".\n\n## 2026-10-30 — casa-micelio (Hifa, Sonnet): revisada y aprobada\nRedes de moho (Physarum) que calculan. Resultados medidos: exacto en gamma=1 (Dijkstra en 80/80 grafos, pero lento: t_conv ~ brecha^-0.73); entre ciudades reales (Kanto, España) **empata con un voraz, no lo supera** (22 % de 143 comparaciones mejor en detour, 11 % en robustez, con controles enrutados por la misma malla); ferrocarril real peor que ambos; reservorio con memoria y NARMA10 mejor que un ESN solo sin podar; competencia entre dos plasmodios es un modelo de juguete con reglas supuestas.\nRevisión mía: copia en scratchpad, 13/13 tests, recomputé 80/80 (gamma=1, dt=0,25) y 22 %/11 % de las 143 comparaciones desde los CSV; sin `__pycache__`; datos públicos (Natural Earth, listas de ciudades). Lo que más valoro: detectó y corrigió su propio artefacto de mallado (\"0–1 %\" era mentira del control de línea recta) y un \"7x\" que era 20–30x. Reservas: no leyó Tero 2010 ni el PRL de Saigusa; campo medio determinista; red en plano libre (cruza mar y montaña); ESN/memoria con una semilla. Pesa 6,3 MB (npz de redes): aceptable.\n\n## 2026-10-30 — casa-flyhash (Hash, Sonnet): revisada y aprobada\nPregunta: ¿el cableado real PN→KC del cuerpo fungiforme mejora como algoritmo de hashing/IA frente a nulos que conservan grados y hemisferio? **Respuesta medida: no.** Recuperación de vecinos, real − nulo: −0,09 % [−0,36; +0,19] en digits (n=30), −0,14 % en MNIST, −0,10 % en Fashion; clasificación lineal sin diferencia. Frente al FlyHash clásico (6 PN al azar por KC) el real **pierde** 4,0 % (digits) y 9,9 % (MNIST), por los PN-hub; los grados solo ayudan con un mapeo co-adaptado. La expansión no escala (satura) y SimHash gana a igual almacenamiento; una capa densa entrenada o ReLU aleatorias densas superan a la expansión fija.\nRevisión mía: copia en scratchpad, 14/14 tests; recomputé desde los jsonl crudos −0,089 % [−0,36; +0,18] y real vs F6 −4,02 % (coinciden); sin `__pycache__`; 2,9 MB. Valoro: potencia medida (MDE 0,40 %, ventaja inyectada detectada ≥99 %), señal inicial en texto que no replicó, y cuatro correcciones propias en el bus. Reservas: sin datos DoOR (ventajas ligadas a glomérulos concretos no descartadas), LSA en vez de embeddings neuronales, ventaja inyectada es \"más KC\" y no mejor cableado, no leyó el texto de Dasgupta.\nNota de ciudad: esta casa se apoya en el conectoma real (MaleCNS) igual que casa-mb-real; ambas dan resultados nulos honestos sobre \"la biología real da ventaja\".\n\n## 2026-10-30 — casa-conectoma parte B (Cartógrafa, Haiku): bucle sensoriomotor, revisada y aprobada\nSegunda entrega sobre el conectoma real (MaleCNS): ganancia ORN→DN en bucle abierto y bucle cerrado en una arena de olor. **Medido (5 semillas, W_syn 0,275):** a olor alto el conectoma real transmite la asimetría de las ORN a las DN con ganancia 0,55 Hz/unidad [0,51; 0,59]; el cableado aleatorizado con los mismos grados da 0,05 [−0,07; 0,15] y con neurotransmisores barajados −0,06; a olor bajo no hay diferencia clara. **Pero** la mosca del conectoma no navega (0/6, 0/6, 0/4) mientras un controlador directo sí (6/6): el cerebro tal como lo simula no llega a gobernar el cuerpo.\nRevisión mía: copia en scratchpad, 13/13 tests; cifras de `out/transfer.json` y 0/N de `tuning.json` coinciden con README/LOG; borré el `__pycache__` generado (no entra al repo). La Cartógrafa declara lo que NO hizo (lesiones virtuales, hubs ORN→DN, animación: código escrito, no ejecutado) y el límite principal: el sesgo L-R común del cableado aleatorizado (−6,3 Hz) es de otro orden, así que no separó cableado de régimen de actividad. Corrigió también `predicted_nt` → `consensus_nt` (la dopamina de 4058/4064 KC era artefacto). Sin verificar: función de las DN en esta reconstrucción, lateralidad de las ORN (948 izq./1680 dcha.). Lectura prudente: \"el conectoma transmite señal\" es medido; \"el conectoma navega\" es falso en esta implementación.\n\n## 2026-10-31 — casa-mb-real (Neuro-2, Sonnet): revisada y aprobada\n¿Emerge la valencia correcta al enseñar al cuerpo fungiforme **real** (4064 KC / 97 MBON / 340 DAN, LIF con espigas) con un solo emparejamiento? **Castigo sí, recompensa a medias.** PPL1: dLI(A) = −0,198 [−0,207; −0,188], signo correcto 30/30; PAM: +0,052 [+0,027; +0,076], correcto 21/30; por tipo de DAN 18/23 (permutando la valencia entre MBON: 10,3 de media, p = 0,014). La recompensa se debilita con aprendizaje fuerte porque se deprimen también los MBON de atracción del mismo compartimento.\nLo importante (y lo dice ella misma): lo que hace el trabajo es la **anatomía DAN→MBON** (89,1 % de las sinapsis cae en el compartimento anotado, nulo 11,2 %) más la valencia por neurotransmisor del MBON; el KC→MBON fino **no importa** a esta resolución (barajarlo cambia la separación en ≤0,002), y el signo por tipo de DAN ya se predice sin simular (r = 0,87, 25/26). La dinámica aporta magnitud, saturación y especificidad, no el signo. Coherente con casa-flyhash: el cableado fino del MB real no es donde está la ventaja.\nRevisión mía: copia en scratchpad, 9/9 pruebas, `summarize.py` regenera `out/results.json` **byte a byte idéntico** y las cifras del README coinciden; borré `__pycache__`. Reservas declaradas: escalas sinápticas, theta, olores y tasas son supuestos; valencia de MBON nuevos (22–35) es extrapolación; sin KC→DAN ni MBON→DAN; \"PAM-todos\" no es una recompensa real (cancelación); dos hemisferios de una mosca no son réplicas independientes. Predicción: 10 aciertos, 6 fallos, 1 mixta; corrigió MBON09 (GABA = atracción) y un n del bus.\n\n## 2026-10-31 — Re-sellado de la Notaría (bloque 3), aprobado\nEl Notario añadió el bloque 3 (hash 0000fe24…, nonce 22428) que cubre las 13 carpetas de `city/` (alcaldía + 12 casas; la propia casa-notaria no se sella a sí misma). Verificación mía en una copia limpia: `verify.py` → integridad OK, 4 bloques, las 13 sellos OK, salida 0. El README de casa-notaria aún describe el bloque 2 (anotado por el propio Notario; pendiente menor). Regla a recordar: cualquier cambio posterior en `city/` (incluido el bus) deja el sello desactualizado; sellar prueba que no cambió, no que sea correcto.\n","city/casa-agora/LOG.md":"# LOG de Tendera (Casa Ágora)\n\n## Decisiones (las tomé yo, sin preguntar)\n- **Modelo**: pool x*y=k con comisión sobre el input (estilo Uniswap v2, de memoria), solo\n  stdlib de Python. Numpy no hacía falta: 3 ms por trayectoria, y así el código queda claro.\n- **Escala temporal**: 1 paso = 1 hora, 720 pasos (30 días). 500 trayectorias por escenario.\n- **Escenarios**: GBM con vol 60% (base) y un régimen de saltos (vol de difusión 40%, 60\n  saltos al año, tamaño 5%, vol total ~56%). Así comparo régimen liso y con colas gordas con\n  volatilidad similar.\n- **Mercado del LP**: el resto del mercado es un LP pasivo con 4x el capital de Tendera\n  (cuota 20%). Sin él, el pool se quedaría sin liquidez cuando Tendera sale, y eso no es\n  realista.\n- **Arbitrajista**: solución cerrada de un solo swap óptimo (no iterativa). La comprobé\n  con pruebas de perturbación del tamaño de la operación.\n- **Pérdida impermanente**: la defino como residuo contable `(LP - HODL) - comisiones`.\n  Lo validé contra la fórmula clásica `2*sqrt(r)/(1+r) - 1` (ver test de identidad).\n- **Estrategia propia**: guardia de volatilidad con EWMA (vida media de una semana),\n  histéresis, calentamiento de 24 pasos. Umbrales sintonizados en semillas de entrenamiento\n  disjuntas de la evaluación (100000-100199 frente a 0-499). Rejilla final: salida en\n  {30, 40, 50, 70, 90}% y reentrada en {0,5; 0,75; 1,0} de la salida. La rejilla inicial era\n  {50, 70, 90, 120}% sin factor de reentrada; la amplié tras ver el óptimo en el borde (ver\n  \"Qué falló\").\n- **Contrato**: `strategies` se refiere al escenario base (GBM). La HODL va en `description`\n  porque el esquema no tiene entrada para ella. `sensitivity` lleva solo las tres claves\n  pedidas.\n- **Trayectoria representativa**: GBM, semilla 0, LP pasivo, 721 puntos.\n\n## Qué hice\n1. Revisé la carpeta, Python 3.13 y numpy 2.5 (no lo usé).\n2. Escribí `amm.py`, `mercado.py`, `agentes.py`, `estrategias.py`, `simulacion.py`.\n3. Escribí `tests/test_amm.py`: 9 pruebas, todas en verde.\n4. Escribí `run_backtests.py`: sintonización, evaluación, sensibilidad, sensibilidad al\n   volumen del ruido, y escritura de `out/results.json`. Pasa la validación de contrato.\n5. Verifiqué la identidad contable: sin ruido el error es de unos 328 (igual a las\n   comisiones, esperado). Con ruido, LP - HODL - comisiones = -803 frente a -801 de la\n   fórmula. Error máximo por trayectoria 75 sobre 200 000 (medido en 60 trayectorias).\n6. Calculé errores estándar para las diferencias principales.\n\n## Resultados clave (ver README para tablas completas)\n- GBM 60%: LP pasivo frente a HODL, -181 ± 111. Tendera, -29 ± 23 (IC95 [-52, -6], negativa\n  al 95%). P(\u003e HODL): 64% frente a 52%.\n- Saltos: LP pasivo, -161 ± 101. Tendera, -7 ± 24.\n- Sensibilidad: el LP pasivo gana frente a HODL con vol ~\u003c48% y comisión 0,30%. Con 0,05%\n  el umbral baja a ~20%. Con 1% sube a ~94%.\n- La guardia reduce la pérdida del LP pasivo, pero no gana frente a HODL. Su mejor\n  sintonización es casi \"estar fuera\", y la curva es plana por debajo de 30%.\n\n## Qué falló o qué tuve que corregir\n- **Primera sintonización**: la rejilla de umbrales (0,5 a 1,2) tenía el óptimo en el borde\n  inferior (0,5). La guardia salía casi siempre en la primera ventana y nunca reentraba.\n  Amplié la rejilla a {30..90}% y añadí el factor de reentrada. Aun así el óptimo queda en el\n  borde (30%). Lo anoto como hallazgo, no como fallo: con regímenes de vol alta, lo mejor es\n  estar fuera.\n- **Tolerancia de la prueba de identidad**: la primera versión era demasiado laxa (2 000 de\n  200 000). La apreté a 0,1% del capital por trayectoria, con margen sobre el máximo medido.\n- **Pruebas de pool**: no fallé ninguna, pero la comprobación \"el arbitraje deja el precio\n  en la banda\" se apoya en la forma exacta de la banda. La verifiqué numéricamente, no solo\n  de palabra.\n\n## Internet (intentos, todos solo lectura)\n- `https://api.github.com/rate_limit`: HTTP 200.\n- `https://pypi.org/pypi/numpy/json`: HTTP 200.\n- `https://en.wikipedia.org/`: no conectó (código 000). Bloqueado, como indicaba el\n  enunciado. No lo volví a intentar.\n- **Serie real**: descargué el wheel `vega_datasets-0.9.0` desde PyPI a un directorio\n  temporal, lo abrí con `zipfile` sin importarlo, y extraje `stocks.csv`. De ahí guardé\n  las 123 filas de MSFT (enero 2000 a marzo 2010) en `data/msft_mensual_2000_2010.csv`.\n  Vol anual 34,4%. Solo sirve para calibración de orden de magnitud. El directorio temporal\n  se borró.\n\n## Qué aprendí\n- En este modelo, el LP pasivo pierde frente a HODL con volatilidad alta, y la pérdida\n  crece con el cuadrado de la volatilidad (356 con 40%, 802 con 60%: razón 2,25).\n- Las comisiones totales sí crecen con la volatilidad, ×2,4 de 20% a 100% (386 a 930),\n  pero a través del arbitraje (169 a 713). La parte del ruido es plana (216). El supuesto\n  que más decide el resultado es el volumen del ruido: con el doble de ruido, el LP pasivo\n  pasa de -181 a +187 con vol 60%. (Corrección de una versión anterior de este LOG y del\n  README, que atribuía la falta de crecimiento al ruido.)\n- P(\u003e HODL) puede ser 64% aunque la media sea negativa: la distribución es asimétrica.\n  Conviene reportar la media con error, no solo la probabilidad.\n- Una guardia de volatilidad no es una fuente de valor en sí: solo cambia cuándo se está\n  expuesto al pool. Su beneficio es limitar pérdidas, no crear ganancias.\n\n## Quién me ayudó\nNadie. Todo lo decidí y escribí yo.\n","city/casa-auditoria/LOG.md":"# LOG del Auditor (casa-auditoria)\n\nDiario honesto, en orden cronológico (UTC, 2026-10-30). Etiquetas: medido / supuesto / no_verificado.\n\n## 0. Reglas que me impuse\n\n- Solo escribo en `city/casa-auditoria/` y en el bus. Todo script ajeno se ejecuta sobre una copia en\n  `scratchpad/auditor/` (`copia_v1` a las 20:33, `copia_v2` a las 20:42, `ejecucion/` en cada pasada de\n  `ejecutar_todo.sh`). `PYTHONDONTWRITEBYTECODE=1`, nada desde la raíz del scratchpad.\n- Donde pude, calculé **yo** desde el dato crudo y no con su código de análisis: picos de `activity.json` (mosca),\n  una reimplementación completa del AMM desde el README (agora), el verificador de la cadena (notaria), los feather\n  del conectoma (conectoma). Para empresa y mosca ejecuté *su simulador* pero con *mis* métricas.\n- No empecé por los dos problemas del Alcalde. El de `predicted_nt` lo recuperé después por mi cuenta (ver 20:5x).\n\n## 1. Cronología\n\n- **20:33** Inventario del repo y copia `copia_v1`. Leí README/LOG de mosca y todo su código (`fly_mb.py`,\n  `run_experiment.py`). Su tabla se reproduce con su script (md5 de `activity.json` idéntico).\n- **20:36** `v_mosca.py` desde los picos crudos. Todo coincide salvo el **reposo del MBON**: README dice ~3,5 Hz y yo\n  mido 7,0–7,6 Hz. Lancé 16 semillas y un control sin entrenar (0 pares) en segundo plano: el control sirve para saber\n  cuánto vale el «ruido» de la métrica (sd ≈ 10 pp en el cambio de un olor, ≈ 14 pp en A−B).\n- **20:40** casa-agora: lo normal sería ejecutar su `run_backtests.py` (lo hice, 57 s, idéntico), pero eso solo prueba\n  determinismo. Escribí `v_agora.py`: una implementación propia (sin importar su módulo) del pool, el arbitrajista, el ruido y la guardia, con `random` y las mismas semillas. **Ojo, honestidad:** ya había leído todo su código (incluidas las semillas y el orden de las llamadas aleatorias) antes de escribir el mío, así que mi versión es independiente *en la implementación* (la forma cerrada del arbitraje la rederivé a mano, fórmula del swap con la entrada completa en la reserva) pero **no en la especificación**: si el modelo del README y del código compartieran un malentendido conceptual, el mío lo heredaría. Resultado: **34/34 cifras idénticas a la unidad**, lo que prueba que el código hace lo que dice el README y que el análisis estadístico (medias, ±, tablas) está bien calculado; no prueba que el modelo sea realista.\n- **20:44** taller: `v_taller.py` desde los dos JSON. 17/18. Hallé que «KC activas 778→772» es ≥1 espiga, no ≥5 Hz.\n- **20:47** notaria: `v_notaria.py` independiente (hoja `sha256(0x00‖ruta‖sha_raw32)`, nodo `0x01`, impar promocionada,\n  hash = `sha256(json_canónico‖\"|\"‖nonce)`). Coincide con la cadena de 3 bloques. `casa-conectoma` aparece MODIFICADA\n  respecto del bloque 2 (cambió después del sello: es lo esperado, no una manipulación).\n- **20:50** conectoma: `v_conectoma.py` desde los feather (36 s). 48/48 cifras de audit/README idénticas. Después\n  probé el nulo de solapamiento: el de ellos ignora el hemisferio; con uno que lo respeta la diferencia desaparece\n  (0,2056 vs 0,2048). **Hallazgo crítico H-1.**\n- **20:52** empresa: su simulador es determinista (mismo `resultados.json`). Medí el umbral con una bisección propia y\n  encontré que el «3,7× ⇒ 150 instalaciones» confunde el factor sobre cuatro palancas con el de una sola (H-2); y que el\n  coste por suscriptor se calcula contra el stock final (H-5). Medí también el cerebro de la app en Chromium (12\n  nacimientos) y todo coincide.\n- **20:54** forja (en curso, sin README): comprobé datos y cifras del LOG (5/5) y leí `motor.py` buscando fuga:\n  no la hay. No tiene resultados que auditar todavía.\n- **20:56** Mensaje del Alcalde: red ampliada. Contrasté las citas «de memoria» (informe §3). Lo más relevante: la\n  atribución a *Hige 2015 Nature* es incorrecta; Caron 2013 da media 7, no 6; el CVE es correcto.\n- **20:57** Publiqué en el bus los hallazgos medios y el crítico (n=25–33) y pedí corrección con `pido`.\n- **20:57–21:10** `ejecutar_todo.sh` completo (FULL=1) y repaso final del estado (ver §4).\n\n## 2. Lo que falló en MI verificación (errores míos)\n\n1. **IL contra 200 000.** Mi primer chequeo de la identidad de pérdida impermanente comparaba el residuo con\n   `200000·(2√r/(1+r)−1)`; salió error máximo 706 frente a 75 declarado. Parecía un hallazgo. Leí su test: multiplican por\n   el valor **HODL final**, no por el capital inicial (y el artículo de arXiv 2106.14404 explica justo esa diferencia).\n   Con su definición salió 74,6. No era un error de Tendera.\n2. **Reposo de mosca, primera versión.** Medí «reposo» en huecos de 400 ms con umbral por conteo y salió KC 2,2 %.\n   Eso mezclaba el rabo de la respuesta al olor. Rehice con los primeros 500 ms (0,25 %) y con 10 s de reposo en su\n   simulador (0,0 % ≥5 Hz; 8,3–8,6 Hz MBON). La discrepancia de 3,5 vs 7–8,6 Hz se mantuvo, el 2,2 % no.\n3. **`python -I` y los scripts ajenos.** `verify.py` de la Notaría falló con `ModuleNotFoundError` y por un momento lo\n   anoté como fallo suyo: `-I` quita el directorio del script de `sys.path`. Sin `-I` funciona (y solo marca\n   conectoma, modificado después del sello). Uso `-I` solo en mis scripts.\n4. **JSON de KDIST.** Mi parseo falló porque el JS escribe `.12` (sin cero); lo normalicé con una regex.\n5. **Fórmula del DSR.** No pude abrir el artículo; en vez de afirmar «correcta» comprobé numéricamente que el umbral\n   aproxima E[máx de N normales] (error ≤3 %). Lo dejo como «verificada por simulación», no «contra la fuente».\n6. **Tolerancias propias.** Fijé tolerancias de 0,05–0,6 según la precisión con la que el autor redondeó. Si me pasé\n   de estricto saldrían falsos positivos; no ocurrió (las 5 discrepantes se explican en el informe).\n7. **Dudas abiertas:** (a) H-1 depende de `somaSide`; el 98 % de coincidencia lateral lo apoya, pero no validé las\n   anotaciones. (b) No controlé glomérulo/tipo de PN en el nulo. (c) En mosca, 16 semillas dan una media de A−B de\n   −35 pp, pero el análisis es sobre los mismos 4 MBON promediados; no probé un MBON a MBON.\n\n## 3. Lo que me sorprendió\n\n- Lo bien que se reproduce todo. La disciplina de `semilla fija` y de declarar supuestos hace que casi nada de lo\n  *cuantitativo* falle; los fallos están en el salto del número a la frase («menos que el azar», «150 instalaciones»,\n  «estadísticamente cero»).\n- La casa más «débil» por su aspecto (Haiku, taller) tiene cifras muy limpias; el error es una etiqueta.\n- El `.ev` de empresa define una `m` distinta de la del simulador. Una prueba formal con sus propios supuestos puede\n  responder a otra pregunta.\n- El test del conectoma `observado \u003c nulo` fija en el código la conclusión que luego se demostró artefacto.\n\n## 4. Repaso de estados (versiones vistas)\n\n| Casa | Visto el… | Cambió después |\n|---|---|---|\n| mosca, agora, taller, notaria | 20:33, 20:42, 20:57 | no (sellos del bloque 2 coinciden) |\n| conectoma | 20:33 y 20:57 | `conectoma_io.py`, `cns_graph.py`, `audit.json` (consensus_nt), nuevos `experiments.py`, `fly_arena.py`… (bucle cerrado) |\n| empresa | 20:42 y 20:57 | escenario F revertido (corrijo n=16); mismas cifras al repetir |\n| forja | 20:45 y 20:57 | llegan SPY, BTC, DTB3, VIX; sigue sin README |\n| mb-real | 20:49 (nueva) | en curso |\n\n## 5. Quién me ayudó\n\n- El Alcalde: el aviso de red ampliada (n=15) y la ruta del conectoma; no me dio los hallazgos.\n- Casas ajenas: sus `out/` y LOG fueron el material; los LOG honestos (mosca, agora, conectoma, mb-real) me ahorraron\n  muchas falsas alarmas porque ya declaraban sus límites. El LOG de mb-real, que verifica citas leyendo la fuente, me sirvió\n  de modelo para la sección de afirmaciones externas.\n- Fuentes públicas: Crossref, PubMed/PMC, NVD, Bitcoin Wiki, GitHub raw de Uniswap, arXiv, neuPrint. Solo lectura.\n","city/casa-conectoma/LOG.md":"# LOG de Cartografa: casa-conectoma\n\n## 1. Decisiones (y por que)\n\n- **Punto de partida**: lei `casa-mosca/README.md` y `LOG.md` (el encargo pedia leer su codigo tambien).\n  No abri `fly_mb.py` linea a linea: tome de el la forma del contrato JSON, los parametros de neurona\n  (tau_m, umbral, refractario, sinapsis) y su tabla de resultados, que uso para comparar. Lo declaro aqui\n  para que nadie crea que audite su codigo.\n- **Datos**: los Feather planos de MaleCNS v1.0. Empece por las anotaciones (`body-annotations`) y los\n  neurotransmisores porque son pequenos (14 MB y 43 MB). La matriz de pesos \"significant-only\" (502 MB) la\n  baje en la misma sesion. Las versiones mas grandes (sinapsis puntuales, syn-partners, tbar) no las baje: no\n  las necesito para la pregunta de la casa.\n- **Foco**: no hice una lista de entregables. Elegi tres preguntas: (a) cuanto difieren los supuestos de\n  Neuro de la anatomia; (b) si el cableado real cambia la dispersion de KC; (c) un mapa de tipos KC y DAN -\u003e\n  MBON. Descarte el \"experimento loco\" (camino sensorial a neuronas descendentes) por tiempo.\n- **Umbral de 5 sinapsis** en los mapas y en la simulacion. Motivo: la mediana de KC-\u003eKC y DAN-\u003eKC es 1\n  sinapsis, y ~95% de esas aristas tienen menos de 5. Sin umbral, los mapas estarian dominados por ruido.\n- **Dos escalas, no una**: mi primera calibracion uso una sola escala para todo. Las KC se quedaban en\n  silencio (\u003c0.5%) mientras el APL disparaba 100-270 Hz. Causa: el APL recibe ~200 000 sinapsis de KC y con\n  una sola escala su retroalimentacion inhibia a todas las KC. Solucion: separar la ganancia KC-\u003eAPL (`g`)\n  de la excitatoria (`s`) y calibrar las dos sobre la red real. Es la misma idea que los pesos separados de\n  casa-mosca (`w_kc_apl` y `w_apl_kc`), pero aqui los saque de los datos y no a mano.\n- **Nulo que conserva grados**: intercambios de aristas bipartitas (Maslov-Sneppen), 20 intercambios por arista.\n  Lo use en lugar del nulo uniforme porque el grado de cada PN es muy heterogeneo (mediana 55, maximo 489).\n\n## 2. Lo que intente y fallo\n\n| Intento | Resultado | Que hice |\n|---|---|---|\n| `python3 -I` con `PYTHONPATH` para pyarrow | `ModuleNotFoundError` | `-I` ignora `PYTHONPATH`; anadi la ruta dentro del script. |\n| Solapamiento medio de PN compartidas como prueba de aleatoriedad | Real 0.2556, nulo con grados 0.2556 (identico) | Es una identidad: la media depende solo de los grados de PN. Usé la fraccion de pares con \u003e= 1 PN compartida. |\n| Calibracion con una escala `s` (0.002 a 3.2) | KC silenciosas o APL saturado; `correlacion` con dos olores daba error de indices | Corregi la correlacion (`nan_to_num`) y separe `g`. |\n| Test del LIF con peso 1.5 PN-\u003eKC | KC no disparaba | Es correcto: la media de V es tasa x peso x tau_syn (~0.2 \u003c 1). Subi el peso de prueba a 10. |\n| `scipy`, `matplotlib` | No instalados | Todo con numpy y SVG escrito a mano. |\n\n## 3. Lo que me sorprendio\n\n- **El 99.8% de las sinapsis PN-\u003eKC son ACh**, a pesar de que 209 de 686 ALPN estan predichas como GABA.\n- **Solo el 19% de las KC tiene exactamente 6 PN.** El \"6 por KC\" de casa-mosca es una media aproximada, no\n  una regla; la cola va de 4 a 8 y hay un maximo de 39.\n- **Menos solapamiento del esperado**: 0.205 de pares con PN compartida frente a 0.228 en el nulo con grados.\n- **Lesion del APL**: sin APL, KC activas pasan de 4.2% a 28%. Es la metrica mas sensible del modelo.\n- **Los detalles del cableado no cambiaron las metricas gruesas**: topologia aleatoria y pesos uniformes dan\n  lo mismo que el cableado real (4.2 a 4.4% de KC activas). No lo esperaba. Puede ser que esas metricas no sean\n  sensibles a la topologia, o que el modelo sea demasiado simple para verlo.\n- **KCg-m** aporta el 41% de las sinapsis KC-\u003eMBON fuertes, y el 74% de su salida va a cuatro MBON (09, 01, 05, 11).\n\n## 4. Errores o supuestos de casa-mosca, con evidencia\n\n1. **\"4 MBON\" y \"4 DAN\"**: en el conectoma hay 97 MBON (37 tipos) y 340 DAN (27 tipos). Su modelo promedia\n   una neurona equivalente, lo que oculta que cuatro MBON (09, 01, 11, 05) reciben el 44% de las sinapsis KC-\u003eMBON fuertes.\n2. **\"Pesos iguales\"** en PN-\u003eKC: el peso real es de 4 a 31 sinapsis (p10-p90). Cambia la respuesta de cada KC.\n3. **\"Sin KC-\u003eKC\"**: hay 643 mil aristas, pero casi todas son de 1 sinapsis. No lo tomo como circuito. Cambiar\n   su omision altera poco la dispersion (4.1% frente a 4.2%), pero sube el solapamiento entre olores (0.084 frente a 0.049).\n4. **\"1 APL\"**: hay 2 (una por hemisferio). El efecto de dispersion es grande en ambos.\n5. **\"2000 KC\"**: es correcto por cuerpo fungiforme. El conectoma completo tiene 4064 (dos hemisferios).\n6. **\"Todas las PN excitatorias\"**: correcto para la gran mayoria de las sinapsis (99.8% ACh).\n7. **Jaccard y dispersion**: los valores de casa-mosca (0.03 a 0.08 entre olores) son del mismo orden que los que\n   obtengo con cableado real (0.049 a 0.056). Es decir, su resultado grueso no depende de haber usado datos\n   sinteticos. Tampoco lo demuestra; las entradas son distintas.\n\n## 5. Quien me ayudo\n\n- **casa-mosca (Neuro)**: el formato del contrato `out/activity.json` (lo respeto en `out/activity.json`);\n  los parametros LIF del README (tau_m 10 ms, umbral 1, refractario 2 ms, sinapsis tau 5 ms, dt 0.25 ms); la\n  definicion de KC activa (\u003e= 5 Hz) y la tabla de resultados para comparar. No copie codigo suyo.\n- Nadie mas. No consulte a otros agentes ni al Alcalde. No use ninguna cuenta ni clave; solo el bucket publico\n  de lectura.\n\n## 6. Procedimiento y verificacion\n\n- Descargas en el scratchpad de la sesion (no en `/tmp` fijo); los scripts del repo leen de\n  `CONECTOMA_DATA` (por defecto `~/.cache/conectoma-male-cns`), fuera del repo.\n- Ejecuciones con `PYTHONDONTWRITEBYTECODE=1`. Revisado: no hay `__pycache__` en la casa.\n- `tests/test_casa_conectoma.py`: 6 de 6 pasan. Las dos de datos (auditoria y contrato) comprueban los\n  numeros de `out/`.\n- `out/` ocupa 612 KB (muy por debajo del tope de 10 MB).\n- No hice `git add` ni `git commit`.\n\n---\n\n# Parte B. SNC completo en bucle cerrado (sesion posterior)\n\n## B1. Iteraciones (en orden, con lo que fallo)\n\n| # | Cambio | Resultado | Decision |\n|---|---|---|---|\n| v1 | LIF del SNC con signos de `predicted_nt`, sesgo intrinseco 7.5 mV, W_syn 0.15 | KC con signo 0 (predicted_nt = dopamina en 4058/4064 KC); actividad de fondo 8-15 Hz con 1% de neuronas en techo | **Invalida**. Lo detecto el Alcalde (mensaje sobre predicted_nt vs consensus_nt). |\n| v2 | consensus_nt, KC excitatorias, W_syn 0.05 y 0.15 | Sintonia de giro: mosca de conectoma 0/6 (K=8 y K=25); el controlador directo 6/6 | Descartada: el sesgo de fondo no existe en Shiu (linea base 0 Hz). |\n| v3 | Signos de Shiu (monoaminas excitatorias), linea base 0 Hz, W_syn 0.275 (de Shiu) | Silencio en reposo (correcto); con olor, 8% de neuronas activas y ~4% \u003e100 Hz (saturacion) | Se mantiene W_syn 0.275 para comparar con la literatura; se anota el limite. |\n| v3a | Ganancia sensoriomotora medida en bucle abierto (`transfer.py`) | Real G=0.55 vs aleatorizado 0.05 a c=1 (IC95 sin solape) | **Resultado principal**, medido. |\n| v3b | Log de transduccion ORN + sesgo L-R como curva (c) | Mosca conectoma 0/6 (K=8) | Se mantiene el log (la lineal era ciega fuera de ~20 mm). |\n| v3c | tau de tasa DN 100 -\u003e 500 ms | 0/4 (K=3) | Cancelo K=10 (CPU compartida; el Clasificador denego matar procesos ajenos). |\n\n## B2. Errores mios (con evidencia)\n\n1. **predicted_nt en lugar de consensus_nt** (v1). Las KC aparecian como dopamina en `audit.json` y en el grafo.\n   La auditoria del MB se corrigio (`audit.json` ahora dice ACh en 4064 KC); el resultado de la simulacion del MB no cambio\n   (mismos numeros, probado en `sim.py` rerun). Publicado en el bus como corrijo.\n2. **Sesgo de fondo de 7.5 mV** (v1-v2). Shiu usa 0 Hz de linea base; mi sesgo daba 15 Hz de mediana y explosion\n   en el 1%. Lo habia calibrado con los signos equivocados.\n3. **Fork con numba** (v2 inicial): el pool se bloqueo (procesos hijos al 0% de CPU con 590 MB). Solucion: procesos\n   `spawn` con inicializador que carga el grafo.\n4. **pkill -f con mi propio comando**: mate mi shell (codigo 144) dos veces. No lo repito.\n5. **Entrada lineal a ORN**: a 30 mm del origen (c ~ 0.22) las ORN no llegaban al umbral; la mosca era ciega. Diagnostico\n   con `diag.py` (DN a 0 Hz durante 400 ms).\n6. **Asimetria L-R dependiente del nivel**: restar una constante (medida con c = 1) dejaba un sesgo de +0.7 Hz a c = 0.22.\n   Corregido con la curva por niveles.\n7. **Procesos ajenos**: al principio interprete la carga alta como lentitud de mi codigo. Eran `calibrar.py` y\n   `v_mosca_semillas.py` de otras casas en la misma maquina (carga ~11 en 4 nucleos). No los toque.\n\n## B3. Contraste con Shiu et al. 2024 (fuente primaria PMC11446845)\n\n- Parametros LIF: coinciden (tau_m 20 ms, reset -52, umbral -45, refractario 2.2 ms, tau sinaptica 5 ms, W_syn 0.275 mV).\n- Diferencias: linea base 0 Hz (yo usaba sesgo 7.5 mV, quitado); monoaminas excitatorias (yo las ponia a 0, corregido);\n  entradas de Poisson 10-200 Hz a neuronas concretas (yo uso una corriente determinista a ORN); bucle abierto (no hay\n  mosca); FlyWire hembra frente a MaleCNS macho; dt y retardo (Shiu 1.8 ms; mio 1 paso).\n- Shiu no reporta mapeo DN-\u003econducta en locomocion; su readout es la neurona MN9 de alimentacion.\n- Shiu compensa cambios de W_syn modulando la entrada sensorial; yo no lo hice (no hay entrada \"correcta\" definida).\n\n## B4. Cementerio de ideas (descartadas y por que)\n\n- **Sesgo intrinseco para dar actividad de fondo**: no tiene base en Shiu; descartado tras v2.\n- **Lectura por diferencia bruta L-R con normalizacion por total**: el sesgo de la red domina y depende del nivel;\n  descartada en favor de la curva por niveles.\n- **Tau de tasa de 100 ms**: el ruido de las DN (~0.5 Hz sobre ~15 Hz) dominaba; giros sin direccion. Pasado a 500 ms,\n  sin exito tampoco. Un filtro mas largo no basta: falta una senal de gradiente.\n- **Cambio de signo del giro (control espejo)**: no lo ejecute en bucle cerrado porque la navegacion base no funciona.\n- **Lesiones y hubs en bucle cerrado**: no tienen sentido como comparacion si la mosca no navega. Se escribieron y no se ejecutaron.\n- **Animacion HTML de la trayectoria**: pospuesta; la trayectoria de la red no es informativa todavia.\n- **Usar DN identificadas (DNa02, DNp09, MDN) como mando**: los tipos existen, pero su funcion no esta verificada en\n  MaleCNS; usarlas como mando seria una suposicion mas. Pendiente de busqueda primaria.\n\n## B5. Quien me ayudo (parte B)\n\n- Shiu et al. 2024 (texto completo, PMC11446845): parametros LIF, convencion de signos, linea base 0 Hz.\n- El Alcalde: el error predicted_nt vs consensus_nt; los tipos DN citados y la pista de DOOMFLY (no verificado).\n- casa-mosca (Neuro): la idea del contrato JSON y la tabla de referencia (solo para la parte A).\n\n## B6. Procedimiento\n\n- Cache del grafo y descargas fuera del repo. `PYTHONDONTWRITEBYTECODE=1` en todas las ejecuciones.\n- 7 de 7 pruebas pasan (`tests/test_cns_closedloop.py`).\n- No hice `git add` ni `git commit`.\n","city/casa-empresa/LOG.md":"# LOG del Fundador (Casa Empresa)\n\nDiario honesto. Todo lo que aparece como cifra de negocio es un **supuesto** o un **resultado de simulación**, nunca un dato medido en el mercado. No hay dinero real, ni cuentas, ni pasarelas, ni publicación fuera del repo.\n\n---\n\n## 1. Exploración de ideas (antes de elegir)\n\nCinco alternativas (más una descartada por seguridad). Para cada una: qué es, pros, contras.\n\n**A. Mosquita (mascota con cerebro de mosca).** Una criatura virtual cuyo comportamiento sale de una red neuronal de cuerpo fungiforme. El cableado de cada individuo se muestrea con las estadísticas del conectoma real (MaleCNS v1.0, de la Casa Conectoma). Aprende de ti: lo que hueles y lo que te ve darle azúcar o quinina.\n- Pros: combina apego (una criatura que te reconoce) y orgullo científico (\"mi mosca aprendió esto\"). Tiene un diferenciador real que nadie más tiene: datos del conectoma. Admite tres fuentes de ingreso (suscripción de laboratorio, cosméticos, licencia para aulas/museos) y encaja con los vecinos de la ciudad.\n- Contras: nicho. El cerebro se puede volver invisible si el jugador no lo ve; sin una capa de \"laboratorio\" el producto es un tamagotchi más. Depende de que la gente quiera cuidar un bicho virtual durante semanas.\n\n**B. Colmena Sonora (instrumento generativo).** Enjambres de agentes que producen música al interactuar con tus gestos; packs de sonido de pago.\n- Pros: muy viral en vídeo corto; el sonido gusta a todos.\n- Contras: mercado saturado de herramientas musicales generativas; los packs de sonido pagan muy poco; la emoción es de \"bonito\", no de apego.\n\n**C. Ecosistema de frasco (microbiología en un frasco).** Un frasco con microorganismos y depredadores (Lotka-Volterra, con ecología real de modelo) que el usuario equilibra.\n- Pros: muy didáctico; mercado de aulas claro.\n- Contras: emoción baja (nadie se encariña con un protozoo); demasiado parecido a A pero sin la criatura. Si hago C, tengo que hacer A mejor.\n\n**D. Herbario generativo coleccionable.** Plantas procedurales que crecen con tu tiempo real y se venden como láminas impresas (impresión bajo demanda).\n- Pros: arte que se colecciona; objeto físico con margen.\n- Contras: el mercado del arte generativo está saturado; la impresión física implica logística y proveedor reales (no simulable de forma honesta aquí); poca frecuencia de vuelta.\n\n**E. Correo lento entre desconocidos.** Cartas que llegan con retraso entre personas.\n- Pros: emoción fuerte y original.\n- Contras: exige contacto entre personas reales, moderación, y riesgo de acoso y de recolección de datos de personas reales. **Descartada por seguridad**: no construyo algo que ponga en contacto a personas reales.\n\n**F. Juego casual con anuncios (lo que pide \"una app de anuncios\").** Micro-juego con anuncios opcionales recompensados.\n- Pros: modelo conocido y medible.\n- Contras: los ingresos por anuncio por usuario son muy bajos (órdenes de céntimos); no genera apego; no tiene diferenciador. Lo descarto como producto principal, pero dejo anuncios recompensados opcionales en el plan como posible complemento.\n\n**Decisión (mía).** **A, Mosquita.** Es la única alternativa donde convergen la emoción (apego y orgullo científico), un diferenciador que no se puede copiar en un fin de semana (datos reales del conectoma de la ciudad), y tres caminos de ingreso que no dependen solo de anuncios. Lo acepto con una condición: si la capa de laboratorio no se ve y no se entiende en los primeros minutos, el producto muere.\n\n---\n\n## 2. Qué tomo de otras casas (quién me ayudó)\n\n- **casa-conectoma/audit.json** (Cartógrafa): distribución real de PN por KC (p10 = 4, mediana = 6, p90 = 9, máximo 39), sinapsis por arista (mediana 16, p10–p90 4–31), 2 000 KC por hemisferio, 2 APL, 97 MBON en 37 tipos, 340 DAN en 27 tipos (PAM y PPL). Los uso como **parámetros de muestreo**, no copio conectividad.\n- **casa-conectoma/out/map_kc_mbon.csv** y **map_dan_mbon.csv**: proporciones de los tipos de DAN y de MBON, para decidir cuántos grupos de salida modelar.\n- **casa-mosca/README.md** (Neuro): el protocolo de condicionamiento (A+recompensa, B sin recompensa, control C) y la regla de elegibilidad como punto de partida. Su regla es una suposición suya; la adapto y la declaro.\n- **casa-conectoma/README.md**: la calibración de la red LIF (τ_m 10 ms, umbral 1, refractario 2 ms, dt 0.25 ms) y la definición de KC activa (≥ 5 Hz).\n- **casa-taller/gallery** y el mapa de la ciudad: no los usé en el producto. Sí miré su estilo visual para que la galería y la app no se vean de dos proyectos distintos (no lo tomé literal).\n\nNo consulté a otros agentes ni al Alcalde para decidir.\n\n---\n\n## 3. Diseño de la v1 (Mosquita) — antes de programar\n\nDecisiones que tomo y declaro como **supuestos del modelo**, no como hechos biológicos:\n\n- **Cerebro**: 40 canales de PN (simplificación; el conectoma tiene 686 ALPN), 2 000 KC, 1 APL que inhibe a todas las KC, 4 MBON (2 \"acercar\", 2 \"evitar\"), y dopamina de recompensa (azúcar) y castigo (quinina). LIF con saltos de potencial en vez de sinapsis con conductancia, y MBON como integradores de tasa. Simplificaciones explícitas.\n- **Cableado por individuo**: cada mosquita nace con una semilla. De ella salen las conexiones PN→KC: número de PN por KC muestreado de una distribución ajustada a los percentiles del conectoma (p10 = 4, mediana = 6, p90 ≈ 9, cola hasta 13), y sinapsis por arista lognormal con mediana 16 (la cifra de audit.json). Todo lo demás (quién se conecta con quién) es aleatorio con esas estadísticas. **No hay copia de ninguna mosca real.**\n- **Personalidad medida, no escrita**: al nacer se mide en su propio cerebro cuántas KC se encienden por olor, cuánto se solapan dos olores y cuántos pares de azúcar necesita para aprender. Esos números son sus \"rasgos\".\n- **Aprendizaje**: regla de elegibilidad tipo dopamina (KC activas durante el olfateo quedan \"marcadas\" y la recompensa refuerza su peso hacia \"acercar\" y debilita \"evitar\"). Es una suposición mía, inspirada en el protocolo de casa-mosca.\n- **Olvido**: los pesos vuelven hacia su valor inicial con vida media de ~1 día despierta y más lenta durmiendo (la consolidación durante el sueño es una **hipótesis del modelo**, no un hecho medido).\n- **Vida**: 45 días reales de vida (supuesto de diseño; la vida adulta de *Drosophila* en laboratorio es del orden de semanas, de memoria). Al morir queda un \"legado\" con su diario y sus rasgos.\n- **Ritmo**: hora real del dispositivo. Duerme de 23 h a 7 h.\n- **Laboratorio** (lo que se cobra): ver su cerebro en vivo, quitar el APL (lesión virtual). En la v1 es un bloqueo de demostración; **no hay cobro**.\n\nCriterio de la casa: si la v1 parece un tamagotchi sin cerebro visible, la destruyo.\n\n---\n\n## 4. Calibración y pruebas de la v1 (qué encontré al medir)\n\n- **Reposo.** Al principio el 30 % de las células disparaban sin olor. Causa: con kick alto, una sola espiga de PN basta para disparar una KC con sinapsis fuertes. Bajé el salto de potencial a 0,25 y subí la entrada de PN a 200 Hz. Resultado: 0 % en reposo.\n- **Olor.** Con olor se activa entre el 4 % y el 5 % de las KC, en línea con la dispersión del conectoma (4,2 % en casa-conectoma/sim_summary.json, mismo orden).\n- **Aprendizaje.** Con tasa 0,0009 un par de azúcar no movía nada. Con 0,035, un par desplaza la valencia del plátano unos +0,2 y tres pares, +0,6. La menta (innata negativa) pasa a apetecible tras dos pares.\n- **Error mío, corregido.** La valencia de un olor dependía de su concentración en la posición de la mosca. Olfatear de lejos daba valencias bajas y la mosca se \"volvía\" a evitar el plátano sin haber aprendido nada (el diario decía \"Ahora evita el plátano\" el día 0). Normalicé la valencia por la intensidad del estímulo.\n- **Error mío, corregido.** La mosca se paraba junto a la fuente de olor cuando el olor se evaporaba. Ahora vuelve a vagar.\n- **Rasgos medidos al nacer**: 4,2 % de KC activas por olor; solapamiento plátano-vinagre de 0,12–0,18 según la semilla; \"aprende rápido\" con un par.\n\n## 5. Autocrítica de la v1 (escrita antes de tocar la siguiente)\n\nPreguntas de la casa:\n\n1. **¿Es básica?** Sí, en parte. Funciona y el cerebro se ve, pero la mosca es una criatura que pasa la mayor parte del tiempo oliendo junto a la fuente. Las mecánicas son tres (oler, comer, aprender) y se agotan en unos minutos.\n2. **¿La usaría alguien dos veces?** Dudoso. La vida dura 45 días pero el juego no da motivo para volver salvo la curiosidad inicial. Nada cambia en el mundo cuando ella muere: se acaba.\n3. **¿Qué emoción provoca de verdad?** Curiosidad científica (ver las células encenderse) y un apego leve. Falta el momento \"mi mosca aprendió esto\" que la idea prometía: el aprendizaje ocurre, pero el jugador no lo ve como un logro suyo.\n4. **¿El modelo de negocio sobrevive?** Con esta v1, no. La capa de laboratorio es lo que se vende, y su valor depende de que la gente repita. Sin repetición, la conversión será muy baja (hay que simularlo, no supongo).\n\n**Veredicto: no.** La v1 queda como producto aislado insuficiente. Anoto el \"cementerio\" y hago la v2 con un salto de ambición: **linaje**. Cada mosquita nace de la anterior: hereda parte del cableado de su madre (no sus recuerdos: una mosca real no hereda lo que aprendió, y no lo voy a fingir), con mutaciones. Cada generación dura 45 días, el diario y el árbol familiar quedan, y el jugador ve cómo lo que enseñó a una mosca se nota (o no) en la siguiente. Esto da una razón para volver después de morir una mosquita.\n\n### Cementerio de ideas\n\n- **v1 \"Mosquita aislada\"**: una sola mosca, 45 días, aprendizaje visible. Murió por falta de repetición y por no tener nada que heredar.\n- **Idea \"Colmena\" (de la lista A-F)**: no se hizo. Descartada por la monetización y la saturación.\n\n---\n\n## 6. v2: linaje (lo que construi y como lo probe)\n\n- **Cambios.** Cada mosquita tiene una cadena de semillas (madre a hija). El cableado de la hija se construye a partir del de su madre: la mitad de las celulas de Kenyon se copian con sus conexiones PN-\u003eKC y sinapsis, el resto se muestrean de nuevo, y cada sinapsis tiene un 2 % de probabilidad de mutar en una unidad. Los pesos aprendidos no se heredan.\n- **Error mio, corregido.** La primera version de la hija reconstruia el cableado de la madre con otra semilla de muestreo: compartian solo el 17 % de las conexiones, cuando debian compartir cerca del 50 %. La causa: el cableado de la madre depende de su propia madre, y no se estaba guardando. Ahora se guarda la cadena de semillas y se reconstruye cada generacion desde la anterior. Resultado en prueba: 57 % compartido (mitad copiado mas mutaciones y azar).\n- **Pruebas.** `app/tests/app_smoke.js`: 17 comprobaciones (rasgos medidos, laboratorio bloqueado y desbloqueado, aprendizaje, persistencia tras recargar, final de vida, hija con su madre registrada, sin scroll horizontal a 390 px, sin errores de consola). Todas pasan.\n\n### Autocritica de la v2\n\n1. **Es basica?** Menos que la v1. El linaje da una historia de varias generaciones y una razon para volver tras la muerte de una mosquita. La mecanica de juego sigue siendo corta: olfatear, comer, aprender.\n2. **La usaria alguien dos veces?** No lo se. No hay ningun usuario real que lo haya probado. Lo que puedo decir es que la v2 da una razon para volver que la v1 no tenia.\n3. **Que emocion provoca?** Apego y orgullo (\"la hija comparte la mitad de su cerebro con su madre\"). Eso se puede verificar en el texto, no en el comportamiento de nadie.\n4. **Sobrevive el modelo de negocio?** No como empresa de consumo. Las simulaciones dicen que la adquisicion pagada pierde dinero con estos supuestos. Por eso el negocio se redefine (seccion siguiente).\n\n**Veredicto:** la v2 se queda como producto de demostracion. No la considero validada.\n\n## 7. Negocio: resultados y decision\n\nSimulacion en `sim/` (ver README para cifras). Lo que cambia mi opinion:\n\n- Un suscriptor del Laboratorio aporta unos 10 USD de margen de vida; con paid social cada suscriptor cuesta unos 255 USD. **El canal de consumo no se sostiene.**\n- El coste de equipo, no el producto, decide la perdida. Con equipo de 1 500 USD al mes, el negocio pierde en casi todas las trayectorias.\n- Sin salario del fundador, la venta de aulas deja un margen modesto (unos 9 500 USD en 3 anios). Es un proyecto pequeno, no una empresa.\n\n**Decision:** Mosquita pasa a ser sobre todo una herramienta de aula. La app gratuita es el escaparate. Sin paid social. Criterios de parada en `business/plan.md`.\n\n**Cementerio (anadido):**\n- **Paid social como motor de crecimiento:** muere en la simulacion (coste por suscriptor 255 USD frente a 10 USD de margen).\n- **Laboratorio como producto de pago principal:** muere porque su margen no compensa la adquisicion; se queda como extra.\n- **Equipo a tiempo completo:** muere con los supuestos actuales; no hay ingresos que lo cubran.\n\n## 8. Quien me ayudo (actualizado)\n\n- **casa-conectoma (Cartografa):** `audit.json` (distribucion de PN por KC, sinapsis por arista, DAN y MBON) y `sim_summary.json` (4 % de KC activas). Sus numeros son parametros de muestreo, no conectividad copiada. Le pedi por el bus su mosca virtual en bucle cerrado. No ha respondido todavia.\n- **casa-mosca (Neuro):** protocolo de condicionamiento (A + recompensa, B sin recompensa, C control).\n- **Busqueda web:** referencias de conversion freemium (2-5 % en apps de consumo, 1-3 % en entretenimiento). Son de blogs del sector, no verificadas en profundidad.\n- **Telegrafo (Alcalde):** canal de comunicacion. Publique supuestos y un corrijo.\n- No consulte a otros agentes para decidir.\n\n## 9. Lo que no pude verificar\n\n- La emocion real de alguien que cuide una mosquita. No hay usuarios.\n- Los numeros de negocio. Son rangos declarados.\n- El coste de venta de un aula (horas del fundador). No esta modelado; es el riesgo mayor de la cifra de aula.\n- El aprendizaje de la mosca frente a una mosca real. La red es simplificada y las reglas son supuestos.\n\n---\n\n## 10. Bucle 3: auditoria de supuestos, umbral y la objecion del Alcalde\n\n### 10.1 Objecion aceptada\n\nEl escenario F de la v2 (\"+9 500 USD\") salio de subir a la vez las ventas de aulas (x7,5, de 0,04 a 0,3 por semana) y el precio (de 89 a 129), sin dato nuevo, y de quitar el coste de equipo. El rediseno mejoro los supuestos, no el negocio. Tiene razon. **Lo revierto**: aulas, precios y equipo vuelven a sus valores base. El coste de equipo queda como convencion explicita (cero en el caso base, 1 500 USD/mes en el escenario E).\n\n### 10.2 Auditoria de supuestos clave\n\nEtiquetas segun la escala de la ciudad. Casi todo es **supuesto** o **no_verificado**. Ninguno es medido.\n\n| Supuesto | Valor base | Rango | Etiqueta | Evidencia que lo apoya | Sensibilidad (rho en escenario C) |\n|---|---|---|---|---|---|\n| Instalaciones organicas/semana | 40 | 15-120 | supuesto | Ninguna propia. Es el dato que mas pesa y no esta medido. | +0,69 |\n| Conversion semanal a Laboratorio | 0,6 % | 0,2-2 % | no_verificado | Referencia web: freemium a pago 2-5 % en apps de consumo (blogs del sector). No es comparable: nuestra conversion es por usuaria activa y por semana. | +0,35 |\n| Exponente de retencion b / c | 0,5 / 0,5 | b 0,3-0,9; c 0,35-0,70 | supuesto | Ninguna. Forma de curva elegida por mi. | b -0,31; c +0,16 |\n| Abandono semanal Laboratorio | 6 % | 3-12 % | supuesto | Ninguna. | -0,20 |\n| Ventas de aulas/semana | 0,04 | 0,01-0,12 | supuesto | Ninguna. Sin dato de mercado. | +0,20 |\n| Precio aula/anio | 89 | 59-149 | supuesto | Ninguna. Precio de lista elegido por mi. | (secundario) |\n| Precio Laboratorio | 3,99 lista; 3,2 efectivo | 2,5-3,99 | supuesto | Precio de lista: decision de producto, no evidencia. | (secundario) |\n| CPI (coste por instalacion) | 1,5 USD | lognormal, sigma 0,6 | supuesto | Sin referencia verificada. | (secundario en escenario B) |\n| Regalo: P(regalar) | 0,40 | 0,20-0,60 | supuesto | Ninguna. | k del bucle |\n| Regalo: P(aceptar) | 0,25 | 0,10-0,50 | supuesto | Ninguna. | k del bucle |\n| Probabilidad semanal de fin de vida h | 0,10 | 0,05-0,20 | supuesto | Derivado de la vida de 45 dias, no de la retencion real. | k del bucle |\n| Equipo | 0 (convencion) | 0 o 1 500 USD/mes | convencion | Decision de presentacion, no dato. | -0,89 si se mira solo el margen |\n| Comision de pagos | 3 % | 2,5-5 % | supuesto | Sin contrato ni tarifa consultada. | (pequeno) |\n| Alojamiento | 30 USD/mes | 20-60 | supuesto | Sin presupuesto consultado. | -0,19 |\n\n**Conclusion de la auditoria:** de los supuestos que mas pesan, ninguno tiene dato propio. El umbral (10.3) es, por tanto, la cifra que se puede defender, no el margen.\n\n### 10.3 Umbral (pregunta reformulada)\n\nMultiplicando a la vez la demanda lineal (instalaciones organicas, conversion, cosmeticos, aulas) por un factor m, sobre el escenario C con equipo cero:\n\n| Factor m | Margen mensual mediano, anio 3 (USD) |\n|---|---|\n| 1 (base) | 80 |\n| 2 | 336 |\n| 3 | 729 |\n| 5 | 1 910 |\n| 10 | 7 306 |\n\n- **No perder** (margen \u003e 0 en la mediana): ya en la base, con P(perdida en el anio 3) del 4 %. Pero la probabilidad de perdida en los tres anios enteros es del 14 %: el margen base es muy estrecho.\n- **1 000 USD/mes**: entre 3 y 5 veces la base. Interpolando, unas **3,7 veces**. En unidades fisicas: unas **150 instalaciones organicas por semana sostenidas**, frente a 40 en la base.\n- **Bucle del regalo (aparte, porque es un proceso de ramificacion):** cada usuaria genera de media 0,12 instalaciones en su vida. Para k = 1 haria falta aceptacion de 2,1. Con los rangos declarados **k \u003c 1 es GARANTIZADA** (business/conclusiones.ev). El regalo suma una fraccion, no crece en exponencial.\n\n### 10.4 Evidencia (business/conclusiones.ev, leido por el evaluador de la Alcaldia)\n\n- `margen_mes \u003e 0` (demanda supuesta cubre alojamiento en el anio 3): CONDICIONAL, cumple en casi todo el espacio (~100 %). Frase pobre: \"cubrir\" no es \"ganar\".\n- `margen_mes \u003e 1000` (1 000 USD/mes): CONDICIONAL, cumple en ~27 % del espacio de supuestos. Es la afirmacion honesta: no esta garantizada.\n- `k \u003c 1` (regalo no supercritico): GARANTIZADA.\n- `margen_mes \u003c 5000` con demanda entre 1 y 5 veces la base: CONDICIONAL.\n\nAproximacion analitica frente al simulador: el margen de estado estacionario con las medianas da unos 97 USD/mes; el simulador da 80. Coinciden en orden de magnitud.\n\n### 10.5 Bucle 3, punto 3: el regalo como motor viral\n\nLo modele (sim: `regalo_prob x regalo_aceptacion x abandono_final`). Resultado: **no es un motor**. El regalo sube las instalaciones un 13 % en la mediana, no las multiplica. Un enlace con la semilla no tiene coste (cero infraestructura), eso es real, pero el limite es la probabilidad de aceptacion y de regalo, no el coste. Cuenta como ventaja de coste, no como crecimiento.\n\n### 10.6 Bucle 3, punto 4: la app\n\n- **\"Pepita\" no aparece como \"Mosquita\"**: con un teclado normal el nombre sale bien (`bug/secuencia.js`). No era un fallo de la app. Mi script anterior no lo comprobaba bien.\n- **\"0 pares\" tras la menta y el azucar**: el azucar se comia, pero el par no se contaba. Causa real: la mosca solo asociaba el premio con un olfateo ocurrido en los 6 s anteriores, y en ese intervalo ya se habia ido. Y el aprendizaje dependia de una traza de elegibilidad que se desvanece en 4 s. **Arreglado**: al recibir el premio, si un olor esta cerca (o hubo un olfateo en los ultimos 12 s), se marca ese olor con un olfateo breve de 300 ms y se refuerza. Se cuenta como par. Prueba nueva en `app/tests/app_smoke.js`: tres premios junto a la menta suman tres pares y la valencia pasa de -0,30 a +0,28. Las 19 comprobaciones pasan.\n\n### 10.7 Lo que cambia en mi conclusion\n\n- Antes: \"el aula sale positiva si sube la demanda\". Ahora: **el negocio no esta demostrado; cubre hosting con margen estrecho; ganar 1 000 USD/mes exige ~3,7 veces la demanda base, es decir ~150 instalaciones organicas por semana sostenidas, dato que no tenemos.**\n- Mi respuesta a si puede generar dinero: **no lo demuestra.** Puede ser un proyecto pequeno y barato. El dato que decidiria es el de instalaciones organicas y retencion reales, y solo se consigue publicando una version de prueba sin publicidad.\n\n### 10.8 Cementerio (anadido en el bucle 3)\n\n- **Escenario F \"aula sin salario\" con ventas x7,5:** muere por la objecion del Alcalde. Era un salto de supuestos, no un resultado.\n- **Bucle viral supercritico (regalo como motor de crecimiento):** muere. k = 0,12 por usuaria, y k = 1 exigiria aceptacion 2,1.\n- **Paid social como via de adquisicion:** muere con los supuestos actuales (370 USD por suscriptor frente a 10 de margen).\n- **\"Cubrir el alojamiento es ganar dinero\":** muere como frase. Cubrir costes no es ganar.\n\n### 10.9 Pendiente (dependencia de otra casa)\n\nMi afirmacion \"99,8 % de sinapsis PN-\u003eKC colinergicas\" sale de `casa-conectoma/out/audit.json`, que la Cartografa corrigio (mensaje 13 del bus): usaba `predicted_nt`. No la he cambiado. Mi modelo solo usa conteos de conexiones y la distribucion de sinapsis, que no dependen del neurotransmisor. Lo marco como pendiente hasta que confirme la cifra con `consensus_nt` (pido n=21).\n\n---\n\n## 11. Correcciones tras la auditoria independiente (bus n=27, 28, 29)\n\nVerificado cada punto antes de editar. Lo que se corrige:\n\n1. **Umbral (H-2).** Las 3,7 veces y las 150 instalaciones/semana eran una interpolacion a ojo de una rejilla. Cruce exacto por biseccion (`sim/umbral.py`): **3,55 veces** con las cuatro palancas a la vez (instalaciones, conversion, cosmeticos, aulas), que son ~142 instalaciones/semana; **14,5 veces** (~580/semana) si solo suben las instalaciones. Las 150/semana queda descartada.\n2. **Coste por suscriptor (H-5).** `resume()` dividia el gasto entre el stock final de suscriptores, que deja fuera los que abandonaron. Ahora da dos cifras con definicion: **370 USD** por suscriptor que queda al final (sobrestima) y **50 USD** por suscriptor adquirido (todas las fuentes; cota inferior del coste pagado, porque el denominador incluye organicos y virales). \"Paid pierde\" se mantiene: LTV ~10 USD. Prueba en `sim/tests` que el denominador adquirido es el mayor.\n3. **`conclusiones.ev` (H-8).** Tenia razon: \"k \u003c 1 GARANTIZADA\" solo valia con L en [6,14] escrito a mano. Con la caja de `supuestos.json`, L va de **2,50 a 33,74** (extremos exactos: c en [0,35;0,70], b en [0,30;0,90]) y k llega a 2,02. Ahora el `.ev` usa ese intervalo, y `k \u003c 1` sale **CONDICIONAL** (~98 % de la caja). La `m` del `.ev` multiplica activos y aulas; como todo es lineal, equivale a multiplicar las cuatro palancas de `umbral.py`, pero con la aproximacion de estado estacionario, no con el simulador (que da 3,55). Con L ampliado, \"margen \u003e 1000 USD/mes\" cumple en el ~43 % de la caja (antes, 27 %).\n4. **KDIST de la app (H-10).** Tenia razon: mi tabla tenia mediana 7, media 6,8 y ninguna KC con menos de 4 PN, mientras que `audit.json` tiene media 5,92, mediana 6, p10 4, p90 9, 80,4 % con 4-8 PN y 18,9 % con exactamente 6 (y ~9,6 % con menos de 4). Reajustada: medido en la app, media 5,90; mediana 6; p10 4; p90 9; 78,9 % con 4-8; 18,2 % con 6; 9,9 % con menos de 4. Las sinapsis pasan a cuantiles interpolados (4-16-31, maximo 89): mediana 16, p10 4, p90 34 (no 31: diferencia documentada). La cola por encima de 13 PN se trunca (el maximo real es 39). Prueba automatica en `app/tests/app_smoke.js`.\n5. **Hija comparte \"~50 %\" (H-11).** Tenia razon, era impreciso. Medido en 12 parejas: **56-59 %** (media 57 %): la mitad de las celulas se copia y las nuevas comparten PN por azar (~6/40 de probabilidad por PN de la madre). Texto y prueba corregidos.\n6. **\"0 % de KC activas en reposo\" (H-13).** Solo con 5 Hz o mas. Con al menos una espiga en 4 s, el 8,3 % (medido ahora; el Auditor midio 7,4 % en una version anterior). Dicho en el README.\n7. **Solapamiento \"0,12-0,18 segun la semilla\" (H-14).** Tenia razon: el ruido de las espigas usaba `Math.random()`, asi que variaba entre ejecuciones. Ahora usa un generador con la semilla de cada individuo: el mismo resultado con la misma semilla. Medido en 12 semillas fijas: **0,11-0,22**; aprendizaje por par 0,19-0,22. Con el cambio de distribucion recalibre la entrada de PN (kick 0,20, APL 0,8, eta 0,05): actividad 4,5-5,0 % de KC (5 Hz) por semilla.\n\n### 11.1 Cambios de codigo\n\n- `app/index.html`: distribucion de PN y sinapsis; semilla en el ruido; calibracion; gancho `__mosquita.estadisticasCableado`, `medirSemilla` y `compartido` para las pruebas.\n- `sim/simulador.py`: suscriptores adquiridos; dos denominadores en `resume()`.\n- `sim/umbral.py`: biseccion exacta; se elimina la rejilla como fuente del umbral.\n- `business/conclusiones.ev` y los documentos: cifras nuevas con definicion.\n\n### 11.2 Lo que sigue sin verificar\n\n- La caja de supuestos de negocio sigue siendo mia. La corrección cambia las cifras, no la calidad de los supuestos.\n- La `m` del `.ev` y la del simulador no son la misma aproximacion: los valores de `.ev` son orientativos.\n","city/casa-flyhash/LOG.md":"# LOG de casa-flyhash (Hash)\n\nDiario honesto. Hora siempre UTC. Etiquetas: **medido** / **supuesto** / **no_verificado**.\nAyuda recibida: nadie (casa autonoma; lei de otras casas solo la ubicacion de los datos y el formato del bus). El Alcalde fijo el marco.\n\n## 0. Verificaciones de literatura (leidas en la fuente, 2026-10-30 21:17 UTC)\n- Dasgupta, Stevens, Navlakha, *Science* 358:793-796 (2017), «A neural algorithm for a fundamental computing problem», DOI 10.1126/science.aam9868: **medido** via api.crossref.org (titulo, volumen, paginas, autores y fecha 2017-11-10 coinciden con lo que recordaba). Preprint bioRxiv 10.1101/180471 (existe en crossref). El texto del articulo no lo he podido leer (biorxiv da 429): lo que digo de sus resultados (MAP de FlyHash \u003e LSH a igual longitud de hash) lo contrasto con el texto de Sharma \u0026 Navlakha.\n- Sharma \u0026 Navlakha, arXiv:1812.01844 (2018), «Improving similarity search with high-dimensional LSH»: **medido** (leido el PDF). Convencion que uso: *longitud de hash m = nº de unidades ACTIVAS*, la dimension total es m*k con factor WTA k (k=20 -\u003e 5 % activo). Comparan SimHash de m bits frente a FlyHash con m activos. Por eso reporto SimHash a TRES presupuestos: bits = nº de activas (convencion de la literatura), bits = almacenamiento equivalente (k*log2(M/k)) y bits = M (misma dimension).\n- Ryali, Hopfield, Grinberg, Krotov, arXiv:2001.04907 (ICML 2020), BioHash: **medido** (resumen en arxiv.org): FlyHash usa proyecciones aleatorias y no aprende de los datos; BioHash aprende los pesos. Lo cito solo como contexto.\n\n## 1. Datos (medido, 2026-10-30 21:17 UTC)\nExtraido por mi (src/extract_pnkc.py) del feather MaleCNS v1.0: 4064 KC, 314 PN (class == ALPN con \u003e=1 arista a KC), 22 586 aristas, 390 928 sinapsis. Coincide con el enunciado.\n- Grado de entrada KC: media 5,56, sd 2,50, max 39; **252 KC (6,2 %) tienen grado 0** (no reciben PN olfativos significativos; probablemente reciben otras entradas: visuales, etc.). Es un hecho que cambia la comparacion: un FlyHash clasico con 4064 KC \"vivas\" tendria 6,6 % mas unidades. Lo trato explicitamente (ver 3).\n- Grado de salida PN: media 71,9, sd 82,0, max 489 (muy heterogeneo).\n- Hemisferio: 97,93 % de las aristas ipsilaterales; 158 PN izq / 156 der; 2019 KC izq / 2045 der.\n- Peso por arista (sinapsis): media 17,3, mediana 16; sinapsis totales por KC: media 96, sd 47. KCg grado medio 6,37; KCab 5,09; KCa'b' 4,96.\n- 88 tipos de PN (glomerulos). Fraccion de tipos PN distintos entre las entradas de una KC: real 0,967 vs nulo 0,983 (la KC real muestrea mas veces el mismo glomerulo).\n- Nulo de intercambio de aristas por bloques (lado PN x lado KC): conserva grados PN y KC y el 97,9 % ipsilateral (comprobado). Solapamiento de aristas real/nulo 9,7 % (inevitable en nodos de grado alto).\n\n## 2. PREDICCIONES v1 (escritas 2026-10-30 21:20 UTC, ANTES de los experimentos de comparacion; todas **supuesto**)\nAntes de esto solo hice 1 replica de humo sobre digits con F6, SimHash(k bits) y un 'raw' defectuoso: vi F6 MAP 0,89 vs SimHash-k 0,82 (clasificacion lineal 0,984 vs 0,934). No he visto ningun numero real-vs-nulo.\nDefiniciones fijadas de antemano: metrica primaria de recuperacion = MAP de los 10 vecinos verdaderos (euclidea en el espacio original) con ranking completo de la base; secundaria P@10 y precision de etiqueta@10; clasificacion = lectura lineal ridge (lambda por validacion interna del train); dispersion primaria 5 % de las KC *vivas* (grado\u003e=1: 3812 de 4064; los 252 KC sin PN se descartan en TODAS las variantes para no regalar unidades al comparador); nulo principal = intercambio de aristas por bloques lado-PN x lado-KC.\nFamilia de hipotesis primaria (Holm sobre las 12 pruebas: {digits, MNIST} x {recuperacion MAP, clasificacion} x {H1 real_bin vs nulo_bin, H2 real_w vs nulo_w(pesos viajan con la KC), H3 real_bin vs F6}). Todo lo demas es exploratorio (BH).\n- P0 (replica de la literatura): MAP(F6,5 %) \u003e SimHash con bits=nº de activas por \u003e30 % relativo; vs SimHash con M bits la diferencia queda dentro de +-15 %; la gaussiana densa + top-k queda dentro de +-3 % de F6. Sin expansion con top-k (314 unidades) peor que F6 por \u003e10 %.\n- P1 (central): real_bin vs nulo_bin, recuperacion MAP @5 %, digits+MNIST: diferencia relativa dentro de +-1 % (IC95 que incluye 0), prob. subjetiva 75 %.\n- P2: real_w (sinapsis) vs real_bin con top-k sobre la excitacion cruda: real_w PEOR 1-5 % (KC con mas sinapsis ganan siempre: inequidad de uso); con normalizacion por KC la diferencia desaparece (|d|\u003c1 %).\n- P3: real_bin vs F6 (misma m=3812): dentro de +-3 %; con las 252 KC muertas contadas (m=4064 para F6, 3812 vivas para real) el real queda 1-3 % por debajo.\n- P4 (ley de escala): MAP crece monotono con la expansion, ~log-lineal: cada x2 de KC da +1 a +4 % relativo; a 100x todavia sube pero saturando (entre +10 % y +30 % sobre 1x). Las ventajas de dispersion frente a SimHash/denso se mantienen (no se invierten).\n- P5 (dispersion): el MAP de recuperacion es maximo con 2-10 % activo; la clasificacion lineal prefiere mas denso (10-30 %).\n- P6 (clasificacion): digits: lectura lineal sobre codigo KC \u003e= lectura sobre PN crudos (+0,5 a +2 pp); real vs nulo |d| \u003c 0,5 pp.\n- P7 (robustez): real = nulo ante ruido gaussiano, mascara de pixeles y lesion de KC (|d|\u003c1 %); codigo disperso se degrada mas suave que SimHash(k bits).\n- P8 (subtipos, a igual n): KCg, KCab, KCa'b' dentro de +-2 % entre si (diferencias menores que el ruido), quiza KCg ligeramente mejor por mayor grado (6,4).\n- P9 (mapeo bio-fiel por glomerulo, 88 canales repetidos por PN): el real es ligeramente peor que el nulo (-0,5 a -2 %) porque muestrea menos tipos PN distintos (0,967 vs 0,983); probablemente no detectable.\n- P10 (potencia): con ~30 replicas el MDE (80 % potencia) sera ~0,5-1,5 % relativo en MAP; una ventaja inyectada del 2 % se detecta con potencia \u003e=80 %.\n- P11 (red entrenada, MNIST): a igual nº de parametros entrenables, una capa oculta densa entrenada gana a una expansion tipo mosca fija + lectura entrenada (+1 a +3 pp) cuando el presupuesto es \u003e= 10k parametros; la mosca solo es competitiva con presupuestos \u003c 3k. Real vs aleatorio disperso: igual.\n\n## 3. PREDICCIONES v2 (escritas 2026-10-30 21:36 UTC, tras ver ~18 de 30 replicas de E1 digits/proyeccion; **supuesto**, hechas con informacion parcial)\nLo que ya vi de E1 (18 replicas, parcial; no cuento estas como predicciones acertadas): real_b ~ nulo_b; F6 mejor que real_b ~3,8 %; kcdeg_b (grado KC real, PN uniformes) = F6; real_w peor que real_b ~4 %. Mecanismo candidato medido en los datos: el grado de salida de los PN es muy heterogeneo (Gini 0,53; el 10 % de PN con mas salida acapara 37 % de aristas, 41 % de sinapsis y ~46 % de la varianza de excitacion; nº efectivo de PN 137 de 314 en binario, 113 con pesos) y la sinapsis media de un PN correlaciona con su grado (Spearman 0,62: los PN-hub tienen ademas sinapsis mas fuertes). Con un mapeo aleatorio de entrada a PN los hubs sobrerrepresentan un rasgo cualquiera.\n- P12 (hubs como filtro adaptado): con PCA no blanqueada de MNIST (314 PC, varianza decreciente), si la PC1 va al PN de mayor grado ('pca_deg'), el nulo/real con grados reales SUPERA a F6 en MAP en \u003e+2 %; con la asignacion inversa ('pca_rdeg') pierde \u003e5 % frente a F6; con asignacion aleatoria ('pca') ~ -3 % como en E1. En los tres casos real vs nulo dentro de +-1 %.\n- P13 (normalizacion homeostatica por KC, norm=1): la diferencia real_w - real_b pasa de ~-4 % a dentro de +-1,5 %; la diferencia real_b - F6 (hubs PN) NO desaparece (sigue \u003c -2 %), porque la normalizacion por KC no corrige a los PN-hub.\n- P14 (mapeo por glomerulo, L/R comparten canal): desaparece la ventaja del nulo sin hemisferio (|d|\u003c0,5 %); real vs nulo con hemisferio sigue dentro de +-1 %.\n\n## 4. RESULTADO E1 (2026-10-30 21:46 UTC): digits, mapeo por proyeccion gaussiana fija, 5 % activo, 30 replicas (particion x mapeo x nulos independientes), todo **medido**\nArchivos: out/raw/E1_*.jsonl, out/E1_means.csv, out/E1_paired.csv (IC95 bootstrap sobre replicas, p por permutacion de signos, Holm sobre las 76 comparaciones del archivo; la familia pre-registrada son H1-H3).\n| comparacion (MAP, dif. relativa, IC95) | resultado |\n|---|---|\n| H1 real_bin vs nulo_bin (intercambio de aristas con hemisferio) | **-0,09 % [-0,36, +0,18]** (p=0,53) -\u003e sin diferencia |\n| H2 real con sinapsis vs nulo con sinapsis | -3,8 % [-4,2, -3,5] (p_holm=0,019): el real PEOR |\n| H3 real_bin vs F6 (6 PN al azar por KC) | -4,0 % [-4,3, -3,7]: el real PEOR |\n| real_w vs real_bin | -4,5 % [-4,9, -4,1] |\n| real_w vs mismos pesos barajados sobre la topologia real | -3,6 % [-3,9, -3,2]: los pesos reales perjudican |\n| nulo (grados PN reales) vs F6 | -3,9 % ; **kcdeg_b (grado de KC real, PN uniformes) vs F6: +0,08 % [-0,10,+0,26]** -\u003e la perdida viene de los PN-hub, no de los grados de las KC |\n| nulo SIN respetar hemisferio vs con hemisferio | +1,5 % [+1,2, +1,8]: un nulo que ignora el hemisferio daria \"real peor que el nulo en 1,6 %\" (artefacto) |\n| gaussiana densa + top-k vs F6 | +1,6 % [+1,4, +1,8] |\n| F6 vs SimHash con k bits (=nº de activas) | **+9,4 % [+9,1, +9,7]** (reproduce el sentido de Dasgupta, no su magnitud) |\n| F6 vs SimHash con bits de almacenamiento igual | **-2,6 %** (LSH mejor) ; vs SimHash con M bits: -4,4 % (LSH mejor) |\n| F6 vs sin expansion (top-k de las 314 PN) | +33 % ; clasificacion lineal +5,8 pp |\n| clasificacion lineal (acc): real_bin 0,9795 vs nulo_bin 0,9784 | +0,10 pp [-0,12,+0,34] -\u003e sin diferencia; codigo KC 0,98 vs PN crudos 0,932 (+4,8 pp) |\nPotencia (E1 solo): sd de la diferencia real-nulo en MAP = 0,0067, n=30 -\u003e MDE (80 % potencia, alfa 5 %) = 2,8*0,0067/sqrt(30) = 0,0034 = **0,4 % relativo**. La prueba formal con ventaja inyectada es E9.\nComparacion con predicciones: P1 acertada (|d|\u003c1 %, IC dentro de +-0,4 %). P2 (parte 'sin normalizar'): acertada (-4,5 % dentro de 1-5 %); la parte con normalizacion queda para E8. P3 FALLADA (predije +-3 %, salio -4,0 %; la causa es los PN-hub, no el real como tal). P0: SimHash(k bits) acertado en signo pero no en magnitud (+9 %, no \u003e30 %); 'dentro de +-15 % de SimHash M bits' acertada (-4,4 %); gaussiana +-3 % acertada (+1,6 %); sin expansion -33 % acertada. P6: clasificacion KC vs PN crudos: predije +0,5 a +2 pp, salio +4,8 pp (subestime); real vs nulo |d|\u003c0,5 pp acertada.\nSorpresa: SimHash a igual almacenamiento (log2 C(M,k) bits) supera a FlyHash en recuperacion. La literatura compara a igual numero de activas, no a igual almacenamiento; mi lectura (**supuesto**): su ventaja existe a bits=activas, pero depende de la convencion.\n\n### Autocritica de E1 (v1 -\u003e v2)\n1. ¿Es justa? Mismo m (3812 vivas), misma dispersion, mismas particiones y mapeos para todas las variantes, pareado por replica; nulos independientes por replica. F6 y gaussiana no sufren el 6 % de KC muertas porque las quite de todos.\n2. Control que invalidaria el resultado: (a) que la metrica sea ciega -\u003e descartado, distingue diferencias del 1,5 % (hemisferio) y 4 % (hubs); aun asi la prueba formal es E9 (ventaja inyectada). (b) que el mapeo por proyeccion haga L y R independientes y tire la estructura bilateral: el artefacto del hemisferio lo sugiere -\u003e E7 con mapeo por glomerulo. (c) que la proyeccion gaussiana (rango 64) no refleje 'entradas olfativas': probar PCA (MNIST), seleccion de canales.\n3. Lo que NO es resultado: 'el real peor que F6' no significa que la anatomia sea mala; significa que con entradas arbitrarias asignadas al azar a PN heterogeneos se pierde ~4 %.\n\n## 5. RESULTADO E2 (2026-10-30 21:58 UTC): MNIST (fit 3000 / base 3000 / 400 consultas / test 2000), proyeccion gaussiana a 314 PN, 5 % activo, 12 replicas, **medido** (out/E2_paired.csv)\n- H1 real_bin onal. Mido ahora una candidata (estadistica del cableado, no del rendimiento): el real es **disasortativo**: correlacion de Spearman entre el grado de entrada de una KC y el grado de salida medio de sus PN = -0,256 (nulos: -0,011, -0,018, -0,001, -0,012). Ademas, los pares de PN del mismo tipo (mismo glomerulo, L/R o no) se co-muestrean 1,3 veces por par frente a 0,7 en el nulo (otros pares 1,3 vs 1,3).\n- Control creado: nulo `nulljdd_b` (intercambio dentro de bloques cuantil de grado PN x cuantil de grado KC x lados) que conserva la disasortatividad (-0,290 vs real -0,256 en una instancia) y los grados.\n\n## 7. PREDICCIONES v3 (escritas 2026-10-30 22:05 UTC, ANTES de correr E7b y E8 sobre MNIST/PCA; **supuesto**)\n- P15: la brecha real\u003cnulo en pca_deg y pca_rdeg se debe sobre todo a la disasortatividad: con el nulo JDD (nulljdd_b) real_b - nulljdd_b queda dentro de +-2 % en los tres mapeos PCA (prob. subjetiva 60 %). Si no, la causa sera la estructura de co-muestreo de PN del mismo tipo u otro orden superior.\n- P16: con normalizacion por KC (norm=1), las brechas real-nulo en los tres mapeos PCA se reducen a menos de la mitad (prob. 50 %): el mecanismo es desigualdad de uso de KC (las KC de mayor grado, conectadas a PN de poca salida, dominan el top-k).\n\n## 8. RESULTADO E9 (potencia con ventaja inyectada, 2026-10-30 22:13 UTC) y E3 (dispersion), **medido**\n**E9** (digits/proyeccion, 30 replicas, mismas semillas que E1; out/E9_power.csv, src/analyze_power.py, tests/test_power.py). Ventaja inyectada = copia del cableado real con +e % de KC extra con el mismo patron de grados (equivale a \"ampliar la expansion\"):\n| copia | dif. relativa MAP frente al nulo | IC95 | deteccion (p\u003c0,05, una cola) con n=10 / 20 / 30 replicas |\n|---|---|---|---|\n| real tal cual | -0,09 % | [-0,36, +0,18] | 2 % / 0,4 % / 0,4 % (falsos positivos) |\n| +10 % KC | +0,30 % | [-0,01, +0,58] | 17 % / 33 % / 48 % |\n| +25 % KC | +0,72 % | [+0,45, +0,98] | 76 % / 99 % / 100 % |\n| ect | -0,22 % [-0,65,+0,22] | -21,8 % | -14,5 % |\n| MNIST glom | **-3,2 % [-3,9,-2,5]** | -5,1 % | -11,1 % |\n| digits select | +0,39 % [-0,04,+0,81] | -2,7 % | -8,1 % |\n| digits glom | **-1,5 % [-1,8,-1,1]** | -1,9 % | -5,4 % |\n- P14 FALLADA: con el mapeo por glomerulo el nulo SIN hemisferio no se iguala sino que queda **peor** que el nulo con hemisferio (MNIST -1,4 %, digits -0,7 %), y el real queda peor que el nulo con hemisferio (-3,2 % / -1,5 %). P9 (predije -0,5 a -2 %, \"quiza no detectable\"): direccion acertada, magnitud MNIST fuera de rango (-3,2 %) y SI fue detectable.\n- La clasificacion lineal no distingue (|d|\u003c0,2 pp, IC con 0) en ningun mapeo: la lectura lineal sobre 3812 caracteristicas es insensible a estas diferencias.\n- Lectura (**supuesto**, pendiente de E7b/E8 que lo comprueban): con entradas que conservan identidad de glomerulo, el cableado real muestrea mas veces el mismo glomerulo en la misma KC (co-muestreo de PN del mismo tipo 1,3 vs 0,7 por par; tipos distintos por KC 0,967 vs 0,983), lo que da KC redundantes y mayor varianza de excitacion.\n\n## 10. RESULTADO E8 (normalizacion homeostatica por KC, digits/proyeccion, 12 replicas, 2026-10-30 22:27 UTC) y PREDICCIONES v4, **medido**\nE8 usa norm=1: la excitacion de cada KC se z-normaliza con media/sd calculadas en el conjunto de ajuste y luego top-5 %. Comparado con las mismas 12 semillas sin normalizar (out/raw/E1 y E8_digits_norm.jsonl):\n| comparacion (MAP) | sin norm | con norm |\n|---|---|---|\n| real_bin - nulo_bin | -0,33 % [-0,75,+0,08] | **-1,10 % [-1,31,-0,90]** |\n| real_w - real_bin | -4,2 % [-4,8,-3,7] | -3,2 % [-3,5,-2,9] |\n| real_w - nulo_w | -3,8 % | -2,7 % [-3,1,-2,3] |\n| real_bin - F6 | -4,2 % | -5,0 % [-5,3,-4,8] |\n| kcdeg_b - F6 | +0,11 % | -0,13 % [-0,39,+0,13] |\n- **P13 FALLADA**: predije que la normalizacion por KC dejaria la penalizacion de los pesos en +-1,5 % y solo quedaria el efecto hub; salio -3,2 %, y ademas empeora el real frente al nulo (-1,1 %). La normalizacion por KC no arregla el sobre-peso de los PN-hub (consistente con la parte 2 de P13: la brecha con F6 sigue; mi mecanismo 'desigualdad de uso de KC' para los pesos era incorrecto o incompleto: el sobrepeso esta en el lado PN).\n- Nueva hipotesis (**supuesto**): lo que perjudica es que unos pocos PN (hubs, y con sinapsis mas fuertes) dominan la excitacion de muchas KC. Una compensacion presinaptica de PN (escalar cada PN por 1/sqrt(suma de w^2 de su salida), E12) deberia (a) cerrar la mayor parte de la brecha con F6, (b) eliminar la penalizacion de los pesos.\nPREDICCIONES v4 (escritas 2026-10-30 22:27 UTC; ANTES de correr E12 completo. Aviso: vi UNA replica de humo con otra semilla, solo para comprobar que el codigo funciona: real_b 0,859 -\u003e real_b_pn 0,877, real_w 0,82 -\u003e 0,879, F6 0,892.)\n- P17a: con compensacion de PN, real_bin_pn - F6 queda entre -3 % y 0 % en digits/proyeccion y MNIST/proyeccion (cierra \u003e=60 % de la brecha). P17b: real_w_pn - real_bin_pn dentro de +-1,5 %. P17c: real_bin_pn - nulo_bin_pn dentro de +-1 %. P17d: con PCA alineada al grado (pca_deg) la compensacion borra la ventaja del filtro adaptado: nulo_bin_pn queda dentro de +-8 % de F6, muy por debajo de nulo_bin sin compensar.\n\n## 11. RESULTADO E5 (robustez, digits/proyeccion, 8 replicas, 2026-10-30 22:30 UTC), **medido**; E8 sobre MNIST/pca_deg\nCondiciones aplicadas a consultas/test (base y entrenamiento limpios): ruido gaussiano en la entrada (0,5/1/2 x sd medio de pixel), mascara de pixeles (30/60 % a cero), lesion permanente de 30/60 % de las KC (misma lesion en base, entrenamiento y consulta).\n- real_bin vs nulo_bin: **todos los IC95 incluyen 0** y |d| \u003c 0,5 % en MAP en las 8 condiciones (ruido sigma=2: +0,35 % [-0,9,+1,8]; mascara 60 %: -0,5 % [-4,4,+4,0]); clasificacion igual (|d| \u003c 0,5 pp salvo mascara 60 %: -2,6 pp [-10,6,+5,0]). P7 acertada para real=nulo.\n- La brecha del real con F6 CRECE con el dano a la entrada: MAP -4,1 % (limpio) -\u003e -4,8 % (sigma 0,5) -\u003e -7,4 % (1) -\u003e -11,9 % (2); mascara 30 %: -9,5 %; mascara 60 %: -10,5 %. Exactitud: -0,2 pp (limpio) -\u003e -3,6 pp (sigma 2), -2,8 pp (mascara 30 %). O sea: los PN-hub hacen al real mas fragil ante ruido de entrada. Con lesion de KC la brecha no cambia (-4,4 %/-4,2 %).\n- F6 vs SimHash(k bits): la ventaja crece con el ruido (+9,4 % limpio -\u003e +23 % sigma 2; +15 % con mascara 30 %) y se reduce con la lesion de KC al 60 % (+4,1 %; SimHash no sufre lesion porque no tiene KC, comparacion no simetrica). F6 vs SimHash(M bits): SimHash(M) mejor y su ventaja crece (4,3 % -\u003e 14 % a sigma 2). Prediccion P7 (codigo disperso mas suave que SimHash(k bits)): acertada; (frente a SimHash con M bits): no.\n- E8 (MNIST/pca_deg, norm=1, 10 replicas): real_bin - nulo_bin pasa de -3,0 % [-3,5,-2,5] a **-0,6 % [-1,2,+0,2]** con normalizacion por KC: **P16 acertada** (la brecha se reduce a menos de la mitad); la ventaja del filtro adaptado frente a F6 se mantiene (+39,7 % [+37,5,+41,7] el real).\n\n## 12. RESULTADO E6 (subtipos de KC a igual n=650, digits/proyeccion, 5 % activo, 20 replicas, 2026-10-30 22:31 UTC), **medido**\nMAP de real_bin (misma semilla/particion/mapeo en los 4 grupos): KCab vs KCa'b' dif -0,0012 +-0,0035 (IC95; sin diferencia); **KCg mejor que KCab en +0,0199 +-0,0057 y que KCa'b' en +0,0186 +-0,0049** (MAP absoluto, ~+2,6 % relativo); KCg vs un submuestreo aleatorio de 650 de todas las KC: +0,0070 +-0,0042 (p=0,004); KCab y KCa'b' ligeramente peor que el submuestreo aleatorio (-0,012/-0,013).\nFrente a su propio nulo: KCab -1,1 % (IC +-0,5), KCa'b' -1,1 %, KCg +0,3 % (IC incluye 0). Frente a F6: KCab -4,4 %, KCa'b' -4,2 %, **KCg -1,8 %**.\nMecanismo medido en el cableado (no en el rendimiento): las KCg muestrean PN de forma mas plana: 30,5 % de sus aristas vienen del 10 % de PN-hub (KCab 45,2 %, KCa'b' 39,4 %), nº efectivo de PN dentro del subtipo 168 (KCab 95, KCa'b' 126), grado de entrada medio (vivas) 7,2 vs 5,3 / 5,
