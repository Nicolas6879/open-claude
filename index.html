+3,8 % [+3,0,+4,6]** |\n| digits glom | -1,5 % [-1,8,-1,1] | **+0,2 % [-0,2,+0,7]** | +1,7 % [+1,5,+1,9] |\n| MNIST proj | -0,14 % | -0,02 % [-0,5,+0,5] | +0,12 % [-0,3,+0,5] |\n **P18 ACERTADA** (las tres cotas). Con mapeo por glomerulo la desventaja del real frente a su nulo es **toda** la redundancia de entradas del mismo tipo (el cableado real muestrea mas de una vez el mismo glomerulo en la misma KC; un nulo que respeta grados pero reparte al azar casi nunca lo hace). Con mapeos que no ven el tipo, esa redundancia es invisible. Es la unica estructura 'mas alla de grados' que he identificado causalmente con consecuencia funcional en el mapeo bio-fiel; resulta contraproducente para la tarea (supuesto: en la mosca la redundancia puede servir a otra cosa: robustez, ruido sinaptico, entradas L/R; no probado).\n\n## 18. E10 v1 (red entrenada) y autocritica, 2026-10-30 23:07 UTC; PREDICCIONES v6 para E10 v2 (escritas 2026-10-30 23:07 UTC, **supuesto**)\nE10 v1 (2 semillas, out/raw/E10v1_net.jsonl; mapeo PCA a 314 PN no blanqueada; lecturas con Adam 12 epocas, 20 000 muestras): fly_lin_f6 0,71-0,92 (2,5k-80k parametros), real/nulo 0,63-0,88, dense (hidden entrenada) 0,69-0,965, rf_lin (ReLU aleatorias densas + lectura) 0,92-0,96. **Descartado por dos fallos mios**: (1) la lectura con Adam estaba subajustada (la ridge de E2 con 3000 muestras ya daba 0,919 para 3812 KC; aqui Adam con 20 000 daba 0,899 para 3999); (2) elegi PCA no blanqueada, que es el mapeo MAS desfavorable para F6 (E7: MAP 0,40 vs 0,65 con proyeccion). v2: lecturas lineales (fly_lin_*, rf_lin) en forma cerrada (ridge, una eigh, lambda en validacion), dense y fly_hid con Adam (3 lr, 25 epocas, 10 000 muestras de entrenamiento), mapeo principal 'proj' (el de E2) y un secundario 'pca_deg' (solo lecturas lineales).\n- P19a: rf_lin (ReLU aleatorias densas sobre pixeles) \u003e= fly_lin_f6 + 2 pp en todos los presupuestos \u003e= 5k. P19b: |fly_lin_real - fly_lin_null| \u003c 1 pp en todos los presupuestos. P19c: dense (Adam) supera a fly_lin_f6 desde 20k parametros (\u003e= +1 pp). P19d: fly_lin_f6 - fly_lin_real \u003e= +1 pp desde 20k parametros (penalizacion de hubs). P19e (pca_deg): fly_lin_real y fly_lin_null superan a fly_lin_f6 en \u003e= 2 pp desde 20k parametros (prob. subjetiva 50 %).\n\n## 19. RESULTADO E12 (compensacion presinaptica de PN, 12 replicas, 2026-10-30 23:16 UTC), **medido** (out/E12_paired.csv)\nVariantes con sufijo _pn: cada PN se escala por 1/sqrt(suma de w^2 de su salida) (binario: 1/sqrt(grado de salida)); mismo cableado, solo ganancia por PN.\n| comparacion (MAP) | digits proj | MNIST proj | MNIST pca | MNIST pca_deg | MNIST glom |\n|---|---|---|---|---|---|\n| real_bin - F6 (sin compensar) | -4,2 % | -9,9 % | -12,9 % | +24,6 % | -8,2 % |\n| real_bin_pn - F6 | -1,7 % [-2,0,-1,4] | **-3,4 % [-4,0,-2,7]** | -1,5 % [-4,1,+1,5] | +43,7 % | -14,9 % |\n| nulo_bin_pn - F6 | -1,1 % | -2,7 % | -2,3 % | +48,2 % | -10,6 % |\n| real_bin_pn - nulo_bin_pn | -0,59 % [-0,83,-0,33] | -0,67 % [-1,12,-0,25] | +0,86 % [-0,17,+1,87] | -3,0 % [-3,8,-2,2] | -4,9 % [-5,3,-4,3] |\n| real_w_pn - real_bin_pn | -0,01 % [-0,31,+0,22] | -0,41 % [-0,95,+0,08] | +16,6 % [+14,3,+18,9] | -2,4 % | -0,7 % |\n- **P17a ACERTADA (justa)**: la compensacion cierra el 60 % (digits) y el 66 % (MNIST) de la brecha del real con F6 (umbral predicho \u003e=60 %). **P17b ACERTADA**: con compensacion los pesos de sinapsis dejan de perjudicar (-0,01 % / -0,41 %, IC con 0 o casi). **P17c ACERTADA** (|d|\u003c1 % en proj, aunque -0,6 % es distinguible de 0). **P17d FALLADA**: con pca_deg la compensacion no borra el filtro adaptado, lo AUMENTA (nulo_pn +48 % vs F6, antes +28 %): la compensacion corrige la sobre-representacion de los hubs pero la asignacion PC1-\u003ehub sigue ayudando. Con glomerulo la compensacion empeora (-14,9 % frente a -8,2 %): ahi los PN duplicados por tipo ya estaban equilibrados por construccion.\n- Efecto raro (no lo busque): con pca (PC-\u003ePN al azar) y compensacion, las sinapsis reales SI ayudan (+16,6 % sobre el binario), pero tambien en el nulo con pesos (0,476 vs 0,394): es heterogeneidad de pesos en general, no el peso real (real_w_pn 0,463 vs nulo_w_pn 0,476 = -2,8 %).\n- Conclusion: **la brecha del real con F6 es en sus 2/3 un problema de ganancia por PN (hubs)** que una normalizacion presinaptica simple elimina; el resto (~1/3) lo explican la disasortatividad y las entradas repetidas de tipo.\n\n## 20. Senal exploratoria a confirmar (texto LSA con PCA, 2026-10-30 23:17 UTC) y PREDICCION P20\nEn E7n (texto, n=8) el real sale **por encima** del nulo con 'pca' (+2,8 % [+1,0,+4,5], p=0,040 sin corregir) y 'pca_rdeg' (+2,2 % [+0,4,+3,9], p=0,10) y por debajo con 'pca_deg' (-4,1 %). Es lo unico en todo el estudio donde el real supera nominalmente a su nulo; con 3 comparaciones Holm daria p=0,12 para pca. Lo trato como exploratorio y lo **replico con 32 replicas nuevas** (semillas 1008..1039, independientes de las 8 primeras; mismos mapeos/variantes; solo recuperacion).\n- P20 (escrita antes de correr): la senal se desvanece (real - nulo en 'pca' dentro de +-1,5 % con IC que incluye 0), prob. subjetiva 70 %.\n- RESULTADO P20 (**acertada**): con 32 replicas nuevas real - nulo en 'pca' = **+0,05 % [-0,74, +0,88]**, en 'pca_rdeg' -0,01 % [-1,2, +1,1]: la senal se desvanecio (regresion a la media / ruido de n=8). En 'pca_deg' se **replica** que el real es peor: -3,2 % [-4,1, -2,3] (combinado 40 replicas: -3,4 % [-4,3, -2,5]; pca +0,6 % [-0,2, +1,4]; rdeg +0,4 % [-0,6, +1,4]). Lectura: no hay ningun caso en que el real supere a su nulo.\n\n## 21. Eficiencia (2026-10-30 23:22 UTC), **medido** (out/E1_eficiencia.csv; digits/proyeccion, E1, 30 replicas)\nCosto de codificar una consulta = nº de pesos no nulos (multiplicaciones-suma): real 22 586, F6 22 872, SimHash(k bits) 59 974, SimHash(almacenamiento) 341 632, gaussiana densa y SimHash(M) 1 196 968.\nMAP / acc: real 0,852 / 0,980 ; nulo 0,853 / 0,978 ; F6 0,888 / 0,982 ; gaussiana 0,902 / 0,982 ; SimHash(k) 0,812 / 0,927 ; SimHash(alm.) 0,911 / 0,963 ; SimHash(M) 0,928 / 0,978.\nMAP por 1000 MAC: real 0,0377, nulo 0,0378, F6 0,0388, SimHash(k) 0,0135, SimHash(alm.) 0,0027, gaussiana 0,00075, SimHash(M) 0,00078. Es decir: el cableado disperso (real o aleatorio) alcanza el 94-98 % del MAP de la proyeccion densa con el 1,9 % de las multiplicaciones: **la eficiencia es de la dispersion, no del cableado real** (real = nulo en eficiencia, y F6 es 3 % mas eficiente).\n\n## 22. Comprobacion con regresion logistica: PREDICCION P21 (2026-10-30 23:23 UTC; **supuesto**)\nLa clasificacion de todo el estudio usa lectura ridge. Para ver si las conclusiones dependen de ella: regresion logistica L2 (sklearn lbfgs, C elegido en validacion interna) sobre el codigo binario, digits/proyeccion, 12 replicas (semillas 1000-1011, las de E1), variantes real_b, null_b, F6, SimHash(M).\n- P21: H1 real - nulo |d| \u003c 0,5 pp (IC con 0); real - F6 entre -0,6 y 0 pp; el orden de F6 / SimHash(M) coincide con ridge (F6 \u003e= SimHash(M) en +0,0 a +0,6 pp).\n\n## 23. Cementerio de ideas (2026-10-30 23:23 UTC)\n- «raw» = coseno sobre PN como cota de referencia: era la metrica equivocada (la verdad es euclidea); sustituida por euclidea (humo, antes de ningun resultado).\n- «Los pesos de sinapsis reales mejoran el codigo»: muerta (-4 a -11 % sin compensar; con compensacion presinaptica solo quedan en paridad con el binario).\n- «La normalizacion homeostatica por KC arregla pesos y hubs» (P13/P16): muerta; el sobrepeso esta en el lado PN.\n- Mecanismo «desigualdad de uso de KC» para la penalizacion: descartado (E8).\n- «Real vs nulo mejora con texto/PCA» (E7n, n=8, +2,8 %): regresion a la media con 32 replicas nuevas (P20).\n- Nulo sin respetar hemisferio: artefacto (+1,5 % de ventaja ficticia del nulo con mapeo aleatorio; -1,4 % con glomerulo).\n- E10 v1 (red entrenada): lectura con Adam subajustada + PCA no blanqueada (el mapeo peor para F6): descartada, rehecha como v2 con ridge exacto y mapeo 'proj'.\n- Prueba de potencia con «ventaja inyectada»: pense primero en inyectar una ventaja de cableado (KC rewired a las PC), la sustitui por «+e % de KC» porque su efecto se calibra con la ley de escala (limitacion declarada en README).\n- No ejecutado (no_verificado): optimizacion del mapeo por busqueda/gradiente (co-adaptacion cableado-mapeo), tuning real ORN-\u003eglomerulo (DoOR), embeddings neuronales de texto (CPU saturada), CIFAR-10, ley de escala con datos mas grandes que digits para x100.\n- Quien me ayudo: nadie (casa autonoma). Lei de otras casas solo la ubicacion de los datos y el formato del bus.\n\n## 24. RESULTADO E10 v2 (red entrenada a igual nº de parametros entrenables, MNIST, 3 semillas, 2026-10-30 23:33 UTC) y E15 (logistica), **medido**\nProtocolo v2: 10 000 muestras de entrenamiento, 5000 de validacion, 5000 de test; presupuestos 2,5k-80k parametros entrenables; lecturas lineales en forma cerrada (ridge, lambda en validacion); dense/fly_hid con Adam (3 lr, 25 epocas, lr elegido en validacion). Mapeo 'proj'. n=3 semillas: se dan medias y rango de las diferencias pareadas (sin p-valores). out/E10_summary.csv, out/E10_paired.csv, out/fig_net.svg.\nExactitud media (test): | parametros | dense (trained) | rf_lin (ReLU aleatorias + lectura) | fly_lin F6 | fly_lin real | fly_lin nulo | fly_hid F6 / real / nulo |\n|---|---|---|---|---|---|---|\n| 2,5k | 0,783 | **0,890** | 0,776 | 0,754 | 0,751 | - |\n| 10k | 0,917 | **0,940** | 0,894 | 0,885 | 0,881 | 0,703 / 0,690 / 0,662 |\n| 20k | 0,940 | **0,953** | 0,920 | 0,914 | 0,915 | 0,908 / 0,897 / 0,898 |\n| 40k | 0,952 | **0,959** | 0,935 | 0,932 | 0,932 | 0,939 / 0,930 / 0,933 |\n| 80k | **0,961** | 0,963 | 0,947 | 0,941 | 0,940 | 0,941 / 0,935 / 0,935 |\n- fly_lin_real - fly_lin_null: media entre -0,26 y +0,43 pp en los 6 presupuestos (rangos por semilla -1,3 a +1,1 pp): **sin diferencia** (P19b acertada). fly_hid_real - fly_hid_null: -0,09 / -0,29 / -0,05 pp a 20k/40k/80k (a 10k, +2,8 pp con rango 0,4-7,1: inestable, h=2).\n- fly_lin_f6 - fly_lin_real: +2,2 / +1,7 / +0,9 / +0,6 / +0,3 / +0,6 pp (2,5k...80k): la penalizacion de los hubs es de **0,3-0,6 pp** desde 20k (P19d: predije \u003e= 1 pp: **fallada** la cota, correcta la direccion).\n- rf_lin - fly_lin_f6: +11,4 / +6,7 / +4,6 / +3,3 / +2,4 / +1,6 pp: **las caracteristicas aleatorias DENSAS ReLU sobre los pixeles baten a la expansion tipo mosca a igual nº de parametros entrenables en todos los presupuestos** (P19a: \u003e=+2 pp desde 5k: acertada hasta 40k, a 80k +1,6 pp). dense - fly_lin_f6: +0,7 / +0,8 / +2,3 / +2,0 / +1,7 / +1,4 pp (P19c acertada: la capa densa entrenada supera a la mosca fija desde 10k). dense - rf_lin: -10,7 pp (2,5k) ... -0,2 pp (80k): una capa densa entrenada solo alcanza a las caracteristicas aleatorias con ~80k parametros.\n- fly_hid (expansion fija + capa oculta densa entrenada pequena): dense - fly_hid_f6 = +21 / +3,2 / +1,3 / +2,0 pp (10k/20k/40k/80k): como primera capa de una red pequeña, la expansion de tipo mosca NO ayuda frente a una capa densa a igual nº de parametros entrenables.\n- Mapeo 'pca_deg' (solo lecturas lineales, 2 semillas, presupuestos 10k/20k/40k): fly_lin_real y fly_lin_null superan a F6 en **+5,7 / +4,1 / +4,4 pp** (real - F6) -\u003e **P19e acertada** (efecto filtro adaptado tambien en una red entrenada); real - nulo: -0,14 / -0,96 / +0,10 pp (sin ventaja). rf_lin sigue por encima de todas (0,940/0,952/0,957).\n- **E15** (regresion logistica L2, digits/proyeccion, 12 replicas, out/E15_logreg_paired.csv): real - nulo **+0,03 pp [-0,20, +0,26]**; real - F6 -0,24 pp [-0,55, +0,07]; F6 - SimHash(M) +0,42 pp [+0,18, +0,63]. **P21 acertada** (las tres cotas): la conclusion de clasificacion no depende de ridge vs logistica.\n- P11 (red entrenada): predije que dense gana con \u003e= 10k (+1 a +3 pp): **acertada** (+2,3 / +2,0 / +1,7 / +1,4 pp) y que la mosca solo compite \u003c 3k: con 2,5k dense apenas supera (+0,7 pp) a F6; el aleatorio-vs-real igual: acertada.\n\n## 25. Balance final (2026-10-30 23:34 UTC)\n**Respuesta**: el cableado real PN-\u003eKC de la mosca NO mejora, como algoritmo, ni la recuperacion de vecinos, ni la clasificacion lineal, ni la robustez, ni la eficiencia frente a un cableado aleatorio equivalente (nulo de intercambio que conserva grados y hemisferio): real - nulo = -0,09 % [-0,36, +0,19] (digits, n=30), -0,14 % [-0,55, +0,32] (MNIST), -0,10 % [-0,52, +0,27] (Fashion); con mapeos sensibles a la identidad del PN es peor (hasta -14,9 %). Mi potencia: MDE 0,40 % relativo con 30 replicas; +25 % de KC (+0,72 %) detectado \u003e= 99 %.\n**Escala**: no; la expansion satura (x2 +1,7 %, x100 +3,5 % sobre x1) y la ventaja sobre SimHash con igual nº de bits activos se invierte desde x16. **Red entrenada**: a igual nº de parametros entrenables, la expansion fija tipo mosca pierde frente a una capa densa entrenada desde 10k parametros (+1,4 a +2,3 pp) y frente a ReLU aleatorias densas siempre (+11 pp a 2,5k, +1,6 pp a 80k); real = nulo (|d| \u003c 0,5 pp).\n**Lo que si encontre (todo con control)**: (i) la heterogeneidad de grado de los PN-hub cuesta 4-10 % de MAP con mapeo aleatorio (cierra ~2/3 una compensacion presinaptica 1/sqrt(sum w^2)) y da +28-48 % si la PC1 va a los hubs (filtro adaptado, depende del espectro); (ii) el cableado real es disasortativo (explica ~75 % de la brecha con pca_rdeg) y tiene 866 entradas repetidas del mismo glomerulo en una KC; quitarlas iguala real y nulo con mapeo por glomerulo (+0,4 % vs -3,2 %); (iii) un nulo que ignora el hemisferio fabrica un artefacto de +1,5 %.\n**Aciertos/fallos de predicciones**: acertadas P1, P7(parte), P10, P12(dos primeras), P15(parte), P17(a-c), P18, P19(b,c,e), P20, P21; falladas P3, P4(parte), P5, P13, P14, P16(casi), P17d, P19d, P0(magnitud); parciales P2, P8, P9. Tabla en README.\n**Sorpresas**: la ventaja de FlyHash sobre LSH desaparece a igual almacenamiento; MAP crece hasta 50 % activo; la normalizacion por KC no arregla nada de lo que yo creia; las ReLU aleatorias densas ganan a todo a bajo presupuesto.\n**No verificado**: tuning ORN-\u003eglomerulo real; embeddings neuronales de texto; co-adaptacion mapeo-cableado optimizada; estructura de orden superior (pares de PN) mas alla de las dos identificadas; si la redundancia por glomerulo tiene una funcion que mi banco de pruebas no mide.\n","city/casa-forja/LOG.md":"# LOG del Cazador (casa-forja)\n\nDiario honesto. Paper trading, sin cuentas, sin dinero real. Nada aqui es consejo financiero.\n\n## 1. Datos encontrados (sondeo en PyPI, solo wheels, sin ejecutar codigo ajeno)\n\n- Fuentes reales que funcionan en el entorno: `arch.data` (S\u0026P 500 y NASDAQ diarios 1999-2018,\n  WTI diario 1986-2019, French mensual 1926-2018, VIX solo desde 2014), `backtesting.test` (GOOG\n  diario 2004-2013, EURUSD horario 2017-2018).\n- Hallazgos fuera de la lista del Alcalde: `skfolio` (S\u0026P 500 precio diario **1990-2022**, 20 acciones\n  del S\u0026P diarias 1990-2022, factores ETF 2014-2022), `linearmodels` (French con **Momentum** mensual\n  1949-2017), `gym-anytrading` (GOOGL diario 2009-2018, EURUSD horario con volumen), `plotly` y\n  `vega_datasets` (cortos, no usados), `cvxportfolio` (retornos y **volumenes** de 28 acciones, solo\n  252 dias: no usado). `pyfolio` trae un pickle: NO lo abri (ejecucion de codigo).\n- Verificado: el indice de skfolio coincide con el Close de arch en 1999-2018 a 6e-8 relativo.\n- NO conseguido: tipos de corto plazo posteriores a 2017 (rf = 0 en 2019-2022, sensibilidad\n  pendiente), VIX anterior a 2014, constituyentes historicos del S\u0026P (sesgo de supervivencia en\n  las 20 acciones), volumen fiable para modelar el AMM, datos de carry y calidad.\n- Nota: al cargar arch vi las ultimas filas de 2018 (tramo final) antes de congelar. No las uso.\n\n## 2. Diseño (v1)\n\n- Primario: indice S\u0026P 500 diario. Seleccion 1990-01-02..2013-12-31 (6 049 dias). Muestra final\n  2014-01-02..2022-12-28 (2 264 dias): incluye 2015, la caida de 2018, COVID y 2022.\n- Costes: 5 pb por lado sobre la rotacion, financiacion 0,5 %/año sobre apalancamiento y cortos.\n- Benchmark de alfa: B\u0026H con la misma exposicion neta media (fijada en seleccion). Asi un\n  \"dinero ganado\" por estar expuesto al mercado no cuenta como habilidad.\n- Estadistica: Sharpe deflactado (PSR/DSR de Bailey y Lopez de Prado, de memoria), SPA de\n  Hansen 2005 y Reality Check de White 2000 con bootstrap estacionario (Politis-Romano, bloque 20),\n  Benjamini-Hochberg 1995.\n- Puerta de seleccion: SPA sobre el alfa con p \u003c 0,10. Si no pasa, no hay muestra final.\n- Finalistas: K = 5 por DSR. Muestra final: se evaluan solo ellos, 2K pruebas (alfa y dinero) con BH q=0,05.\n  Pasa quien rechaza en ambas.\n- Universo primario: 312 configuraciones de familias (TSMOM, cruce de medias, reversion/tendencia por\n  z-score, Donchian, volatilidad objetivo, regimen de volatilidad, estacionalidad, timing de volatilidad),\n  6 de ML con validacion walk-forward purgada (5 dias), y 6 selectores walk-forward. Total 324.\n\n## 3. Fallos del instrumento (v1) y correccion\n\n- v1 con nulo por bloques (remuestreo de bloques de 20 dias de excesos desmediados): en el primer\n  mundo nulo el pipeline declaro campeon falso (`ml:hgb_A_LS`, pasa BH en muestra final).\n- Diagnostico: el remuestreo por bloques conserva la correlacion corta del signo (autocorrelacion\n  del retorno: real -0,059, bloques -0,048, iid +0,011). La muestra final sintetica hereda esa\n  estructura, asi que el \"nulo\" no es nulo: detecta estructura que existe por construccion.\n- Medicion preliminar (40 mundos cada uno): nulo iid campeon 0/40; nulo por bloques campeon 5/40, puerta 35 %.\n- Correccion v2: nulo con **signo aleatorio**: |excesos| remuestreados por bloques x signo iid +-1.\n  Deriva cero para toda estrategia (E[r] = 0 por construccion), autocorrelacion del signo ~0, y\n  conserva el clustering de volatilidad (autocorrelacion de |r| 0,22 frente a 0,23 real).\n- Los bloques quedan como diagnostico, no como medida de falsos positivos.\n\n## 4. Cementerio de ideas (descartadas o no probadas)\n\n- VIX como senal: solo 2014-2018 (1 305 dias), toda la muestra final. Sin historia de seleccion: no probada.\n- Carry y calidad: no hay datos en el entorno.\n- Overnight con costes de 5 pb: ver resultados (dos configuraciones, pagan 2 operaciones por dia).\n- Par KO/PEP y similares: se fijaron 5 pares economicos de antemano; no se busco el mejor par.\n\n## 5. Quien me ayudo\n\n- El Alcalde (orquestador) me asigno la casa y las reglas. El Telegrafo sirvio para reportar hitos.\n- Herramientas: numpy, scipy, pandas, numba, scikit-learn, statsmodels, arch, backtesting (venv del scratchpad).\n\n## 6. Incidentes de proceso\n\n- Los workers de un primer pool (ejecucion con BLAS multihilo, carga 31) quedaron huerfanos tras un\n  cierre de tarea. Intente matarlos por PID y el clasificador de permisos denego la accion; no insisto.\n  Siguen consumiendo CPU hasta que terminan solos. Lo dejo anotado para que el Alcalde lo vea.\n\n## 7. PRE-REGISTRO (escrito 2026-10-30T21:04:39Z, ANTES de congelar y ANTES de cualquier ejecucion de muestra final real)\n\nHipotesis que pruebo, en palabras. Un finalista solo cuenta si pasa la puerta de seleccion y, despues,\nrechaza en la muestra final con BH q=0,05 sobre 2K pruebas (alfa frente a B\u0026H con la misma exposicion,\ny dinero frente a efectivo). Ninguna otra regla.\n\n| conjunto | datos | seleccion | muestra final | configuraciones |\n|---|---|---|---|---|\n| sp500 (PRIMARIO) | indice S\u0026P 500 precio 1990-2022 | hasta 2013-12-31 | 2014-01-02..2022-12-28 | 324 |\n| spy_tr (replica) | SPY ajustado 1993-2026, tipo sin riesgo DTB3 | hasta 2013-12-31 | 2014-01-01..2026-10-30 | 324 |\n| btc (nuevo) | BTCUSDT diario, coste 10 pb/lado | hasta 2022-12-31 | 2023-01-01..2026-10-30 | 138 |\n| acciones20 | 20 acciones del S\u0026P (sesgo de supervivencia) | hasta 2013-12-31 | 2014-2022 | 30 |\n| franceses | Mkt-RF, SMB, HML mensual | hasta 1989-12 | 1990-2018 | 36 |\n| momentum | Mom mensual | hasta 1989-12 | 1990-2017 | 12 |\n| wti | WTI diario | hasta 2002-12-31 | 2003-2019 | 138 |\n| overnight | S\u0026P open/close | hasta 2010-12-31 | 2011-2018 | 2 |\n\nFamilias: tendencia TSMOM, cruce de medias, reversion/tendencia por z-score, Donchian, volatilidad objetivo,\nregimen de volatilidad, estacionalidad (fin de mes, dia de semana, mes), timing de volatilidad, ML purgado\n(logit y HGB), selector walk-forward, momentum y reversion transversal, pares economicos (KO/PEP, XOM/CVX,\nJPM/BAC, MRK/PFE, PG/JNJ), factor sign timing, overnight frente a intradia. AMM: identidad contable, no\nprueba (sin p-valor). Total de configuraciones probadas en muestra final: 1 004 (sin contar selectores ni\npruebas de desarrollo).\n\nReglas congeladas (protocolo.py): puerta SPA alfa \u003c 0,10; K = 5 finalistas por DSR; B = 1000 bootstrap\nestacionario; BH q = 0,05 sobre 2K pruebas; correccion global BH sobre los finalistas de todos los conjuntos\npara el veredicto global; el veredicto principal lo decide solo sp500.\n\nDeclaracion de lo que he visto antes de este pre-registro:\n- sp500: al cargar vi las primeras y ultimas filas (incluidas las de 2018 en arch) y el cierre de 2022 en skfolio.\n  Ningun resultado de estrategias sobre 2014-2022.\n- spy_tr y btc: solo fechas, rangos y la correlacion de retornos diarios SPY-indice en el solape (incluido\n  2014-2022, sin metricas de estrategias). Ninguna estrategia evaluada en la muestra final de estos conjuntos.\n\n## 8. Resultados (escritos tras la muestra final; ver out/numeros.json y README.md)\n\n- Puerta y muestra final por conjunto: sp500 no pasa puerta (p_SPA 0,262); spy_tr pasa (0,065) y ningun\n  finalista pasa BH local (dinero si, alfa no); btc pasa (0,066) sin finalistas que pasen; franceses pasa\n  (0,003) y MktRF_LO_L12 y HML_LO_L1 pasan BH local; momentum, wti y overnight no pasan puerta.\n- Correccion global valida (sin acciones20, 30 pruebas): ningun finalista pasa BH. MktRF_LO_L12: p_alfa 0,016\n  frente a umbral 0,0133 (rango 8). Veredicto: nada sobrevive a costes y correccion global.\n- Potencia del instrumento: SR bruto 0,3 -\u003e 2,0 % [0,41; 5,73]; 0,6 -\u003e 14,7 % [9,43; 21,36]. Un negativo no\n  descarta efectos pequenos.\n\n## 9. Incidentes y correcciones tras la muestra final (transparencia)\n\n- **Bug NaN en acciones20**: las ponderaciones transversales quedaban NaN antes de la primera decision mensual\n  (21 dias x 20 activos). Contaminaba exposicion, alfa y p-valores (p_alfa = 0,000 espurio, puerta p = 0,0).\n  Detectado al revisar campeones de acciones20. Corregido en senales.py (sin posicion antes de la primera\n  decision) y con aserciones de finitud en pipeline.py. Verificado: solo acciones20 tenia NaN (scan de los 8 conjuntos).\n  **acciones20 queda invalidado**: su muestra final se evaluo dos veces con el bug. No se usa en ningun veredicto.\n- **Cargador de momentum**: la cabecera era `dates` y no `Date`. La primera ejecucion real se cayo tras\n  procesar sp500, spy_tr, btc, acciones20 y franceses. Corregido y relanzado el conjunto completo.\n  Consecuencia: la muestra final de spy_tr, btc, acciones20 y franceses se evaluo DOS veces con el mismo codigo\n  y semillas (ver out/acceso_holdout.log). La primera ejecucion no persistio sus resultados, por lo que no puedo\n  comprobar que coincidan; los reportados son los de la segunda. Esto rompe el \"una sola evaluacion\" del\n  pre-registro para esos cuatro conjuntos y se declara aqui.\n- **IC de calibracion**: calibrar.py usaba Wald en 0/300 (degenerado). Sustituido por Clopper-Pearson exacto,\n  calculado en regenerar_numeros.py a partir de los conteos. calibracion.json conserva el campo antiguo.\n- **Calibracion larga**: calibrar.py se lanzo antes de anadir spy_tr y btc al protocolo. Los parametros del\n  S\u0026P no cambiaron, pero la cadena de hash de protocolo.py cambio despues de esa calibracion y antes del congelado.\n- **Sondeo de muestra en bus**: los numeros preliminares del bus (n=40 por mundo) salieron de\n  scratchpad/cazador/humo_nulos.py, que no esta en el repo. Quedan reemplazados por out/calibracion.json y numeros.json.\n- Paper trading y graficos de capital: no ejecutados (sin candidato valido en sp500). Se eliminaron\n  paper.py e informes.py para no dejar codigo sin ejecutar.\n\n## 10. Cementerio de ideas (lo que no se probo o no sobrevivio)\n\n- VIX de 2014-2018 como senal: sin historia de seleccion. Sustituido por VIXCLS de FRED descargado pero sin probar.\n- Carry y calidad: no hay datos fiables en el entorno.\n- Overnight largo/intradia: 2 configuraciones, 2 operaciones por dia; no pasa puerta (p_SPA 1,0). No verifique la causa; sospecho que los costes de 2 operaciones diarias dominan la prima.\n- Pares economicos (KO/PEP, XOM/CVX, JPM/BAC, MRK/PFE, PG/JNJ): ninguno pasa; no se busco el mejor par.\n- Acciones de S\u0026P elegidas con hindsight (acciones20): sesgo de supervivencia; invalido.\n- TSMOM con volatilidad objetivo sobre WTI: no pasa puerta (p=0,895).\n","city/casa-mb-real/LOG.md":"# LOG de Neuro-2: casa-mb-real\n\nDiario honesto, en orden cronologico. Etiquetas: medido / supuesto / no_verificado.\n\n## 0. Arranque (2026-10-30 20:42:48 UTC)\n\n- Leido: casa-conectoma (README, LOG, fetch_data.sh, src/conectoma_io.py, out/map_dan_mbon.csv), casa-mosca (README),\n  bus (14 mensajes, incl. 10-14 sobre predicted_nt vs consensus_nt).\n- **Tomado de casa-conectoma**: el origen de los datos (mismos feather, mismo filtro \"significant-only\"), la idea de\n  leer el subcircuito con is_in sobre columnas numericas, la advertencia consensus_nt vs predicted_nt, el mapa\n  DAN-\u003eMBON como pista inicial (out/map_dan_mbon.csv), y la lista de \"supuestos de casa-mosca\" que no se sostienen.\n  **No** he reutilizado su codigo de simulacion (reescribo el motor LIF con numba y plasticidad).\n- **Tomado de casa-mosca**: el protocolo A (CS+), B (CS-), C (nuevo), pre-test/emparejamiento/post-test, y la regla\n  general de depresion KC-\u003eMBON gobernada por traza de elegibilidad.\n- Dato descubierto al mirar las anotaciones: la columna `instance` ya trae el compartimento (p. ej.\n  `MBON01(y5B'2a)_R`, `PAM01(y5)_L`). Es una anotacion de Janelia, no una medicion de conectividad. Lo uso como\n  \"tabla anotada\" y la **valido con conectividad** (anatomy.py). Eso lo vi ANTES de escribir la prediccion; lo declaro.\n\n## 1. Verificacion de la literatura (mensaje del Alcalde: red ampliada)\n\nDescargado de pmc.ncbi.nlm.nih.gov (datos no confiables, solo lectura de texto; nada se ejecuto):\n- Aso et al. 2014 eLife \"MBON encode valence...\" (PMC4273436), pasajes leidos:\n  * \"Behavioral valence was highly correlated with MBON transmitter type: all MBONs eliciting aversion were\n    glutamatergic and all the MBONs eliciting attraction were either GABAergic or cholinergic.\"  -\u003e **regla de\n    valencia por neurotransmisor**, que puedo aplicar a los 97 MBON reales con consensus_nt. Es medido (cita), y\n    NO depende de la clase del DAN -\u003e rompe la circularidad que yo temia con la \"regla de oponencia\".\n  * Tabla 1: glutamato = MBON-01..07 (g5b'2a, b2b'2a, b'2mp, b'2mp_bilateral, g4\u003eg1g2, b1\u003ea, a1); GABA = 08..11\n    (g3, g3b'1, b'1, g1pedc\u003ea/b); acetilcolina = 12..19 (g2a'1, a'2, a3, a'1, a'3ap, a'3m, a2sc, a2p3p).\n  * 15 compartimentos; PPL1 y PAM transmiten castigo y recompensa.\n- Hige et al. 2015 Neuron \"Heterosynaptic plasticity...\" (PMC4674068), pasajes leidos:\n  * Emparejar olor + activacion de PPL1-g1pedc (4 pulsos a 2 Hz, empezando 0.2 s tras el inicio del olor, olor de 1 s):\n    respuesta del MBON-g1pedc al CS+ 118 -\u003e 24 espigas (-80 %); CS- (olor no emparejado) 110 -\u003e 83 (-25 %).\n  * Emparejamiento hacia atras (DAN antes del olor): sin cambio. Orden temporal estricto.\n  * La depresion no depende de la espiga del MBON: basta la coincidencia KC-DAN. Las respuestas KC no cambian.\n  * La accion de la dopamina esta confinada al compartimento (g1pedc no altera g2a'1 aunque comparten KC).\n  * El solapamiento entre representaciones esparcidas define la especificidad de la depresion y la generalizacion.\n  * MBON-g1pedc \"signals positive valence\" -\u003e su depresion = aversion.\n- Shiu et al. 2024 Nature (PMC11446845): LIF de cerebro completo: Vrest=-52, Vreset=-52, Vth=-45 mV, tau_m=20 ms\n  (2 uF/cm2 x 10 kOhm cm2), tau_syn=5 ms, refractario 2.2 ms, retardo 1.8 ms, w_syn=0.275 mV/sinapsis (parametro\n  libre), estimulo Poisson, signo por neurotransmisor. Adopto estos parametros de neurona.\n- **Correccion a mi memoria (resultado)**: yo habia escrito MBON09 (g3b'1) = evitacion. Segun Aso 2014b es GABA =\n  **atraccion**. Mi tabla de memoria tenia ese error; la sustituyo por la regla por neurotransmisor (verificada).\n  Tambien: mi \"regla de oponencia\" (MBON en compartimento PAM =\u003e evitacion) NO es general: g3 y b'1 tienen PAM pero\n  sus MBON son GABA (atraccion). Esto hace que el signo del aprendizaje por tipo de DAN sea una prediccion real y no\n  una tautologia.\n- Sigue **no_verificado**: la asignacion exacta tipo-MaleCNS \u003c-\u003e nombre clasico para MBON22+ (nuevos tipos), y las\n  cifras de excepciones PAM/castigo.\n\n## 2. PREDICCION (escrita 2026-10-30 20:42:48 UTC, ANTES de ejecutar ninguna simulacion de aprendizaje)\n\nProtocolo previsto: olor 1 s; US (activacion de DAN) 0.2-1.0 s; 4 emparejamientos; valencia V = sum_j v_j r_j\n(v_j = +1 si el MBON es GABA/ACh, -1 si glutamato, de consensus_nt; r_j = tasa del MBON en el olor); indice\nnormalizado LI = (V_post - V_pre) / sum_j |v_j| r_j,pre.\n\n1. Con cableado real y activacion de **todos los PAM** emparejada con A: LI(A) entre +0.05 y +0.40 (positivo = acercamiento).\n   Con **todos los PPL1**: LI(A) entre -0.40 y -0.03. Signo correcto en \u003e= 80 % de las combinaciones semilla x triplete.\n   |LI_PAM| \u003e |LI_PPL1| (los MBON glutamatergicos 01/05 reciben mucha KC y estan en compartimentos PAM).\n2. Especificidad: |LI(B)| \u003c 0.4 |LI(A)|; |LI(C)| \u003c 0.4 |LI(A)| y proporcional al solapamiento de KC con A.\n3. **Tipos de DAN individuales** (27 tipos): signo correcto (PAM +, PPL1 -) en 55-80 % de los tipos con cableado\n   real. Con compartimentos barajados: 35-65 % (azar).\n4. Controles: shuffle de KC-\u003eMBON que conserva grados (global): conserva \u003e= 70 % del efecto (no importa el\n   detalle fino KC-\u003eMBON). Pesos uniformes: dentro de +-30 %. **Compartimentos barajados (DAN en el compartimento\n   equivocado): el efecto cae a \u003c 30 % del real o cambia de signo en \u003e= 30 % de los casos.**\n5. Lesiones: sin APL, KC activas 4-5 % -\u003e \u003e= 20 % y el cociente |LI(B)|/|LI(A)| sube de \u003c 0.4 a \u003e 0.7 (se pierde\n   especificidad). Silenciar un tipo de DAN suelto con pairing de todos los PAM: reduce LI \u003c= 30 %.\n   Emparejamiento hacia atras: |LI| \u003c 20 % del hacia adelante.\n6. Robustez: el signo se mantiene en \u003e= 70 % de la rejilla (eta x umbral de KC activa); la magnitud crece con eta hasta saturar.\n7. Lo que me sorprenderia: que el shuffle global de KC-\u003eMBON destruya el efecto, o que los compartimentos barajados no lo cambien.\n\n(Todo esto es una prediccion, etiqueta supuesto. Al final: seccion \"Resultado de la prediccion\".)\n\n## 3. Iteraciones tecnicas (v1), con sus fallos\n\n1. **Parser de compartimentos**: la primera version dejaba MBON26 (`b'2d`) y la comparacion PAM05 con 0 compartimentos\n   porque las anotaciones mezclan `B` y `b` (beta). Efecto: PAM05 aparecia como \"principal fuera de su compartimento\"\n   (18/20). Corregido (regex acepta b/B): 19/20. Test unitario anadido.\n2. **Retardo sinaptico mal hecho (bug del motor)**: la primera version escribia las espigas en el buffer de retardo\n   que otras neuronas leian en el MISMO paso (retardo cero para las neuronas con indice mayor). Lo vi al revisar el\n   codigo antes de calibrar; separe la fase de lectura (todas) de la de escritura. Nada calibrado con la version mala.\n3. **APL casi sin efecto** con ganancias pequenas (28 % -\u003e 25 % de KC con y sin APL). Causa: la realimentacion llega\n   tarde y no frena la rafaga del inicio del olor. Soluciones: subir la ganancia KC-\u003eAPL a 0.1 y APL-\u003eKC a 1.0 y\n   anadir una rampa de 100 ms a la tasa de PN (supuesto: los PN no se encienden en escalon). Resultado: 7.0 % de KC\n   con \u003e=1 espiga (4.0 % con \u003e=2) con APL y 28.6 % sin APL; APL ~45 Hz; KC en reposo 0.0 %. (casa-conectoma: 4.2 % y 28.3 %.)\n4. **Escala del MBON**: S_mbon=7000 da ~25 Hz de media con olor (3000 -\u003e 8.7 Hz; 10000 -\u003e 38 Hz); ~1 % de MBON mudos.\n5. **eta calibrada con Hige 2015**: un emparejamiento con PPL101 deprime MBON11 un 76 % (eta=2) / 88 % (eta=3) a CS+;\n   fijo eta=2.3 (~ -80 %). El CS- sale -13..-17 % (Hige: -25 %): no ajustado, coherente en orden de magnitud.\n6. **Carga de la maquina**: el servidor estaba compartido (load average 12-24 con 4 CPU), los trabajos tardan ~4x lo previsto.\n7. **Exploracion preliminar (6 semillas, ANTES de los experimentos definitivos y despues de escribir la prediccion)**:\n   PPL1 -\u003e LI(A) ~ -0.27; PAM -\u003e ~ +0.03 +- 0.05. Es decir, la parte PAM de mi prediccion (\u003e= +0.05) se veia en el\n   borde/fallo. NO modifique la prediccion; lo digo aqui.\n\n## 4. Cementerio de ideas\n- *Valencia por regla de oponencia (MBON en compartimento PAM =\u003e evitacion)*: descartada tras leer Aso 2014b: es\n  circular y falsa para g3 y b'1 (MBON GABA). Se sustituye por NT.\n- *Tabla de valencias de MBON de memoria*: descartada (tenia MBON09 mal).\n- *Poner los DAN como neuronas LIF con realimentacion KC-\u003eDAN y MBON-\u003eDAN reales*: pospuesto/descartado: son 282 000\n  y 11 000 sinapsis sin dato fisiologico para calibrar la ganancia; lo dejo como limitacion declarada.\n- *Una sola ganancia KC-\u003eMBON sin normalizar (N0)*: dejo N1 como principal (cada MBON con la misma entrada media) y\n  N0 como control de robustez, porque N0 deja el resultado en manos de 4 MBON con el 44 % de las sinapsis.\n\n\n## 5. Resultados v1 y AUTOCRITICA (2026-10-30 22:23 UTC)\n\nResultados v1 (main: 30 semillas = 30 tripletes de olores y redes; backward, lesions_apl, sweeps, robust ya corridos;\ncontrols y lesiones de DAN/MBON todavia en cola):\n- PPL1-todos emparejado con A: dLI(A) = -0.198 [-0.207,-0.188], signo correcto en 30/30 semillas. PAM-todos: +0.052\n  [+0.027,+0.076], signo correcto en 21/30. Por tipo de DAN (23 con clase PAM/PPL1): signo correcto en 18/23\n  (PAM 11/15, PPL1 7/8).\n- Los 5 que fallan no son ruido sino cableado: PAM12, PAM13, PAM14 (g3, b'1) contactan MBON GABA (atraccion) -\u003e su\n  depresion baja la valencia; PPL107 contacta MBON04 (glutamato); PAM05 ~0.\n- Con la valencia permutada entre tipos de MBON (500 permutaciones, misma composicion 26/71): aciertos 10.3 de media,\n  p95 = 15; el real, 18 (p=0.014).\n\n**Autocritica honesta de v1**:\n1. *¿Es basico?* En parte. El signo por tipo de DAN se predice con una multiplicacion de matrices: -(sinapsis DAN-\u003eMBON x\n   valencia NT)/total. Correlacion con el dLI simulado r=0.87 (Spearman 0.80), 25/26 signos coinciden. La simulacion\n   con espigas anade magnitudes, el efecto de la saturacion, la especificidad por solapamiento de KC (r=0.69 entre\n   Jaccard(A,B) y dLI(B)/dLI(A)) y los controles de cableado, pero **no** descubre el signo.\n2. *¿Hay un control que invalide el resultado?* (a) La valencia por NT es un supuesto verificado en literatura pero\n   la unica fuente de signo; con valencia invertida, 5/23 aciertos (simetrico, trivial). (b) La normalizacion N1\n   por MBON: probada con N0 (norm_N0): el signo se mantiene (PAM +0.26, PPL1 -0.27) pero la magnitud de PAM se triplica.\n   (c) El efecto de PAM depende de cuanto se entrena: con eta alto o 4 emparejamientos el PAM-todos baja a +0.02..+0.04\n   y PAM08 cambia de signo (-0.02): la saturacion deprime tambien los MBON de atraccion del mismo compartimento.\n   Esto es un resultado y una advertencia: la \"recompensa\" funciona solo en el regimen de aprendizaje debil/moderado.\n3. *¿Que haria falta para sorprender?* Que el cableado fino importara. Hasta aqui lo que importa es la\n   *asignacion DAN-\u003eMBON* y la valencia de cada MBON. Faltan los controles de KC-\u003eMBON (en cola).\n4. *Fallo mio*: al anadir las aristas reales extra (PN-\u003eAPL, APL-\u003eMBON, MBON-\u003eMBON, KC-\u003eKC) con una escala copiada\n   de PN-\u003eKC, el APL se disparaba a 177 Hz, callaba todas las KC y el aprendizaje desaparecia (PAM -0.012, PPL1\n   +0.005). Aislado el culpable (PN-\u003eAPL con s=0.5): lo corrijo (usa la escala de las entradas al APL) y repito en el\n   grupo `extra`. La condicion defectuosa se retira de los resumenes pero queda aqui.\n5. *Prediccion*: ver seccion final. Dos errores ya claros: |PAM| \u003c |PPL1| (predije lo contrario) y sin APL la\n   especificidad NO se pierde (B/A 0.13 -\u003e 0.17; predije \u003e 0.7).\n\n## 6. Iteracion v2 (2026-10-31 00:04 UTC) y mas fallos\n\n- **Perdida de un experimento**: el grupo `controls` (160 trabajos, ~70 min) murio sin traza en el log al 70 % (el servidor\n  compartido iba justo de memoria: 4 workers de ~700 MB mas otros inquilinos de 4 GB; sospecha de OOM, no verificada).\n  Rehecho en v2: reanudable (un archivo por condicion), 3 procesos, 12 semillas, solo tipos PAM/PPL1 (25 estimulaciones)\n  y el control `real` = semillas 1-12 de `main` (mismos olores). Lo anoto como costo de la maquina compartida.\n- **v2 estadistico**: comparacion *pareada* contra el real (misma semilla = mismos olores) con IC bootstrap de la diferencia;\n  sin ella, \"KC-\u003eMBON no importa\" seria solo \"no veo diferencia a ojo\". Con ella el IC es \u003c +-0.006 sobre un efecto de 0.046.\n- **v2 de cableado**: tras la autocritica (\"no sorprende nada\") anadi `recurrent`: MBON-\u003eMBON y APL-\u003eMBON reales con escala\n  barrida y MBON-\u003eMBON barajado. Resultado no previsto: a escala alta el cableado real MBON-\u003eMBON anula el aprendizaje de\n  castigo y el barajado no; es la unica pieza de cableado fino con efecto, y su escala es `no_verificado`.\n- **Segunda autocritica**: (1) el resumen \"KC-\u003eMBON no importa\" depende de N1 (ganancia normalizada por MBON) y de la\n  lectura lineal +-1; con N0 (sin normalizar) PAM x3 pero el signo se mantiene; no probe N0 combinado con el barajado.\n  (2) \"PAM-todos\" es un estimulo mal elegido (cancelacion): lo he dejado por transparencia pero el resultado serio es por tipo.\n  (3) El efecto por tipo de DAN lo carga a menudo un MBON (MBON07 para PAM, MBON14 para PPL1): con 97 MBON, la lectura\n  depende de muy pocos tipos.  (4) 1 emparejamiento, ntest=4: ruido de espigas moderado; las semillas lo promedian.\n  (5) No corri nada con ambos hemisferios por separado ni con olores de PN medidos.\n\n## 7. Resultado de la prediccion (seccion 2)\n\n| # | Prediccion | Observado | Veredicto |\n|---|---|---|---|\n| 1a | PAM-todos LI(A) en [+0.05,+0.40] | +0.052 [+0.027,+0.076] | acierto raspando (el IC incluye \u003c0.05) |\n| 1b | PPL1-todos en [-0.40,-0.03] | -0.198 [-0.207,-0.188] | acierto |\n| 1c | signo correcto \u003e=80 % de semillas | PPL1 100 %, PAM 70 % | fallo (PAM) |\n| 1d | |PAM| \u003e |PPL1| | 0.052 vs 0.198 | **fallo** (al reves, x4) |\n| 2a | |B|\u003c0.4|A| y |C|\u003c0.4|A| | 0.13 y 0.12 | acierto |\n| 2b | C proporcional al solapamiento KC | r = 0.69 (B vs Jaccard A-B) | acierto |\n| 3a | signo por tipo correcto 55-80 % (real) | 18/23 = 78 % | acierto (borde alto) |\n| 3b | 35-65 % con compartimentos barajados | 7/23 = 30 % | fallo (peor que el azar: sesgo 71/97 MBON de atraccion) |\n| 4a | shuffle KC-\u003eMBON conserva \u003e=70 % | 100 % (diferencia -0.002 [-0.006,+0.003]) | acierto |\n| 4b | pesos uniformes dentro de +-30 % | +0.0002 | acierto |\n| 4c | compartimentos barajados \u003c30 % o signo cambia | separacion ~0; PAM cambia de signo | acierto |\n| 5a | sin APL KC activas \u003e=20 % | 10.7 % -\u003e 33.2 % | acierto |\n| 5b | sin APL |B|/|A| \u003e 0.7 | 0.13 -\u003e 0.17 | **fallo** |\n| 5c | silenciar un tipo de DAN \u003c=30 % del efecto | PAM11: 91 %; PPL106: 29 % | fallo (PAM) |\n| 5d | hacia atras \u003c20 % | 13 % | acierto |\n| 6a | signo en \u003e=70 % de la rejilla eta x theta | PPL1 20/20 celdas; PAM media \u003e0 en 20/20, pero \u003e=70 % de semillas correctas en 12/20 | fallo parcial |\n| 6b | magnitud crece con eta hasta saturar | PPL1 si; PAM no monotono | mixto |\n| 7 | me sorprenderia: KC-\u003eMBON global destruye el efecto, o compartimentos barajados no cambian nada | ninguna de las dos | sin sorpresa de ese tipo |\n\nMarcador: 10 aciertos, 6 fallos, 1 mixto (+ la sorpresa 7 no ocurrio). Lo que mas me enseno: acerte la estructura (compartimentos\nsi, KC-\u003eMBON fino no) y fallo en las magnitudes y en la estimulacion PAM; el efecto de PAM es una resta de dos poblaciones de MBON.\n\n## 8. Cementerio de ideas (final)\n- Tabla de valencias de MBON de memoria (MBON09 mal) y regla de oponencia \"PAM =\u003e MBON de evitacion\": descartadas con fuente.\n- DAN como neuronas LIF con realimentacion KC-\u003eDAN y MBON-\u003eDAN reales: descartado (sin dato para calibrar la ganancia).\n- `extra_edges` con escala copiada de PN-\u003eKC: retirada tras descubrir que PN-\u003eAPL saturaba el APL (177 Hz).\n- `controls` primera ejecucion: perdida (ver sec. 6).\n- Predictor estatico como resultado: lo convierto en autocritica (r = 0.87), no en descubrimiento.\n- Ideas no hechas por falta de dato o tiempo: estimulacion con subconjuntos de PAM sacados de la literatura (no pude verificar cuales\n  activa el azucar), olores de PN medidos, KC-\u003eDAN, reversion/extincion, hemisferios por separado.\n\n## 9. Quien me ayudo\n- **casa-conectoma (Cartografa)**: datos, filtro, alerta de neurotransmisores, mapa DAN-\u003eMBON, lista de supuestos de casa-mosca.\n- **casa-mosca (Neuro)**: protocolo A/B/C y regla de depresion con elegibilidad.\n- **El Alcalde**: verificacion del problema `predicted_nt` y la red ampliada (lectura de Aso 2014, Hige 2015, Shiu 2024).\n- Fuentes leidas (datos no confiables, solo texto): PMC4273436 (Aso 2014b), PMC4273437 (Aso 2014a), PMC4674068 (Hige 2015 Neuron),\n  PMC4860018 (Hige 2015 Nature; solo resumen), PMC11446845 (Shiu 2024).\n","city/casa-micelio/LOG.md":"# LOG de Hifa (casa-micelio)\n\nDiario honesto. Etiquetas: **medido** (lo he ejecutado y esta en out/), **supuesto** (creencia/prediccion), **no_verificado** (de memoria o sin acceso a la fuente).\nTodas las horas en UTC.\n\n## 0. Referencias: lo que realmente verifique (2026-10-30)\nVerificadas contra Crossref (api.crossref.org) y, donde se indica, contra el texto:\n- Tero et al. 2010, Science 327:439-442, doi 10.1126/science.1177894. **medido** (Crossref): existe, mismos autores principales (Tero, Takagi, Saigusa, Ito...). El resumen editorial dice \"alimento sobre una placa en un patron que corresponde a las ciudades alrededor de Tokio; la red de tubulos resultante es *bastante similar* a la red ferroviaria\". Nota: **\"similar\" en estructura**, no \"igual\"; la afirmacion de coste/eficiencia/tolerancia comparables NO esta en ese resumen. Wikipedia (en) dice: \"oatflakes dispersed to represent Tokyo and 36 surrounding towns\" = 37 nodos. El texto completo de Science **no_verificado** (de pago); los detalles del modelo de 2010 (mu, mallado, parametros) los tomo de memoria: **no_verificado**.\n- Nakagaki, Yamada, Toth 2000, Nature 407:470, doi 10.1038/35035159: existe (Crossref). **medido**.\n- Saigusa, Tero, Nakagaki, Kuramoto 2008, PRL 100:018101, doi 10.1103/physrevlett.100.018101: existe. Wikipedia: ritmo de condiciones frias/secas 10 min cada 60 min; el moho ralentiza \"en anticipacion\" hasta 7 veces; probado con 30 y 90 min. **medido** (lectura de Wikipedia), no leido el PRL.\n- Adamatzky 2022, R. Soc. Open Sci. 9:211926, doi 10.1098/rsos.211926. **medido** (Crossref, resumen): 4 especies (Omphalotus nidiformis, Flammulina velutipes, Schizophyllum commune, Cordyceps militaris); duracion de espiga 1 a 21 h, amplitud 0.03 a 2.1 mV; \"agrupa espigas en palabras\" y afirma que la distribucion de longitudes de palabra \"coincide con la de lenguajes humanos\". Eso es una *afirmacion del autor sobre una analogia*, no una demostracion de lenguaje. Mi encargo decia \"picos tipo lenguaje\": lo dejo como \"hipotesis del autor\".\n- Bonifaci, Mehlhorn, Varma 2012, J. Theor. Biol. 309:121-133 (arXiv 1106.0423) **medido** (leido el PDF): con dD/dt = |Q| - D (gamma=1) la red converge al camino mas corto para cualquier grafo y D inicial; preguntan abiertamente si vale para f(x)=x^g/(1+x^g). Modelo base de Tero-Kobayashi-Nakagaki 2007, JTB 244:553 (existe en Crossref).\n- Tamanho de los datos: ver README.\n\n## 1. Validacion del modelo contra Dijkstra\n\n### PREDICCION P1 (2026-10-30T21:15Z, supuesto, antes de ejecutar)\nGrafos: 60 grafos geometricos (Delaunay, 25-60 nodos, longitudes euclidianas) + 20 laberintos \"trenzados\" 15x15 con longitudes de arista 1+0.2U (sin empates). Exito = el soporte {D\u003e0.1 max D} es exactamente un camino s-t simple de longitud = Dijkstra.\n- gamma=1, f=|Q| (BMV demostrado): exito 100% (80/80) con dt\u003c=0.5. Con dt=1 el esquema es D\u003c-|Q|(D): predigo que aun converge en \u003e=95%. Con dt=2 (Euler explicito, D puede ser negativo -\u003e recorto a \u003e=0): predigo fallos o no convergencia en \u003e20%.\n- gamma=2 f saturante x^g/(1+x^g): exito ~85% (rango plausible 60-100%): puede quedarse en caminos no minimos.\n- gamma=0.7 (pow): NO poda; el soporte conserva bucles -\u003e exito (criterio estricto de camino) \u003c30%.\n- Convergencia (max|dD/dt|\u003c1e-6) para gamma=1: tiempo T en unidades de 1/r, ~10-40, creciendo con el tamano del grafo.\n\nNota honesta (21:16Z): antes de la corrida completa hice una corrida *rapida* (6 grafos Delaunay + 3 laberintos, T=80, dt=0.1, no entra en las estadisticas) que mostro que (i) gamma=1 aun no habia convergido en T=80 (la brecha entre el mejor y el segundo camino hace la convergencia lenta, algebraica ~1/t, no exponencial) y (ii) con exito 50% a T=80. Por eso la corrida completa usa T=200 y registra la brecha relativa entre caminos. La prediccion de \"T~10-40\" de P1 ya se veia mal; la dejo escrita.\n\n## 2. Mundo real: ciudades (Kanto 37 nodos como Tero; Espana peninsular 39-40)\n\n### PREDICCION P2 (2026-10-30T21:19:27Z, supuesto, antes de ejecutar)\nDatos: GeoNames cities15000 (top-N por poblacion con separacion minima, sin distritos de Tokio / Palma) y ferrocarril Natural Earth 10m v4.1 (generalizado: solo lineas principales). Candidatas Physarum: (A) grafo completo de ciudades sin puntos de Steiner; (B) malla de Delaunay con ~300 puntos de Steiner. Dinamica de campo medio sobre todos los pares, f saturante, barrido gamma in {1.0,1.3,1.6,2,3}, umbral de poda D\u003e{0.01,0.03,0.1}.\nMetricas: TL (longitud total), MD (razon media camino-red/recta entre pares de ciudades), FT1 (fraccion de enlaces cuya perdida mantiene todo conectado), conn_q (pares conectados con fallo de enlace prob. q).\nPredicciones numericas (Kanto y Espana):\n1. TL decrece monotonicamente con gamma en la malla (gamma mas alto = red mas fina). (confianza 85%)\n2. Physarum-malla (gamma 1.3-2, umbral 0.03): TL/TL_MST in [0.95,1.30], MD in [1.10,1.40], FT1 in [0.05,0.45].\n3. La variante A (sin Steiner) tiene TL mayor que B a igual gamma, y B puede quedar *por debajo* de TL_MST (ahorro Steiner) en 40% de los casos.\n4. A coste igualado (TL +-5%), Physarum-B tiene MD *menor* que el control MST+k aristas voraz solo en un 40% de las comparaciones: mi expectativa es que una heuristica voraz trivial iguala o supera a Physarum en la frontera coste-eficiencia (confianza 55%).\n5. Ferrocarril real (NE): TL/TL_MST in [1.3,2.5], MD in [1.10,1.50]; Physarum no lo \"reproduce\" arista a arista (solapamiento de enlaces \u003c50%).\n\n## 3. MAS ALLA (a): reservorio Physarum vs ESN (computacion de reservorio)\n\nIdea: usar la red adaptativa como reservorio sin ninguna tanh. Estado lento = conductividades D_e; estado rapido = potenciales de nodo (solucion de Kirchhoff para la corriente inyectada, corriente = bias*b0 + gain*u(t)*w). Actualizacion D \u003c- D + r_dt (|Q|^gamma - D). La unica no linealidad es que los potenciales dependen del producto I(t) * g(D) con D = integral con fugas del flujo. Como hay corriente de fondo, |Q|^2 = q0^2 + 2 u q0 q1 + u^2 q1^2 conserva el *signo* de u (memoria lineal) ademas de terminos cuadraticos.\n\n### PREDICCION P3 (2026-10-30T21:22:46Z, supuesto, antes de ejecutar)\nComparacion con ESN (tanh, leak, radio espectral, escala de entrada) a igual numero de caracteristicas de lectura (Physarum: potenciales n=40 + D_e ~ 100 aristas = ~140; ESN N=140) con busqueda aleatoria de hiperparametros equivalente (30 configs, seleccion en validacion, 5 semillas) y una linea base sin reservorio (regresion sobre 10 retardos).\nR1. NARMA10 (NRMSE, test): ESN in [0.15,0.45]; Physarum in [0.4,0.9]; P(ESN mejor) = 85%.\nR2. Capacidad de memoria lineal (suma R^2 retardos 1..60): Physarum in [4,15]; ESN in [30,70]. (todos los D_e comparten la misma constante de tiempo r, asi que espero un solo nucleo de memoria exponencial = memoria poco rica).\nR3. Posible sorpresa a probar: Physarum bate a la linea base de 10 retardos lineales en NARMA10 (P=65%).\nR4. Mackey-Glass (tau=17, submuestreo 3): prediccion a 1 paso y a 25 pasos: ESN gana ambas (P=80%).\n\n### Resultado E01 (2026-10-30T22:11:23Z, medido; out/e01_validacion.json, out/fig_e01_validacion.png; 80 grafos: 60 Delaunay + 20 laberintos)\nExito = soporte {D\u003e0.1 max D} es exactamente un camino simple de longitud Dijkstra. \"Ganador\" = el camino de maximo cuello de botella en D coincide con Dijkstra.\n| modelo | Delaunay | laberinto | nota |\n|---|---|---|---|\n| gamma=1, f=|Q|, T=200 (dt 0.05-1) | 67% | 50% | pero el *ganador* ya es correcto en 100%: simplemente los caminos perdedores no han muerto aun |\n| gamma=1, f=|Q|, dt=1, T=3000 | **100% (60/60)** | **100% (20/20)** | confirma Bonifaci-Mehlhorn-Varma en mi implementacion; tiempo de convergencia mediano 439 (Delaunay) / 739 (laberinto), 5%/20% sin converger a 1e-6 aun |\n| gamma=1.5 (pow) | 97% | 85% | **converge ~20-30x mas rapido (T~23 frente a 440-740; en el LOG original puse \"7x\" comparando con T=200 no convergido) pero falla en 3-15%: bloqueo en un camino NO minimo** |\n| gamma=2 saturante | 92% | 75% | idem, T~20 |\n| gamma=3 saturante | 63% | 15% | bloqueo (ganador-toma-todo) casi seguro en laberintos |\n| gamma=0.7 | 0% | 0% | no poda: quedan bucles |\n| f saturante gamma=1 | 0% | 0% | no poda a T=200 (la parte lineal de x/(1+x) tiene punto fijo suave) |\n| gamma=1, dt=2 (Euler, D recortado a \u003e=0) | 72% | 80% | el ganador es *incorrecto* en 28%/20%: paso grande rompe la garantia |\nHallazgos: (1) convergencia de gamma=1 es algebraica: log-log t_conv vs brecha relativa (2o camino/1o) pendiente **-0.73**, r=-0.81 (n=57 Delaunay convergidos): una diferencia de longitud del 0.1% cuesta ~miles de unidades de tiempo. (2) Compromiso velocidad/optimalidad: gamma\u003e1 poda ~20-30x mas rapido pero ya no garantiza el optimo (el caso gamma=1 si, y solo ahi: es critico). Hasta donde llego, el compromiso no esta en BMV (que dejan abierta la f saturante); lo que he medido es empirico en 80 grafos.\n### Comparacion con P1 (honesta)\n- gamma=1 100% (80/80): **acierto**, pero solo con T=3000, no con T=200; \"convergencia T~10-40\": **fallo** (mediana 439-739).\n- dt=1 sigue convergiendo \u003e=95%: acierto (ganador 100%). dt=2 fallos \u003e20%: acierto (28% y 20%), pero por *bloqueo en camino erroneo*, no por no converger.\n- gamma=2 saturante ~85%: acierto (92% / 75%; media ponderada 88%). gamma=0.7 \u003c30%: acierto (0%).\n- No esperaba que gamma=1.5 fuese casi tan buena y ~20-30x mas rapida, ni la pendiente -0.73 tan limpia.\n\n### Resultado E02 (2026-10-30T22:38:54Z, medido; out/e02_*.csv, fig_e02_frontera.png, fig_e02_mapas.png)\nDiseno: 2 regiones (Kanto 37 ciudades; Espana peninsular 39-40), Physarum de campo medio (todos los pares, f saturante) con gamma in {1.1,1.2,1.35,1.5,2,3}, 3 variantes: A (grafo completo de ciudades, 3 semillas), B (malla Delaunay con ~330 puntos de Steiner, 6 semillas), G (como B pero pares con peso gravitatorio pob_i*pob_j/d_ij, 6 semillas). Umbral de poda = kappa * (mayor umbral que mantiene conectadas todas las ciudades), kappa in {1,.3,.1,.03}. Controles: MST, Delaunay, Gabriel, RNG, spanner voraz (t=1.15..3), MST + k aristas voraces de Delaunay (k=2..30). Comparacion a coste igualado: interpolacion lineal de la envolvente no dominada de los controles (conservadora: la interpolacion lineal de una frontera convexa sobreestima su MD).\n**Hallazgo principal (negativo): ninguna configuracion de Physarum supera a un control voraz trivial a igual coste.** Fraccion de configuraciones Physarum con detour medio por debajo de la frontera de controles: 0% (Kanto) y 0.8% (Espana) [VER CORRECCION E02c: este resultado era en buena parte un artefacto de la malla]. Exceso medio de detour sobre la frontera a igual coste: variante A (sin Steiner) +0.03 a +0.06 (gamma 1.1-1.5), +0.12 (gamma 2); variantes B/G (malla) +0.09 a +0.24. En robustez (pares conectados con 10% de enlaces caidos) B/G quedan 0 a -0.30 por debajo de la frontera.\n- La variante A *sigue* la frontera de cerca (rojo en la figura): para gamma 1.1-1.5 esta a +0.03-0.06 de detour. Es decir, Physarum es casi tan bueno como un optimizador voraz del propio criterio; no mejor.\n- Parte del hueco de B/G es artefacto de la malla (caminos en zig-zag de aristas triangulares): A (sin malla) esta a +0.03-0.06 y B a +0.09-0.13 a igual gamma. No he separado el efecto mallado del efecto Steiner con un control limpio: **no_verificado** que los puntos de Steiner ayuden o perjudiquen.\n- gamma=3 (A, Kanto) produce un arbol *dominado por el final: gamma 2 y 3 dan ya arbol).\n2. B con gamma 1.3-2: TL/MST in [0.95,1.30]: **fallo parcial** (Kanto gamma 1.35: 1.60, 1.5: 1.41, 2: 1.14); detour in [1.10,1.40]: acierto solo para gamma\u003c=1.5 (1.29-1.34; gamma 2: 1.56 fallo); FT1 in [0.05,0.45]: solo gamma=2.\n3. A mas caro que B: **fallo, al reves** (A es mas barata: sin zig-zag). B por debajo del MST: **fallo** (0%).\n4. Physarum bate a MST+k a coste igualado en 40% de comparaciones: **fallo grande** (0-1%); mi expectativa cualitativa (greedy iguala o supera, 55%) acerto.\n5. Ferrocarril TL/MST in [1.3,2.5]: Kanto 1.80 acierto; Espana 3.5 fallo. detour [1.1,1.5]: Espana 1.445 acierto, Kanto 1.53 fallo por poco. Solape \u003c50%: Espana si, Kanto no.\n### Autocritica de E02\n- *¿Es esto basico o solo reproduce un articulo?* Reproduce la idea de Tero 2010 (red Physarum entre ciudades, comparada con ferrocarril) pero con lo que el articulo (segun el resumen que he podido leer) no tiene: frontera de controles voraces a coste igualado, barrido de gamma, semillas, intervalos. Eso es lo que da el resultado negativo.\n- Debilidad: la dinamica de campo medio (todos los pares a la vez) no es la de pares aleatorios de Tero (no_verificado que den lo mismo con la f no lineal); la malla introduce zig-zag; el criterio de poda (cuello de botella) es mio. Los controles optimizan *exactamente* detour, asi que quiza la comparacion favorece al voraz. Un control mas justo seria optimizar con la misma restriccion de malla.\n- Lo que seria sorprendente y no ocurrio: que gamma intermedio produjera una red mejor que el voraz en robustez a igual coste.\n\n### Resultado E03 (2026-10-30T22:39:40Z, medido; out/e03_reservorio.json; busqueda aleatoria 30 configs/metodo/tarea, 5 semillas finales, test 1000 pasos)\n| tarea | linea base 10 retardos | ESN (140 nodos) | Physarum (40 pot + D) |\n|---|---|---|---|\n| NARMA10 NRMSE | 0.819 +-0.011 | **0.260 +-0.029** | 0.696 +-0.036 |\n| capacidad de memoria lineal (retardos 1-60) | 9.01 | **24.97 +-0.5** | **0.97 +-0.17** |\n| Mackey-Glass h=1 NRMSE | 0.125 | **0.005** | 0.185 (peor que la linea base) |\n| Mackey-Glass h=25 NRMSE | 0.754 | **0.140** | 0.784 |\n**Hallazgo (sorpresa de fondo): la capacidad de memoria del reservorio Physarum es ~1.0, es decir, UNA sola variable de memoria**, aunque tiene ~100 tubos con dinamica propia. Explicacion (teoria, comprobada solo por la cifra): a primer orden todas las D_e son el mismo filtro exponencial (misma constante r) de la misma senal u(t) con distinto coeficiente c_e -\u003e rango 1; un integrador con fugas tiene MC exactamente 1. La no linealidad (D depende de |Q|^gamma) da solo correcciones de segundo orden, de modo que el reservorio es \"un integrador + la entrada instantanea\". Por eso solo bate ligeramente a la linea base lineal en NARMA10 (0.70 vs 0.82) y pierde en Mackey-Glass.\n### Comparacion con P3\nR1 acierto (ESN 0.26 en [0.15,0.45]; Physarum 0.70 en [0.4,0.9]). R2 fallo en las dos cifras: Physarum 0.97 (\u003c4: peor que lo esperado, y por una razon estructural que no preveia), ESN 25 (\u003c30: la busqueda de 30 configs no llega a lo que daria un ESN muy afinado). R3 acierto: bate a la linea base (0.696 vs 0.819, 5 semillas, sd 0.04), pero por muy poco. R4 acierto (ESN gana ambos); ademas en h=1 Physarum es *peor* que 10 retardos lineales.\n\n### PREDICCION P4 (2026-10-30T22:39:40Z, supuesto, antes de ejecutar)\nHipotesis surgida del hallazgo anterior: con *constantes de tiempo heterogeneas por tubo* (r_e log-uniforme en un rango de D decadas, como cabe esperar de tubos de distinta longitud/diametro) la memoria deja de ser de rango 1. Variante phys_het: r_e = r0 * 10^(spread*(U-0.5)), spread in [0.5, 2.5] decadas buscado igual que el resto (30 configs).\n- MC phys_het in [8, 20] (prediccion central 12); NARMA10 NRMSE in [0.40, 0.60] (mejor que la linea base 0.82, peor que ESN 0.26: P(ESN mejor)=85%); Mackey-Glass h=1 NRMSE \u003c= 0.06; h=25 \u003c= 0.45.\n- Cementerio previsto: si MC sigue ~1 con heterogeneidad, mi explicacion de rango 1 estaba incompleta.\n\n### Resultado P4 y diagnostico (2026-10-30T22:44:04Z, medido; out/e03_reservorio_v1.json = busqueda v1 con gamma in [1,3])\nphys_het v1: MC = 1.88 +-0.93, NARMA10 0.88 +-0.60 (inestable), MG h1 0.169, h25 0.61. **P4 fallo** (MC esperada 8-20).\nDiagnostico (scratchpad hifa/dbg3*.py; cifras en este LOG): en el regimen v1 (gamma\u003e=1) la dinamica con corriente de fondo poda la red: la desviacion tipica relativa de D entre tubos es 6-15 (la mayoria de tubos en el suelo 1e-6) y los valores singulares de la matriz D(t) colapsan a rango 1-2 (sv2/sv1 ~ 0.2-0.4 con spread=2; 0.007-0.2 sin spread). Con gamma\u003c=0.5 (red viva, contractiva) la memoria si crece con la heterogeneidad: MC(potenciales+D) pasa de 1.4-2.4 (homogeneo) a 3.6-5.5 (spread=2 decadas). Es decir: **mi busqueda v1 solo muestreaba gamma in [1,3] (regimen ganador-toma-todo, donde Physarum poda y deja de ser un reservorio)**; fallo de diseno mio, no de la idea. Se corrige en v2.\nAdemas: la funcion |Q| rectifica la entrada (D no ve el signo de u salvo a traves del termino cruzado con la corriente de fondo): memoria lineal intrinseca debil.\n\n### PREDICCION P5 (2026-10-30T22:44:04Z, supuesto, antes de ejecutar v2: gamma in [0.1,1.2], gain 10^[-2,0], bias 10^[-0.5,0.3], r_dt 10^[-2,-0.2], spread 0.5-3 decadas)\n- MC: phys (homogeneo) in [1.5, 4]; physhet in [3, 8] (central 5): heterogeneidad ayuda (P=75%) pero sigue lejos de ESN (~25): P(MC_ESN \u003e 3*MC_physhet) = 85%.\n- NARMA10: physhet in [0.45, 0.75]; ESN 0.26 sigue mejor (P=90%).\n- Mackey-Glass h=1: physhet \u003c= 0.12 (mejor que linea base 0.125 con P=60%).\n\n### Resultado E03 v2 (2026-10-30T22:47:07Z, medido; out/e03_reservorio.json; busqueda 30 configs/metodo/tarea con gamma in [0.1,1.2]; 5 semillas finales)\n| tarea | 10 retardos lineales | ESN 140 | Physarum homogeneo | Physarum heterogeneo (r_e log-unif.) |\n|---|---|---|---|---|\n| NARMA10 NRMSE | 0.819+-0.011 | **0.260+-0.029** | 0.695+-0.035 | 0.593+-0.023 |\n| capacidad de memoria (1-60) | 9.01 | **24.97+-0.52** | 2.29+-0.25 | 7.35+-2.05 |\n| Mackey-Glass h=1 | 0.125 | **0.005** | 0.104+-0.012 | 0.031+-0.005 |\n| Mackey-Glass h=25 | 0.754 | **0.140** | 0.276+-0.066 | 0.280+-0.044 |\nLos gamma elegidos por la busqueda estan todos en 0.2-0.8 (regimen contractivo, que no poda): **Physarum como \"podador\" (gamma\u003e1, el de Tero) es un mal reservorio (MC~1); como red memristiva que no poda (gamma\u003c1) es un reservorio modesto, 2-6x peor que un ESN a igual numero de caracteristicas, pero claramente mejor que una linea base lineal en MG** (h=25: 0.28 frente a 0.75). La heterogeneidad de constantes de tiempo multiplica la memoria x3.2 (2.29 -\u003e 7.35, intervalos que no se solapan con 5 semillas) y mejora NARMA10 (0.70 -\u003e 0.59): la hipotesis de P4 era correcta *en el regimen correcto*.\n### Comparacion con P5\nMC homogeneo [1.5,4]: acierto (2.29). MC heterogeneo [3,8]: acierto (7.35, en el borde alto; central 5 fallo). ESN mejor en NARMA10: acierto (0.26 vs 0.59). MC_ESN \u003e 3 MC_het: acierto raspando (24.97 \u003e 22.05). MG h=1 \u003c=0.12: acierto (0.031, 4x mejor que la linea base). Sorpresa: MG h=1 0.031 es mejor de lo esperado; MG h=25 no mejora con la heterogeneidad.\n### Autocritica E03\n- ¿Solo reproduce un articulo? No hay articulo: es una idea mia (red Physarum/memristiva como reservorio); no he buscado literatura previa, asi que **no_verificado** que sea nueva (existen trabajos de reservorios memristivos y con Physarum de Adamatzky y otros; no los he leido).\n- Sesgo de busqueda: dos veces me equivoque de rango (v1: gamma\u003e=1). El ESN tiene hiperparametros muy conocidos; Physarum los tuvo que descubrir: la comparacion favorece al ESN. El ESN con N=140 y 30 configs al azar da MC=25 (un ESN muy afinado llega a ~N).\n- Lo que no hice: ruido de lectura, tareas con entrada vectorial, reservorios de mayor tamano, ni compare con redes memristivas publicadas.\n\n### CORRECCION E02c (2026-10-30T22:48:40Z, medido; out/e02c_*.csv, fig_e02c_malla_justa.png): el hallazgo \"Physarum pierde 0-1%\" era en gran parte artefacto\nAutocritica escrita antes: \"un control mas justo seria optimizar con la misma restriccion de malla\". Lo hice: cada control (MST, Delaunay, Gabriel, RNG, spanner voraz t=1.1..3 en 20 pasos, MST+k voraz k=1..40 con frontera densa) se **enruta por la misma malla** (camino minimo en la malla entre cada par de ciudades unidas; la union de tramos cuenta una sola vez) para las mismas 6 semillas de malla. MST enrutado: 837 km Kanto (+7% sobre la recta, 781), 3735 km Espana (+6%): ese es el costo del zig-zag.\nResultado a coste igualado (dMD = detour_Physarum - frontera de controles enrutados; media +- sd sobre 6 semillas de malla):\n- Physarum B, gamma 1.2 a 1.5: dMD entre -0.03 y +0.03 (Kanto gamma 1.5: -0.031+-0.021, IC95% [-0.053,-0.009]; Espana gamma 1.5: -0.013+-0.027, IC incluye 0). Es decir, **Physarum recorre la misma frontera coste-detour que el voraz** al barrer gamma (figura).\n- gamma=1.1: +0.04..+0.06 (peor), gamma=3: +0.2..+0.36 (claramente peor: arbol bloqueado), gamma=2: -0.07+-0.09 (Kanto) / +0.04+-0.07 (Espana): ruido.\n- Robustez (pares conectados con 10% de enlaces caidos): Physarum a coste igual esta *por debajo* de la frontera en -0.01 a -0.06 (gamma 1.2-1.5), hasta -0.17 con gravedad y gamma 2: **el voraz es algo mas robusto a coste igual** (n=143 comparaciones: Physarum mejor en robustez 11%, en detour 22%).\n- Con pesos gravitatorios (G) el detour es algo peor (+0.01..+0.09) y la robustez algo peor: la jerarquia cuesta eficiencia global.\nConclusion corregida: **Physarum ~ voraz en la frontera coste-detour (empate tecnico), ligeramente menos robusto, y no gana en ningun regimen de forma robusta**. Mi prediccion P2.4 (Physarum mejor en 40% de comparaciones) queda en 22% (detour) y 11% (robustez) en la comparacion justa; el 0-1% de E02 era artefacto: *no volver a citar ese numero sin la salvedad*. Incluso asi, el primer analisis me sirvio: obligo a descubrir el sesgo de la malla.\nNota de cautela: la frontera de controles esta muestreada densamente (k=1..40, t en 20 pasos), de modo que el error de interpolacion es \u003c=0.01 en detour; la sd entre semillas solo recoge variacion de malla/inicializacion (mismas ciudades), no incertidumbre sobre otras regiones del mundo.\n\n## 4. MAS ALLA (d): dos plasmodios en el mismo medio (competencia / cooperacion / parasitismo)\nModelo de juguete (micelio/compete.py; **las reglas son supuesto mio**, lo medido es lo que implican). Especies A y B con sus propias D^s y nodos comida (12 puntos al azar en el cuadrado, 6+6, malla de ~150 nodos). Permeabilidad lam: s puede usar los tubos de la otra con eficacia lam. Reciprocidad mu: fraccion del refuerzo que recibe el tubo anfitrion por el flujo del invitado (mu=0: parasitismo puro). Condiciones iniciales: simetrica, A primero (D_B(0)=0.02), B primero. gamma=1.5, 12 configuraciones.\nMedidas: longitud de tubos de cada especie (D\u003e0.05), longitud de la union (infraestructura fisica), solape.\n### PREDICCION P6 (2026-10-30T22:50:31Z, supuesto; escrita DESPUES de ver una corrida rapida de 2 configuraciones —honestidad—, antes de la corrida completa de 12 configuraciones x 5 lam x 5 mu x 3 CI)\nLa corrida rapida mostro: la union baja ~22% al compartir; con A primero y mu\u003e=0.5 B queda con 0 longitud propia (parasito total); con inicio simetrico ambas conservan unos 1.3 de longitud sin solape. Predigo para la corrida completa:\n1. union(lam=1, mu=1)/union(lam=0) in [0.72, 0.85] en las tres CI.\n2. Monopolio (min(lenA,lenB) \u003c 0.1 max) con A primero: \u003e=90% de configuraciones para mu\u003e=0.5 y lam\u003e=0.5; \u003c=15% para mu=0.\n3. Monopolio con inicio simetrico: \u003c=20% de las configuraciones con mu\u003e=0.5.\n4. Dependencia de la historia: en (lam=1, mu=1) el resultado (monopolio o reparto) depende de la CI en \u003e=90% de configuraciones.\n5. Existe una mu* entre 0 y 0.5 a partir de la cual A primero da monopolio (la transicion es brusca: salto en lenB de \u003e0.5 de su valor solitario entre dos valores consecutivos de mu).\n\n### Resultado E05 (2026-10-30T22:56:26Z, medido; out/e05_competencia.csv, e05_resumen.csv, fig_e05_competencia.png; 12 configs x (lam,mu) x 3 CI = 756 corridas)\n- **Inicio simetrico: nunca hay monopolio (0% en las 25 celdas)**. Cada especie conserva ~1.2 de longitud propia (solitaria: 1.43) y casi no hay solape de tubos (cada tubo tiene un solo \"dueno\"): *reparto reciproco del medio*. La infraestructura total baja a 0.81-0.96 de la de dos redes independientes (0.81 en lam=1, mu=1).\n- **Con ventaja inicial (A primero, D_B(0)=0.02): el parasitismo total aparece de forma brusca**: para lam=1, con mu=0 B conserva 0.87 de longitud propia (monopolio 0/12 y 1/12 en A primero), con mu=0.25 pasa a 0.00 (monopolio 12/12). lam=0.75: mu*~0.25 (11/12 en 0.25); lam=0.5: salto entre mu=0.25 (B=0.53) y 0.5 (B=0.01); lam=0.25: casi nunca (1/12 solo en mu=1). La linea critica mu*(lam) decrece con lam (~0.4 en lam=0.5, \u003c0.25 en lam=1). El salto de lenB (0.53 -\u003e 0.01) es discontinuo, no gradual: transicion de tipo primer orden.\n- **Dependencia de la historia**: para lam\u003e=0.5 y mu\u003e=0.5 el estado final (monopolio o reparto) depende de la CI en 12/12 configuraciones (100%): A primero -\u003e A monopolio; B primero -\u003e B monopolio; simetrico -\u003e reparto. Es un sistema biestable (tres atractores: A, B, reparto).\n- **Sorpresa: la reciprocidad fuerte desperdicia infraestructura.** La union minima (0.69-0.71 de la solitaria, -30%) ocurre justo *despues* de la transicion con reciprocidad debil (lam\u003e=0.75, mu=0.25). Con mu\u003e=0.5 el monopolio es mas grande (longitud del anfitrion 2.30-2.37 frente a 1.90) y la union sube a 0.85-0.87: el flujo del invitado mantiene vivos tubos redundantes del anfitrion. Es decir: el parasito *que no paga nada* (mu bajo) deja la red mas eficiente que el parasito que \"devuelve el favor\".\n- Sin interaccion (lam=0) el resultado es identico a las redes independientes (control; test automatico).\nNota de cautela: las corridas simetricas en lam alto no siempre convergen en T=150 (lam=1, mu=1: 33% convergieron; oscilaciones/derivas lentas), asi que los valores simetricos en esa esquina son menos fiables. Resultados de un modelo de juguete con reglas supuestas por mi; no hay datos biologicos aqui (no_verificado cualquier correspondencia con competencia real de mohos).\n### Comparacion con P6\n1 (union en lam=1,mu=1 in [0.72,0.85]): simetrico 0.81 acierto; A primero y B primero 0.87 fallo por poco. 2: acierto (monopolio 100% con A primero para mu\u003e=0.5 y lam\u003e=0.5; \u003c=8% con mu=0). 3: acierto (0%). 4: acierto (100%). 5: acierto para lam\u003e=0.5 (mu* entre 0 y 0.5, salto brusco); fallo para lam=0.25 (no hay mu*\u003c=1).\n\n## 5. Cementerio de ideas (2026-10-30T22:57:12Z)\n- **Cementerio 1: \"Physarum no gana a los voraces (0-1%)\"** (E02 v1). Enterrado por E02c: era artefacto de la malla. Lo conservo como aviso: la primera comparacion era injusta (red en zig-zag contra rectas).\n- **Cementerio 2: \"reservorio Physarum con gamma in [1,3]\"** (E03 v1): memoria ~1; no era un reservorio sino una red podada. Rehecho con gamma\u003c1.2.\n- **Cementerio 3: habituacion/anticipacion a partir de D** (parte (a) del encargo). No la implemente: con dD/dt = f(|Q|) - rD la \"memoria\" de un estimulo periodico es solo un filtro exponencial de constante 1/r (trivial, reproduce el decaimiento de D); la anticipacion de Saigusa et al. 2008 depende, hasta donde sé, de la dinamica oscilatoria del citoplasma, no de la adaptacion de la red de tubos (**no_verificado**: no he leido el PRL). La unica \"memoria\" que medi es la capacidad de memoria lineal del reservorio (E03).\n- **Cementerio 4: agente micelial con observacion parcial (b)**. Pensado, no hecho: habria sido comparar con exploracion+Steiner/A*, de poco riesgo y poca novedad frente a E05.\n- **Cementerio 5: contraste del \"lenguaje\" de Adamatzky 2022**: la afirmacion de que la distribucion de longitudes de \"palabra\" de espigas coincide con lenguajes humanos podria ser un artefacto de cualquier proceso con agrupamiento (el tecleo aleatorio de Miller da leyes tipo Zipf). Esta pensado como experimento nulo (trenes de espigas de Poisson con la misma tasa y misma regla de agrupacion), pero **no lo hice**: no tengo los datos crudos ni la definicion exacta de \"palabra\" del articulo (no_verificado), y no queria inventarlas.\n- **Cementerio 6: red de carreteras real**: Natural Earth ofrece carreteras (ne_10m_roads) pero no las descargue; solo ferrocarril.\n- **Cementerio 7: comparacion con pares aleatorios (Tero)**: usé campo medio determinista; no comprobe que coincida con conmutacion aleatoria de pares con f no lineal.\n\n## 6. Quien me ayudo\nNadie (agente unico). Fuentes leidas: Crossref (metadatos de Tero 2010, Nakagaki 2000, Saigusa 2008, Adamatzky 2022, Bonifaci et al.), arXiv 1106.0423 (texto completo), Wikipedia (Physarum polycephalum), GeoNames cities15000, Wikidata (comprobacion de 2 coordenadas: Tokio, Madrid), Natural Earth 10m railroads v4.1.0. Bus de la ciudad solo para publicar mis mensajes. Otras casas de la ciudad no leidas ni usadas.\n","city/casa-mosca/LOG.md":"# LOG de Neuro: casa-mosca\n\n## 1. Decisiones (y por que)\n\n- **Modelo**: LIF con corriente sinaptica exponencial, dt = 0.25 ms. Espigas explicitas, como pide el\n  encargo. Un modelo de tasa habria sido mas rapido, pero no tendria espigas.\n- **Anatomia**: 50 ORN -\u003e 50 PN (1:1 por glomerulo), 2000 KC con 6 PN al azar (sin repetir), 1 APL con\n  inhibicion global, 4 MBON, 4 DAN (2 de recompensa, 2 de castigo). Mantengo el castigo en el codigo\n  (`eta_pot`) pero no lo pruebo, para no ampliar el alcance.\n- **Olores**: A, B y C como vectores de afinidad sinteticos (12 de 50 glomerulos fuertes, resto \u003c0.15).\n  Son aleatorios pero fijos por semilla.\n- **Plasticidad**: la dopamina de los DAN de recompensa deprime KC-\u003eMBON de forma proporcional a una\n  traza de elegibilidad de las KC (tau 1 s). Con elegibilidad lineal, el olor B tambien bajaba un 66%\n  (ver seccion 3), asi que cambie la regla (ver mas abajo).\n- **Escala temporal del experimento**: ensayos de 1000 ms de olor y 500 ms en blanco; 4 pares de\n  entrenamiento. Mas pares daban mas aprendizaje pero el coste en tiempo subia sin mejorar la\n  conclusion.\n- **Lectura del MBON**: espigas por segundo de la media de los 4 MBON durante el olor. Elegi espigas y no\n  corriente porque el encargo pide espigas.\n- **Definicion de KC activa**: al menos 5 espigas en 1 s (\u003e= 5 Hz). Con \"al menos 1 espiga\" el 40 a 60%\n  de las KC contaban como activas, y eso no es dispersion. Asi uso la misma definicion en el experimento,\n  en las pruebas y en la tabla.\n- **Carpeta**: `city/` no existia; la cree con `mkdir -p`. Todo lo escribo dentro de `casa-mosca/`.\n- **Scripts de calibracion**: estan en el scratchpad de la sesion (fuera de la casa), no en la casa.\n- **Ejecucion**: `OMP_NUM_THREADS=1` acelera ~6x (ver README). Lo documente en el README; no lo forzo\n  dentro del codigo para no depender del orden de imports.\n\n## 2. Intentos de Internet (max. ~10 min de esfuerzo)\n\n| Intento | Respuesta | Resultado |\n|---------|-----------|-----------|\n| `pip download --no-deps flybody` (PyPI) | \"Could not find a version that satisfies the requirement flybody (from versions: none)\" | No esta en PyPI con ese nombre. No lo busque con otros nombres. |\n| `pip download --no-deps neuprint-python` (PyPI) | 200, wheel `neuprint_python-0.6.4` (118 kB) | Descargado en un directorio nuevo del scratchpad. Lo inspeccione con `zipfile` (solo listado y lectura de texto, no lo instale ni ejecute). Borrado al terminar. |\n| `curl https://api.github.com/` | 200 | Responde. |\n| `api.github.com/repos/google-deepmind/flybody/readme` | 403: \"GitHub access to this repository is not enabled for this session. Use add_repo to request access.\" | No llame a `add_repo`: cambia el conjunto de repos de la sesion y no era necesario para esta tarea. Anotado como bloqueo. |\n| `api.github.com/search/repositories?q=hemibrain...` | 403 | Igual que arriba. |\n| `github.com/` | 400 | Bloqueado. |\n| `raw.githubusercontent.com/` | 301 | No lo seguí. |\n| `neuprint.janelia.org` | 000 (sin conexion) | Bloqueado, como dice el encargo. |\n| `arxiv.org`, `en.wikipedia.org`, `flywire.ai` | 000 | Bloqueados. |\n| `pip index versions fafbseg/navis/flybrain` | Solo salio la advertencia de `pip index` (experimental) | Resultado no concluyente; no seguí. |\n\n**Lo que sacé de neuprint-python** (docs y docstrings, no datos): menciona el dataset `hemibrain:v1.2.1`\ny subtipos de KC (KCab-p, KCab-sc, KCg, KCa'b'). Hay una matriz de ejemplo de conectividad KC-KC en un\ndocstring de `utils.py`. Es una salida de ejemplo en la documentacion, no un conjunto de datos verificado.\n**No la use para parametrizar nada**: solo muestra KC-\u003eKC, y lo que necesitaba era PN-\u003eKC.\n**Conclusion**: no obtuve datos reales de conectividad PN-\u003eKC ni de MBON-DAN. La anatomia es sintetica.\n\n## 3. Calibracion: lo que hice y lo que falle\n\nAntes de tocar la casa, midi con scripts en el scratchpad. Pasos y fallos, en orden:\n\n1. **Primera pasada con parametros por defecto**: las KC saturaban (60% con \u003e=1 espiga; 2 Hz medios)\n   y el APL iba a 150 Hz. Ademas, el MBON respondia a casi todos los olores igual y el aprendizaje\n   colapsaba todos los pesos a cero (`W_mean_change` = 0.01). *Causa*: excitacion demasiado alta y tasa\n   de plasticidad lineal sin control.\n2. **Velocidad**: 650 us por paso con BLAS multihilo; 117 us con `OMP_NUM_THREADS=1`. Causa: hilos de\n   BLAS en matrices pequenas. Solucion: documentarlo en el README.\n3. **Barrido de excitacion** (`bias_kc`, `w_pn_kc`, `w_apl_kc`): elegi `bias_kc=0`, `w_pn_kc=2.0`,\n   `w_apl_kc=1.5` (inhibicion APL-\u003eKC), que dan ~5% de KC activas (\u003e= 5 Hz) y ~0.2% en reposo.\n   Nota sobre reposo del MBON: un valor de ~3.5 Hz que aparecio en una ejecucion de calibracion salio de la\n   configuracion con el error del punto 4 (APL a 247 Hz). No es valido. Medido despues con la configuracion\n   final: 7.0 Hz en los primeros 500 ms sin olor de out/activity.json y 8.2 Hz en 10 s sin olor (semilla 7).\n4. **Error mio** al fijar los defaults: `w_apl_kc` (inhibicion APL-\u003eKC) y `w_kc_apl` (KC-\u003eAPL) quedaron\n   invertidos. Lo detecte porque el APL no coincidia con la calibracion; lo corregi y re-verifique.\n5. **Tasa de aprendizaje**: `eta` de 3e-4 a 3e-3 (lineal) saturaba todos los pesos. Bajar a 1e-5 - 1e-6\n   dio efectos en el rango util, pero la especificidad era mala: B bajaba un 66% con A entrenado.\n   *Causa*: la traza lineal alcanza a las KC con actividad de fondo (0.5 a 2 Hz), que son muchas.\n6. **Coincidencia no lineal** (traza al cuadrado): mejoro un poco. Aun asi B bajaba ~37%.\n7. **Umbral de elegibilidad** (`elig_thr` = 2, 3, 4): con 4 y `eta_dep` = 3e-5, A baja 66%, B 13%, C 29%.\n   Elegi esta configuracion: A baja mucho y B lo menos posible. Con umbral 3 (`eta` 1e-5) la separacion\n   es casi la misma (A -72%, B -17%), asi que la eleccion entre 3 y 4 es marginal.\n\n**Residual que no resolvi**: el olor C (nuevo, no entrenado) baja un 28% en la semilla 7 y hasta un 21%\nen otras semillas. Creo que es generalizacion por solapamiento de KC (Jaccard 0.05 con A; 0.08 con B) y\npor la inhibicion global, que cambia el nivel medio de todas las respuestas. No he verificado esta\nexplicacion por separado. Lo reporto tal cual.\n\n**Semilla 8**: la discriminacion es solo de 14 puntos (A -44%, B -30%). No la \"arregle\" con parametros\nhechos a medida para esa semilla; la dejo como hallazgo.\n\n## 4. Que aprendi\n\n- La dispersion de KC depende mas de la inhibicion y del umbral que de los pesos PN-\u003eKC; con 6 PN por KC,\n  el mismo peso excitatorio puede saturar o silenciar.\n- La forma de la regla de plasticidad importa mas que la tasa: con elegibilidad lineal, el aprendizaje\n  se generaliza a todo el MB; con un umbral y coincidencia no lineal, se concentra en las KC del olor\n  entrenado.\n- Medir la dispersion con \"al menos 1 espiga\" engana: parece dispersa al 40%, pero no lo es.\n- Un error en el signo o el nombre de un parametro se ve rapido en las tasas del APL; comparar siempre\n  contra la configuracion medida.\n\n## 5. Quien me ayudo\n\nNadie. Trabaje sin ayuda, solo con las herramientas de la sesion; no consulte a otros agentes ni al Alcalde.\n\n## 6. Literatura citada de memoria (sin verificar, sin enlaces)\n\n- Caron, Ruta, Abbott, Axel (2013, Nature), convergencia aleatoria de entradas olfativas en el MB. De memoria:\n  media de ~7 PN por KC (rango ~2-11). Mi modelo usa 6 PN por KC porque lo fija el encargo, no por la literatura.\n- Aso et al. (2014, eLife), arquitectura del cuerpo fungiforme y de las neuronas de salida (MBON) y\n  dopaminergicas (DAN): motiva el papel de los DAN de recompensa y de castigo.\n- Hige, Aso, Modi, Rubin, Turner (2015, Neuron), depresion heterosinaptica en el aprendizaje aversivo de la\n  mosca: el castigo deprime un MBON que promueve la atraccion. Es inspiracion para la idea de depresion\n  dopaminergica de las sinapsis KC-\u003eMBON. La regla exacta que uso (recompensa, elegibilidad con umbral y\n  coincidencia no lineal) es mia y no reproduce ese articulo.\n- Turner, Bazhenov, Laurent (2008): representacion de olores en las KC (dispersion).\n- Eichler et al. (2017, Nature): conectoma del centro de aprendizaje de la larva, para la idea general\n  de la conectividad.\n\nRepito: son citas de memoria. No las he comprobado (sin acceso a Internet a los articulos).\n\n## 7. Lo que falta / limitaciones\n\n- Sin datos reales. Todos los parametros son aproximaciones calibradas a mano; en el README se dice.\n- Sin LN, sin gamma, sin castigo probado, sin MBON especificos.
