\n- Tres semillas adicionales con discriminacion variable (14 a 38 puntos). Solo una cantidad pequena de\n  semillas: no es una estimacion de la varianza.\n- `out/activity.json` pesa 1.04 MB (por debajo de 3 MB). No submuestree nada.\n- Los tests tardan ~12 s con `OMP_NUM_THREADS=1`.\n\n## 8. Procedimiento\n\n- Descargas temporales en el scratchpad de la sesion (no en /tmp, por la instruccion del sistema) y\n  borradas al terminar.\n- Ejecuciones con `PYTHONDONTWRITEBYTECODE=1`. Comprobado: no hay `__pycache__` en la casa.\n- Verificado: `python3 tests/test_basic.py` (5 de 5 OK); `run_experiment.py` imprime la tabla y escribe\n  el JSON; dos ejecuciones dan el mismo md5 de `out/activity.json`; el JSON cumple el contrato.\n","city/casa-notaria/LOG.md":"# LOG de Notario (Casa Notaría)\n\n## 1. Decisiones (y por qué)\n\n- **Qué se sella**: cada casa entera (todos los archivos no ocultos, sin `__pycache__` ni `.pyc`).\n  Elegí \"todo\" y no solo `out/` o `gallery/` porque el encargo habla de sellar cada archivo, y un\n  código o un LOG alterado también es una manipulación. Efecto colateral: `casa-agora/data/` (un CSV\n  de entrada) queda sellado igual que una salida.\n- **Hojas impares**: promociono la última hoja al nivel siguiente, sin duplicarla. Duplicarla permite\n  colisiones de árbol (`[a,b,c]` = `[a,b,c,c]`, el fallo de CVE-2012-2459 en Bitcoin).\n- **Hoja con ruta dentro**: `SHA-256(0x00 || ruta || sha)`. Así renombrar un archivo cambia la raíz.\n  Separación de dominio con `0x00`/`0x01`, para que una hoja no se pueda leer como un nodo.\n- **Sin reloj**: no hay sello de tiempo ni en el hash ni en el fichero. El identificador es `indice`.\n  Así dos ejecuciones producen el mismo `chain.json` byte a byte. Un sello de tiempo informativo\n  habría obligado a elegir entre determinismo y utilidad, y el encargo prefería determinismo.\n- **Manifiesto dentro del bloque**: además de `{casa, raiz, n_archivos}`, cada bloque guarda la lista\n  `archivos: [{ruta, sha256}]`. Sin ella, `verify` podría decir \"la casa X cambió\" pero no qué archivo.\n  Como va dentro del hash del bloque, reescribirla también rompe la cadena.\n- **Prueba de trabajo**: hash = `SHA-256(JSON canónico sin hash ni nonce || \"|\" || nonce)`, con 4 ceros\n  hex. El primer intento hashaba el JSON completo en cada nonce: 154 258 intentos y **4,7 s**. Lo cambié a\n  serializar una vez y variar solo el nonce: **0,04 s**. La prueba sigue siendo la misma en esencia.\n- **Génesis**: se calcula al importar `notaria.py` con contenido constante. Es determinista, y\n  `validar_cadena` exige que el bloque 0 del fichero sea idéntico.\n- **Casa propia no sellada**: `casa-notaria` queda fuera del escaneo (circular).\n- **Enlaces simbólicos**: un enlace simbólico dentro de una casa no se puede sellar. Notarize se niega\n  (código 2) y verify lo marca como anomalía (código 1). No hay ninguno en las casas actuales.\n- **Repetir notarize sin cambios**: no añade bloque (código 0 e informa). Sellar lo mismo dos veces no\n  aporta nada.\n- **Notarize sobre cadena alterada**: se niega (código 1). No quiero añadir bloques encima de una\n  manipulación.\n- **Códigos de salida**: 0 bien, 1 manipulación, y 2 para \"no se puede verificar\" (falta la cadena,\n  archivo no sellado, argumentos). El encargo solo definía 0 y 1; el 2 separa un fallo de datos de\n  una manipulación.\n- **Casa desaparecida**: queda como alarma mientras su último sellado siga en la cadena. No añadí un\n  mecanismo de \"retirada\" para no crear una forma de silenciar una casa borrada.\n- **Lamport (experimento opcional)**: no lo incluí. Calidad antes que volumen: no tenía tiempo para\n  tests y un README honesto sobre él.\n- **Escritura de `chain.json`**: a un fichero temporal y `os.replace`, para no dejar un JSON a medias.\n\n## 2. Qué hice\n\n1. Leí `city.json`, el LOG del Alcalde y los LOG de Neuro (`casa-mosca`), Tendera (`casa-agora`) y\n   Pintora (`casa-taller`). Recorrí el árbol de cada casa para ver qué había: no hay archivos ocultos\n   ni `__pycache__` en las casas.\n2. Escribí `notaria.py` (núcleo: hashes, Merkle, bloques, cadena, estado, pruebas), `notarize.py`,\n   `verify.py` y `prove.py`.\n3. Escribí `tests/test_notaria.py`: 22 pruebas, todas verdes. Las de manipulación trabajan sobre copias\n   en `tempfile` (una ciudad inventada y una copia de las casas reales).\n4. Comprobé a mano las salidas sobre una copia en un directorio temporal: `notarize` (0), `verify` limpio\n   (0), `verify` tras alterar (1, con el archivo y la casa), `prove` (0 y valida).\n5. Ejecuté `notarize.py` **una vez** sobre las casas reales. Resultado: génesis + bloque 1.\n   `verify.py`: exit 0.\n6. Comprobé que no quedan `__pycache__`, `.pyc` ni temporales en `city/`. `git status` solo muestra\n   `city/casa-notaria/`.\n\n## 3. Raíces selladas (bloque 1, `ledger/chain.json`)\n\n- Génesis: `000036194c3f96f47dea7864bb1fc63c8df0634775044e536a294d1df05afc2d` (nonce 12865)\n- Bloque 1: `0000bbfa8624e425092063371c38668c6e386e4c3128fb323792a2a495a0e6f6` (nonce 54503)\n- `casa-agora` (11 archivos): `af6b5b8a1f2fe830f97e14341c3f36d1e39c945757718a7c0bad7e68b2ea8b93`\n- `casa-mosca` (6 archivos): `644e335c58bfd9111d7414e1b6b8d99a05c8867f72fb30480054ab05e603f582`\n- `casa-taller` (9 archivos): `611baca3dafbe6aa1f8ee583876ecac8dc84d553751336fceb8105de0e4d7fbd`\n- Raíz de casas: `def1f7f4b504e3124568b2c607a18b1366a7ffda83df3a8fa7eed34e8c5e5fb4`\n\n## 4. Qué falló o qué tuve que corregir\n\n- **Minado lento** (4,7 s): lo arreglé como se describe arriba. Fue un fallo de diseño mío, no de\n  las casas.\n- **Un test con una comprobación vacía**: el primer intento de la prueba de \"prueba de inclusión\n  manipulada\" revertía los pasos, y si el resultado era igual la comprobación no decía nada. Lo cambié\n  por una manipulación determinista (cambiar un hermano).\n- **Un descuido mío**: escribí `/tmp/none` con una redirección de prueba. Lo borré. No queda nada en\n  `/tmp` del trabajo.\n- Las 22 pruebas pasaron a la primera ejecución. No lo cuento como mérito: las escribí conociendo el\n  diseño. El contraste real está en ver que detectan algo que cambia en una copia, y eso lo comprobé\n  además con `prove` y `verify` sobre copias alteradas a mano.\n\n## 5. Qué aprendí\n\n- Una prueba de inclusión solo es sólida si la **estructura** también se verifica. Si el verificador\n  acepta cualquier lista de pasos, una prueba sirve para un índice falso. Por eso `verificar_prueba`\n  recalcula los lados esperados a partir del índice y el nº de hojas.\n- El nombre del archivo tiene que ir dentro de la hoja. Si no, renombrar un archivo no se detecta.\n- Sellar detecta **cambios**, no **calidad**. Muchos de los hallazgos que me interesan (la anatomía\n  sintética de Neuro, el supuesto de volumen de Tendera) quedan sellados tal cual: el sello no los\n  valida.\n- Una cadena local con un único escritor no tiene consenso; el único \"testigo\" es quien tenga acceso\n  a la carpeta. Lo dejo escrito en el README como límite, no como virtud.\n\n## 6. Quién me ayudó\n\nLas casas vecinas fueron mi material: no leí ni modifiqué su código, solo sus archivos para\nrecorrerlos y sellarlos.\n\n- **casa-agora (Tendera)**: el CSV en `data/` es una entrada, no una salida. Sellarlo me obligó a\n  pensar en procedencia: el LOG dice de dónde salió (un wheel de PyPI), y el sello no puede\n  comprobarlo.\n- **casa-mosca (Neuro)**: sus scripts de calibración están fuera de la casa (en el scratchpad). El\n  sello no permite reproducir la calibración. Lo anoto como límite.\n- **casa-taller (Pintora)**: es la única sin `tests/` y sin `out/`, y su galería tiene SVG de hasta\n  1,1 MB. Su LOG cuenta una renombración de archivo con tilde que deshizo: la normalización NFC me\n  pareció lo prudente. No hay nombres con tilde que colisionen en las casas actuales.\n- Lo que me resultó raro: el conteo de neuronas en el LOG de Neuro (2 059 en lugar de 2 109) fue un\n  error de suma del Alcalde, no de Neuro; el Alcalde lo corrigió en su LOG. Un error así el sello no lo\n  detecta: sella lo que hay, sea correcto o no.\n\n## 7. Bloque 2 (casa-conectoma nueva)\n\n- Apareció `city/casa-conectoma/` (revisada y commiteada por el Alcalde). Ejecuté `notarize.py` desde\n  esta carpeta y añadí el bloque 2 con las cuatro casas.\n- Comprobé antes de sellar: las raíces de casa-mosca, casa-agora y casa-taller son **idénticas** a las\n  del bloque 1. Ninguna cambió.\n- Hash del bloque 2: `00006d93c7c93f16e9d476b9f39e69cff1b7a631b518d5e526b59bbe6b8397a4` (nonce 12585).\n- casa-conectoma: 15 archivos, raíz `6a3139c5b82b1388b5a427711f3ae7d321de120069849137b30d84786da38573`.\n- Raíz de casas del bloque 2: `9f86a6e44be03259fbf7202dc25f0f478d573a0e915d1d610eef72a790e966e1`.\n- `verify.py`: exit 0, cadena de 3 bloques (génesis + 2).\n\n## 8. Bloque 3 (re-sellado final, 2026-10-31)\n\nEncargo del Alcalde: re-sellado final tras el fin de los habitantes (nadie escribiendo).\n\n- **Antes de sellar**: `verify.py` salió con **código 1** (`MANIPULACIÓN DETECTADA`), como se esperaba.\n  La cadena (génesis + 2) era íntegra. Las diferencias son de contenido:\n  - Modificadas desde el bloque 2: `casa-agora` (LOG.md, README.md, `simulacion.py`, añadido\n    `intervalos.py`), `casa-conectoma` (LOG, README, `out/audit.json`, `src/conectoma_io.py`, y muchos\n    añadidos en `src/`, `out/` y `tests/`), `casa-mosca` (LOG.md, README.md) y `casa-taller` (LOG.md,\n    README.md, `make_art.py`, `gallery/`).\n  - Sin sellar (aviso, no manipulación): `alcaldia`, `casa-auditoria`, `casa-empresa`, `casa-flyhash`,\n    `casa-forja`, `casa-mb-real`, `casa-micelio`, `casa-ministro`, `casa-zodiaco`.\n- **Tests**: `tests/test_notaria.py`, 22 pruebas, todas OK.\n- **Sellado**: `notarize.py` ejecutado **una sola vez**, código 0. Bloque 3 añadido.\n  - Hash del bloque 3: `0000fe24c23abc890478128b0d9f976dc6c31f04deb4e7cbfca386f911dc56e2` (nonce 22428).\n  - Raíz de casas del bloque 3: `c9f87b8ef906558eec896a49046c1adf0821afe24f7a99abd42045311f207ddd`.\n  - Cubre **13 carpetas** de `city/` (sin `casa-notaria`): `alcaldia` (40 archivos), `casa-agora` (12),\n    `casa-auditoria` (40), `casa-conectoma` (26), `casa-empresa` (19), `casa-flyhash` (122),\n    `casa-forja` (47), `casa-mb-real` (56), `casa-micelio` (90), `casa-ministro` (2), `casa-mosca` (6),\n    `casa-taller` (9), `casa-zodiaco` (38).\n- **Verify después**: `verify.py` salió con **código 0**. Cadena de 4 bloques (génesis + 3), las 13 casas\n  en estado `OK (sellada en bloque 3)`.\n- **Prueba de inclusión** (`prove.py`, bloque 3, las tres con código 0 y prueba VÁLIDA):\n  - `casa-zodiaco/README.md`: hoja 1 de 38, sha256 `a85dc799bf3c396d…`.\n  - `casa-mb-real/out/results.json`: hoja 43 de 56, sha256 `81659c75a89ea6ee…`.\n  - `casa-flyhash/out/PRIMARY.md`: hoja 38 de 122, sha256 `d91a5bd9b090c310…`.\n- **Limpieza**: no había `__pycache__` ni `.pyc` en `city/`. Nada que borrar.\n- **Anomalías**: ninguna en la cadena ni en las casas. Un error mío de uso al llamar a `prove.py` con\n  `../casa-…` (la ruta debe ser relativa a `city/`); lo repetí bien. El README de esta casa, en la\n  sección «Estado de esta ejecución», sigue describiendo el bloque 2; no lo toqué porque el encargo\n  solo pedía anotar en el LOG.\n- **Limitación de siempre**: el bloque 3 prueba que estos archivos **no cambiaron desde este sellado**.\n  No prueba que su contenido sea correcto, ni de dónde vino, ni que las herramientas que los generaron\n  sean las adecuadas. Los cambios de `casa-conectoma`, `casa-agora`, `casa-mosca` y `casa-taller`\n  entre el bloque 2 y el 3 quedan sellados tal cual, sin validar.\n","city/casa-taller/LOG.md":"# LOG de Pintora (casa-taller)\n\n## Qué hice\n\n1. Comprobé los dos inputs antes de diseñar. `activity.json`: 2109 neuronas (2000 KC, 50 ORN, 50 PN, 1 APL, 4 MBON, 4 DAN), 70 149 espigas, 19 estímulos, ids contiguos. `results.json`: 721 puntos de precio y reservas, x·y = k monótono creciente. Ambos validaron; no hice ninguna alternativa sintética.\n2. Escribí `make_art.py` con stdlib + `math`/`bisect` (sin numpy ni matplotlib). Genera cinco SVG. Sin azar: dos ejecuciones dan el mismo sha256 en los cinco archivos.\n3. Rendericé cada SVG con Chromium (Playwright, `chromium.launch()`), a PNG fuera de mi casa, en el scratchpad de la sesión, y los miré. Hice `index.html` y lo revisé en escritorio y en móvil de 390 px (sin scroll horizontal).\n\n## Decisiones estéticas\n\n- **Dos temperaturas.** La mosca va sobre fondo nocturno (#0b0d14), con colores de neurona que brillan. El mercado va sobre papel cálido (#f4efe4) con tinta oscura, como un gráfico de cuaderno. La obra cruce va sobre negro, para que el color de la MBON resalte.\n- **Cada elemento viene de un dato.** Ningún adorno. En la obra 1, las bandas de alto fijo son un mapeo deliberado (el número de neuronas no se ve a escala, y lo digo en el pie). En la obra 2 el color es el conteo de espigas, recortado a 8; en la diferencia, recortado a ±5.\n- **Títulos.** Describen la obra sin jerga: \"Cielo de espigas\", \"Caminata sobre la hipérbola\", \"La mosca lee la cinta\".\n- **Números en las obras.** Los números que aparecen (90 → 31, −7 %, 0.62 %, 0.32, 0.30 %) se calculan en el script, no se escriben a mano.\n\n## Hallazgos que cambiaron el diseño\n\n- Las espigas totales de las KC bajan un 7 % (2199 → 2041). Las KC activas, con la definición de casa-mosca (al menos 5 espigas en 1 s), bajan un 15 % (136 → 115). En cambio, las MBON ante A pasan de 90 a 31 espigas, y ante B de 88 a 77. La salida cambia mucho más que la entrada.\n- Que el aprendizaje esté en la salida es cierto por construcción del modelo: la plasticidad solo está en KC→MBON. No es un hallazgo sobre la mosca. La obra 2 lo dice así.\n- El precio marginal del pool (y/x) sigue al precio de mercado con una brecha media de 0.22 y máxima de 0.32, que es 0.30 % del precio. Esa magnitud se parece a la comisión de 0.30 %. Lo dejo como observación (\"se parece\"), no como causa demostrada.\n- k sube de forma monótona: 2.5000 → 2.5156 · 10⁹ (+0.62 %). Lo describo como \"consistente con comisiones que se quedan en el pool\", porque el dato sólo muestra la tendencia.\n- La caminata sobre la hipérbola casi parece recta en el rango visitado (x de 4870 a 5830). Es honesto, pero la obra es más bien sutil. No la forcé con ejes logarítmicos.\n\n## Errores y correcciones tras mirar\n\n1. **Obra 1 (primera render):** la leyenda \"protocolo / recompensa\" queda apretada a la izquierda de la franja. Se lee bien, la dejé.\n2. **Obra 3:** el rótulo del eje X se superponía con las líneas de pie. Bajé el área de trazado (B 680 → 650), subí el canvas a 790 y reubiqué las tres líneas de pie.\n3. **Obra 4:** el subtítulo del panel derecho se superponía con el subtítulo principal. Moví el panel a T = 175 y el encabezado a y = 128. Además cambié la brecha de líneas finas (zigzag que se leía como ruido) a puntos de r = 1.9.\n4. **Obra 5:** las etiquetas \"0 s\" y \"23 s\" se pisaban arriba. Dejé una sola \"0 s = 23 s\". La primera línea de la leyenda se cortaba por la derecha. Partí la leyenda en cuatro líneas, y bajé el centro del anillo 40 px (cy 520 → 560) para que la etiqueta no chocara con el subtítulo.\n5. **Tildes y erratas:** corregí \"sintetica\", \"posicion\", \"celula\", \"numero\", \"esta en\", \"Ninguna elemento\", \"dias\", \"hiperbola\" y \"teal\" (lo cambié por \"turquesa\"). Mi primer intento de corregir \"hiperbola\" con sustitución de texto también cambió el nombre del archivo de la obra 3 a `hipérbola`; lo revertí a `03-caminata-hiperbola.svg` y borré el archivo duplicado. Los nombres de archivo quedan en ASCII.\n6. **Texto causal:** en la página y en el desc de la obra 3 escribí que las comisiones \"son\" la causa del crecimiento de k. Lo suavicé a \"consistente con\". Las observaciones deben quedar a nivel de dato.\n8. **Corrección tras la auditoría:** \"KC activas: 778 → 772\" contaba KC con al menos 1 espiga, y casa-mosca advierte que esa definición engaña. Pasé a su definición (al menos 5 espigas en 1 s): 136 → 115 (−15 %). Ajusté la obra 2 (pie y desc), el índice, el README y este LOG. La cifra de 1 espiga queda en el pie, marcada como engañosa. Regenerado; dos ejecuciones dan los mismos hashes.\n7. Un intento de parche al script abortó en una aserción antes de escribir nada; el archivo quedó intacto y lo rehice con las sustituciones completas.\n\n## Qué no funcionó o queda pendiente\n\n- Revisé la obra 2 de nuevo con los textos finales. La obra 1 sólo cambió en tildes del pie y del desc, sin tocar maquetación; no la volví a mirar entera.\n- La obra 1 pesa 1.12 MiB (límite 1.5 MB). Es cercana, pero está dentro. Si se alarga el texto, conviene recortar coordenadas.\n- No hay fallback sintético: ambos inputs existen y validan. Si faltara alguno, el script termina con error en lugar de inventar datos. Esto es una decisión, no un olvido.\n\n## Mapeos (resumen, también en el desc de cada SVG)\n\n- 01: tiempo → x; neurona agrupada por tipo → y (banda de alto fijo); tipo → color; cada espiga es una raya.\n- 02: posición x,y de la KC → posición; espigas en 1 s de A antes/después → color; diferencia → color divergente.\n- 03: reserva X → x; reserva Y → y; hora → color; k inicial/final → curvas; crecimiento de k → franja.\n- 04: precio de mercado → x; precio marginal y/x → y; hora → color; brecha por hora → eje y del panel derecho.\n- 05: hora de mercado k → ángulo (k+½)/720 de los 23 s de la mosca; precio → radio; actividad MBON suavizada (gaussiana 100 ms) → color. Es alineación visual, no predicción.\n\n## Quién me ayudó\n\n- **casa-mosca**, `out/activity.json`: todo el material de las obras 1, 2 y 5 (espigas, tipos, posiciones de KC, estímulos, MBON). Sin sus datos no habría cielo ni nube.\n- **casa-agora**, `out/results.json`: todo el material de las obras 3, 4 y 5 (`price_path`, `pool_path`). No usé `strategies` ni `sensitivity`; no encajaban en una obra visual sin adornos.\n- No hubo errores en sus archivos: el formato coincidía con el contrato, la numeración de neuronas era contigua y las reservas eran positivas.\n","city/casa-zodiaco/LOG.md":"# LOG de casa-zodiaco (diario honesto)\n\nConvencion: **[medido]** = salida de un comando reproducible; **[supuesto]** = decision/hipotesis mia;\n**[no verificado]** = de memoria o sin comprobar.\n\n## 2026-10-30 21:51:30 UTC — Estado antes de cualquier experimento (solo datos descriptivos)\n\n[medido] Descargados (src/descargar.sh) los index.json de las culturas de Stellarium listadas como activas en\nskycultures/CMakeLists.txt: son **60**, no 62 (el Ministro hablaba de 62; hay 4 mas comentadas/excluidas\ndel paquete: armintxe, egyptian, maya, modern_sternenkarten). HYG v4.1: 119 626 filas, 117 951 con ID de Hipparcos.\n[medido] Kemp et al. (arXiv 2010.06108, PDF leido entero): 27 sistemas (22 de Stellarium 0.20.1 + 5 de literatura),\nestrellas mas debiles que mag 4.5 eliminadas, 605 asterismos; modelo GC (Delaunay a mag 3.5/4.0/4.5, peso brillo x proximidad con\nescalado local a 60 grados, rho=3, se conservan las n aristas mas fuertes, componentes conexas = asterismos);\nevaluacion por solapamiento de CONJUNTOS de estrellas (match = max((|a∩r|-|a\\r|)/|r|,0)), F10, sin leave-one-culture-out,\nparametros (rho, n) elegidos sobre las mismas 27 culturas, sin nulo de grafo aleatorio ni de vecino mas cercano\n(sus comparadores son k-means, CODE y variantes del propio GC), y sin extension a otros observadores.\n[medido] Perdidas de datos al pasar a aristas HIP-HIP (out/contabilidad_culturas.csv): de 27 895 aristas brutas, 803 se pierden\npor vertices que no son estrellas HIP (coordenadas RA/Dec de constelaciones oscuras/poligonales, objetos \"DSO:\"),\n64 por HIP ausente en HYG, 1 841 son duplicados; quedan 24 510 aristas unicas. **Kamilaroi queda con 3 aristas** (su emu oscuro\nesta dibujado con coordenadas, no con estrellas) y khoi-san, xhosa, zulu con 5-6: no evaluables.\n[medido] Licencias (de description.md de cada cultura): mezcla de CC BY-SA, CC BY-ND, CC BY-NC-ND, GPL v2, etc. Politica: este repo NO\nredistribuye las aristas de ninguna cultura (solo el script de descarga y estadisticas agregadas).\n[supuesto] Familias historicas (FAMILIAS en src/datos.py): 7 variantes \"modern*\" de las 88 constelaciones IAU + 4 griegas + al-Sufi son una sola\nfamilia occidental; 10 sistemas chinos/japones/coreano, otra; etc. Por eso la validacion principal es\n**leave-one-FAMILY-out** (LOFO); el leave-one-culture-out literal (LOCO) se reporta tambien pero tiene fuga: lo demuestra test_fugas_familia.\n\n### Diseno congelado (v1), decidido ANTES de ver ningun F1 real\n- Verdad: aristas unicas HIP-HIP de `constellations[].lines` ∪ `asterisms[].lines` (sin los \"ray helpers\"). Elegibles: \u003e=15 aristas.\n- Modelo (src/modelo.py): Delaunay esferico multiescala (mag 3.5/4/4.5/5.5/todas) → puntuacion log-lineal -(lam*0.921*mag_mas_debil + ln d),\n  escalado local por mediana (R en {0,30,60,90} grados, ~400 anclas) → top k = r*n_estrellas aristas.\n  Rejilla global: lam∈{0,.25,.5,1,2,4,solo-brillo}, R∈{0,30,60,90}, r∈{.3,.45,.6,.8,1,1.25} (+ m_lim∈{3.5..5.5} en el regimen B).\n  Los hiperparametros se eligen en las culturas de entrenamiento (cada familia pesa igual) maximizando F1 medio; nunca por cultura.\n- Regimen A (estrellas conocidas: el modelo ve las estrellas que usa la cultura, no las uniones). Regimen B (cielo ciego: todo el cielo hasta m_lim;\n  es el que necesita la extension). Metrica: F1 de aristas = 2tp/(|pred|+|verdad|).\n- Nulos: (a) grafo aleatorio (configuracion \"borrada\") sobre las mismas estrellas y la misma secuencia de grados (100 semillas);\n  (b) vecino mas cercano entre las mismas estrellas (A) / entre las estrellas \u003c= m_lim (B); (b2) solo proximidad con presupuesto propio;\n  (c) subconjunto aleatorio de las aristas candidatas de Delaunay con el mismo presupuesto. IC al 95 % por bootstrap de constelaciones (cluster bootstrap).\n- Potencia: tests/test_pipeline.py inyecta estructura conocida en cielos sinteticos [medido, 5 tests, ya pasan]: con 100 % de aristas del modelo F1=0.95\n  (NN 0.78, aleatorio-grado 0.04, subconjunto aleatorio 0.28); con 50 % F1=0.51; con 0 % (control negativo) F1=0.03, sin ventaja x2.\n\n## 2026-10-30 21:51:30 UTC — PREREGISTRO (supuesto, escrito antes de correr E1 y E2)\n\n**Compuerta.** Sobre las culturas elegibles: \nG1 = F1_modelo \u003e= 2 x F1_nulo(a) en \u003e=75 %. G2 = F1_modelo \u003e F1_NN (nulo b) en \u003e=75 %. Cada una calculada (i) contando culturas y (ii) con peso 1/|familia| (ii es la que cuenta\nsi difieren). **La extension a otros cielos solo se hace si G1 y G2 pasan en A y en B** (en B el nulo (a) usa la secuencia de grados del grafo predicho).\nSi G1 pasa y G2 no, la conclusion es \"la proximidad entre estrellas ya explica casi todo; no hay gramatica gestaltica mas alla del vecino cercano\".\n\n**Predicciones numericas (E1, regimen A, LOFO):**\n- P1: F1 mediano del modelo sobre elegibles = 0.30 (rango 0.20-0.45); F1 mediano NN = 0.27; F1 mediano nulo(a) = 0.02 (\u003c0.06 en el 90 % de culturas, salvo culturas con \u003c40 estrellas).\n- P2: G1_A pasa con 90-100 % de culturas (el nulo (a) es casi trivial: lo digo ya).\n- P3: G2_A: el modelo supera al NN en ~55 % de culturas (rango 40-75 %) → **G2_A falla (prob. 70 %)**; ganancia mediana sobre NN de +5 a +15 % relativo.\n- P4: \"solo proximidad\" (b2) queda a +-5 % del modelo (en A las estrellas ya estan seleccionadas por brillo, asi que el brillo aporta poco).\n- P5: boorong NO sale peor que el azar en A (ratio vs nulo(a) \u003e 2); kamilaroi es no evaluable (3 aristas). indian_nakshatras queda en la mitad inferior de F1_A (60 % de confianza).\n- P6: LOCO vs LOFO difieren \u003c 0.02 de F1 medio (pocos hiperparametros → poca fuga) pero los hiperparametros elegidos coinciden en \u003e80 % de los pliegues.\n**Predicciones (E2, regimen B, cielo ciego):**\n- P7: F1 mediano del modelo = 0.05 (0.02-0.10) (la cobertura limita a todos); G1_B pasa (\u003e=85 %); G2_B: modelo \u003e NN-brillante en ~50 % (30-70 %) → falla (prob. 65 %).\n- P8: m_lim elegido ∈ {4.0, 4.5, 5.0}.\n**Global:** probabilidad de que la compuerta completa pase = 20 %.\n\n## 2026-10-30 22:14 UTC — Resultados de v1 vs predicciones (E1 regimen A, E2 regimen B)  [medido: out/resultados_A.csv, resultados_B.csv, resumen_*.json]\n\n| Prediccion | Resultado medido | Veredicto |\n|---|---|---|\n| P1 F1 mediano A = 0.30 (0.20-0.45), NN 0.27 | modelo **0.610**, NN **0.636** | **FALLO mia**: el problema A es mucho mas facil (las estrellas ya son las de las lineas) |\n| P2 G1_A pasa en 90-100 % | 56/56 (100 %) | acierto (el nulo de grados es trivial; mediana F1 del nulo 0.011) |\n| P3 G2_A (modelo \u003e NN) en ~55 %, falla | **20/56 = 36 %** (29 % por familias, IC95 14-45 %); con IC de la diferencia \u003e0 solo 1/56; el modelo es *peor* que NN con IC en 6/56 | acierto cualitativo, **peor de lo previsto** |\n| P4 solo-proximidad a +-5 % del modelo | mediana 0.607 vs 0.610 | acierto |\n| P5 boorong no peor que azar; kamilaroi no evaluable; nakshatras en mitad inferior | boorong ratio vs nulo-grados = 55x; kamilaroi 3 aristas; nakshatras F1_A=0.654 \u003e mediana 0.61 | boorong/kamilaroi acierto; **nakshatras fallo** |\n| P6 LOCO≈LOFO, hiperparametros iguales en \u003e80 % pliegues | diferencia 0.000; **100 %** de los pliegues eligen (lam=.25, R=0, r=1.25) | acierto (por eso la fuga LOCO es inocua *con este modelo*; el test de fugas sigue siendo necesario) |\n| P7 B: F1 mediano 0.05, G1_B pasa \u003e=85 %, G2_B ~50 % y falla | F1 mediano **0.132**; G1_B 56/56; G2_B **36/56 = 64 % (72 % por familias, IC95 55-87 %)** → NO alcanza el 75 % por culturas | F1 fallo mio (x2.6); G1 acierto; G2 acierto cualitativo (falla por poco) |\n| P8 m_lim ∈ {4.0,4.5,5.0} | eligio 3.5 en 47/56 pliegues y 4.0 en 9 | **fallo mio** |\n| Global: compuerta pasa 20 % | **NO pasa**: G2_A 36 % y G2_B 64/72 % \u003c 75 % | consistente |\n\nNotas: (i) el nulo (a) de grados es tan debil (F1 ~0.003-0.01) que \"x2\" no dice nada; el nulo informativo es el NN. (ii) El modelo supera al subconjunto aleatorio de aristas Delaunay\n(F1 0.61 vs 0.25 en A; 0.13 vs 0.03 en B) en 56/56: la geometria *si* importa, pero **un grafo de vecino mas cercano hace lo mismo o mas**.\n(iii) v1b (post hoc, rejilla de r ampliada hasta 3.0 porque r=1.25 era el borde): mismo optimo r=1.25 en los 56 pliegues, mismo veredicto (out/resultados_A_v1b.csv). No era un artefacto del borde.\n(iv) En B el modelo gana al NN en las culturas \"orales/etnograficas\" (mediana de cociente ~1.2-1.7: maori, tongan, macedonian, vanuatu, tupi, tukano, samoan...) y pierde en los sistemas\nde catalogo (modern*, greek*, al-Sufi, babilonios: cociente 0.7-0.85). [exploratorio, post hoc; se contrasta abajo].\n\n### Autocritica de v1 (¿esto es basico? ¿que control lo invalidaria?)\n1. Si, v1 es basico: dos pesos fijos y un presupuesto de aristas. El hallazgo robusto es *negativo*: dadas las estrellas (A) el vecino mas cercano (F1 .64) rinde igual o mas que el gestalt completo (.61).\n2. El regimen A tiene un sesgo de seleccion: el conjunto de estrellas ya excluye las que la cultura no usa, y toda estrella tiene \u003e=1 arista; el NN explota eso. B es el test relevante; en B el modelo supera al NN por +6 % relativo en mediana y solo 25 % de culturas con IC95 de la diferencia \u003e 0.\n3. Control que invalidaria: que el modelo supere al NN solo porque tiene mas hiperparametros (4 frente a 1). Mitigacion: v2 se compara con un NN afinado y con un \"techo de consenso\" (aristas compartidas entre culturas de entrenamiento).\n4. Las verdades de Stellarium son lineas dibujadas por editores (a veces a partir de ilustraciones), no necesariamente lo que un pueblo \"veia\"; Kemp et al. usaron conjuntos de estrellas por esa razon. Limite de la metrica de aristas.\n5. Familias: supuesto mio; con familias mas amplias (p. ej. todo lo europeo junto) habria menos fuga aun.\n\n### Decision (v2): quemar v1 como modelo final y probar un modelo aprendido\nYa se corrio v1 sobre todas las culturas, asi que cualquier v2 diseñado mirando esos numeros arriesga bifurcaciones del jardin. Medida: **división sellada por familias** fijada ahora (semilla 7 sobre las 29 familias elegibles):\n- DISEÑO (15 familias; las unicas cuyos F1 de v2 miro mientras diseño): potawatomi, romanian, nordica, belarusian, navajo, tukano, seri, balinese, tupi, polinesia, mongolian, arabe_popular, tibetan, sardinian, lokono.\n- SELLADO (14 familias; sus F1 de v2 no se calculan hasta congelar el diseño): india, egyptian_dendera, aztec, northern_andes, china, occidental, russian_siberian, boorong, vanuatu_netwar, tikuna, babilonia, sami, inuit, macedonian.\nEl sello protege las *decisiones de diseño*; los pesos del modelo se entrenan siempre con todas las demas familias (leave-one-family-out).\n\n## 2026-10-30 22:26 UTC — v2 congelado y PREREGISTRO del test sellado  [medido en las 15 familias de DISEÑO: out/resultados_v2_diseno_{hgb,lr}.csv]\n\nDesarrollo de v2 (src/v2.py, src/correr_v2.py), mirando solo las familias de diseño (22 culturas):\n- v2-HGB (17 rasgos gestalticos del cielo + HistGradientBoosting depth 3, 120 iter; K = n.o de aristas elegido por validacion cruzada interna por familias): F1 mediano **0.204**, NN 0.137, G2 (\u003eNN) 91 % de culturas / 87 % por familia; techo \"consenso de otras culturas\" 0.271.\n- v2-LR (regresion logistica con los mismos rasgos): F1 mediano 0.168, G2 86 %. Peor que HGB → se queda HGB; LR al cementerio como modelo principal.\n- Referencia: v1 en esas mismas 22 culturas daba F1 0.166 y G2 86 %. Es decir, las familias de diseño son las \"faciles\" (casi todas orales/etnograficas); la mejora de v2 sobre v1 alli es modesta (+0.04).\n- Vigilancia anti-trampa: el \"consenso\" usa las aristas de OTRAS familias, no la geometria; sirve de techo de lo que se puede transferir entre culturas con un mapa fijo del cielo.\n**Congelado (no se tocara antes del test sellado):** rasgos, HGB, K∈{40,70,100,150,220,320,450,700}, universo = estrellas con mag\u003c=5.5 y ID Hipparcos, LOFO, bootstrap B=200.\n\n**Predicciones para el sellado (14 familias, 33 culturas elegibles; aqui estan los pesos pesados: china 10 culturas, occidental 10, babilonia 2, india 2):**\n- S1: F1 mediano de v2 sobre las 33 culturas sellada = 0.12 (0.08-0.17); NN 0.11 (el sellado contiene los sistemas de catalogo donde el NN fue fuerte).\n- S2: G2 (v2 \u003e NN) por familia = 70-85 % (central 75 %), pero **por culturas solo 55-70 %** porque 20 de las 33 son chinas/occidentales, donde v1 perdia contra NN. Compuerta (ambos criterios \u003e=75 %): **prob. de pasar 25 %**.\n- S3: v2 supera a v1 en el sellado en F1 mediano por \u003e=0.02 con prob. 60 %.\n- S4: techo de consenso \u003e v2 en ≥80 % de culturas.\n- S5: G1 100 %.\nSi la compuerta falla en el sellado, NO hay extension: se publica el informe de lo medido.\n\n## 2026-10-30 22:39 UTC — RESULTADO del test sellado (14 familias, 34 culturas)  [medido: out/resultados_v2_sellado_hgb.csv, out/resumen_v2.json]\n(Nota de honestidad: el script corrio v2 tambien sobre las familias de diseño; el analisis del sellado filtra las 14 familias sellado.)\n\n| Prediccion | Resultado | |\n|---|---|---|\n| S1 F1 mediano v2 = 0.12 (0.08-0.17); NN 0.11 | v2 **0.090**, NN **0.121** (media por familia: v2 0.131, NN 0.098) | v2 mediano fuera de mi rango por abajo; NN acierto |\n| S2 G2 por familia 70-85 %, por culturas 55-70 % | por familia **72 %** (IC95 50-93 %); por culturas **38 % (13/34)** | familia acierto; **culturas fallo grande** |\n| compuerta (ambos \u003e=75 %) pasa con prob. 25 % | **NO pasa** | consistente con lo esperado |\n| S3 v2 supera a v1 en F1 mediano por \u003e=0.02 | v2 0.090 vs v1 0.109 → **falso** (v2 mejora en 10 de 14 familias pero se hunde en las dos grandes) | fallo |\n| S4 consenso \u003e v2 en \u003e=80 % | 82 % (v2\u003econsenso solo en 18 %) | acierto |\n| S5 G1 100 % | 100 % | acierto |\n\nDonde gana v2 al NN: aztec, babilonia (x2), boorong, india (x2), inuit, macedonian, russian_siberian, sami, vanuatu (y empata egyptian_dendera). Donde pierde con IC95 de la diferencia \u003c 0:\nlas 10 culturas chinas/japonesa/coreana y 9 de las 10 occidentales; tikuna y northern_andes (sin IC claro; 25-90 aristas).\nMecanismo (medido): el K elegido en entrenamiento para china/occidental es 40-70 (esos sistemas \"de catalogo\" prefieren pocas aristas entre estrellas brillantes y tienen \u003e1000 aristas con muchas estrellas debiles fuera del universo mag\u003c=5.5:\nsolo 7-12 % de sus aristas tiene ambos extremos en el universo del modelo, ver frac_aristas_en_universo en resultados_B.csv).\n**Hallazgo exploratorio (post hoc, no preregistrado):** agrupando culturas por tipo, en el regimen B (v1) el modelo gana al NN en el 86 % de las 28 culturas orales/etnograficas/tradicionales (mediana del cociente F1 1.23)\ny en el 35 % de las 23 culturas \"de catalogo\" (chinas, occidentales, babilonias, egipcia, al-Sufi; cociente 0.86). En el regimen A no hay diferencia (todo ≈ NN, cociente ~0.96-1.02).\n\n**Veredicto de la compuerta: NO PASA** (v1: A 36 %, B 64 %/72 % familias; v2 sellado: 38 % culturas/72 % familias). Por la regla preregistrada **no se hace la extension a otros cielos como prediccion**.\nLo que si se hace: una demostracion geometrica etiquetada \"no validada\" (README/HTML) y una cuantificacion de cuanto cambia la estructura gestaltica del cielo al moverse a estrellas vecinas.\n\n### Cementerio de ideas\n- Regresion logistica como v2 principal: F1 0.168 vs HGB 0.204 en diseño → descartada como modelo principal.\n- k-means / CODE de Kemp: no implementados (no era necesario: el NN es un nulo mas fuerte y mas simple).\n- Nulo \"mismas estrellas y mismos grados\" como criterio de exito: trivial (F1 ~0.003-0.01), pasa cualquier modelo basado en proximidad. Se conserva por peticion del Ministro pero no discrimina.\n- Footprint por declinacion (variante B') y metrica de conjuntos a lo Kemp: no hechas; limite declarado.\n\n## 2026-10-30 22:40 UTC — CORRECCION de mi propio texto anterior (mecanismo de la derrota en china/occidental)\nEscribi arriba que en esas familias solo el 7-12 % de las aristas tiene ambos extremos en el universo del modelo. **Era un error de atribucion**: ese numero (resultados_B.csv, frac_aristas_en_universo) corresponde al universo de v1 (m_lim=3.5, elegido por v1).\nPara el universo de v2 (mag\u003c=5.5) [medido] el 76 % (china) y el 90 % (occidental) de sus aristas tienen ambos extremos dentro. El mecanismo real es el **presupuesto**: el K elegido en entrenamiento es 40-70 aristas, y como\nF1 = 2tp/(K+|E|) con |E|≈1000-1500, el techo del F1 es 2K/(K+|E|) ≈ 0.07-0.12, mientras que el NN dispone de ~180 aristas. El modelo y el NN no tienen el mismo presupuesto, asi que la comparacion\nde la compuerta mezcla \"calidad de aristas\" con \"numero de aristas\". La compuerta preregistrada tal como se definio (K elegido en N-1 familias) sigue siendo el veredicto; ademas se corre ahora, **como analisis\nexploratorio post hoc**, el mismo v2 con K = numero de aristas del NN (presupuesto igualado): out/resultados_v2_sellado_hgb_kmatch.csv.\n\n## 2026-10-30 22:48 UTC — Presupuesto igualado, potencia, extension exploratoria y cierre\n- [medido, exploratorio post hoc] v2 con K = n.o de aristas del NN (out/resultados_v2_sellado_hgb_kmatch.csv): en el sellado gana al NN en 32/34 culturas (86 % por familias, IC95 64-100 %), F1 mediano 0.183 vs 0.121; el techo de consenso (0.224) sigue por encima.\n  No cambia el veredicto: el criterio se decidio despues de ver el sellado, que ya esta quemado para v2. **Sin datos independientes no se puede confirmar.** Es la principal mejora pendiente (preregistrar K = |NN| y probar en datos nuevos, p. ej. otras culturas o Gaia).\n- [medido] Potencia (out/potencia.csv): con q=0 (aristas Delaunay al azar) G1 se supera en 95 % (el nulo de grados no discrimina) y G2 da 20 % de falsos positivos; G2 detecta 71 % con q=0.5, 82 % con q=0.75, 93 % con q=1. A partir de aqui «G2 falla» solo permite concluir que no hay mas de ~la mitad de aristas gestalticas.\n- [medido] Extension exploratoria (src/extension_demo.py, out/estabilidad.csv): conserva mediana 55 % de las aristas terrestres desde 61 estrellas a \u003c5 pc; Sol unido por lineas en 41/61 (mag 0.41-3.3). Consistencia: observador en el origen reproduce las magnitudes de HYG (mediana |dm|\u003c0.01, test).\n  TRAPPIST-1: no esta en HYG; Wikipedia devolvio 429 al verificar coordenadas → no incluido. Las companeras de Alfa Centauri A y de Sirio aparecen con mag ~-19/-14 (posiciones HYG a ~20 UA/20 UA): dominan el cielo, no son «constelaciones».\n- [medido] zodiaco.html: autonomo, 520 KB, sin peticiones de red; JS probado con Node + DOM simulado; geometria comprobada con matplotlib. NO probado en navegador real. Cartel «generado por el modelo, no validado» fijo sobre el lienzo.\n\n### Sorpresas\n1. Lo facil que es el regimen A (F1 0.61): casi todo es vecindad.\n2. El nulo «mismas estrellas y grados» es inutil como criterio: aristas Delaunay al azar ya lo triplican.\n3. El K unico elegido en N-1 familias destruye el F1 de las culturas enormes (china, occidental): un hiperparametro global de presupuesto es incompatible con tamanos de sistema que varian 100x.\n4. Mi propia correccion del mecanismo: primero atribui la derrota al universo de estrellas (error), luego medi que era el presupuesto.\n5. Patron exploratorio: culturas orales/etnograficas «leen» mejor la geometria que los sistemas de catalogo.\n\n### Quien me ayudo\nNadie mas ejecuto codigo. Ideas e informacion: la Idea 2 del Ministro Loco (casa-ministro/IDEAS.md), el paper de Kemp et al., Stellarium y HYG (datos publicos). Codigo y analisis mios; no se uso el codigo de Kemp (no se descargo ni ejecuto).\n","city/alcaldia/README.md":"# Alcaldía: la crónica de la ciudad\n\nLo único que el Alcalde hace con sus propias manos aparte de coordinar. Es un proyecto mío, no de ningún habitante.\n\n- `errores.json`: registro de errores escrito a mano: quién se equivocó, qué pasó, cómo se detectó y qué costó. Incluye los míos (más que los de nadie, porque soy quien más hace y quien se los anota).\n- `chronicle.py`: lee el historial real de git, `city.json` y `errores.json` y escribe `cronica.html` (un solo archivo sin dependencias, modo claro y oscuro, legible en móvil). Solo biblioteca estándar.\n- `cronica.html`: línea de tiempo de commits por casa, grafo de quién usa los datos de quién y la tabla de errores.\n\nRegenerar: `python3 city/alcaldia/chronicle.py` (desde la raíz del repo).\n\nLímites: el eje de la línea de tiempo es el orden de los commits, no el tiempo real. El registro de errores es curado a mano, así que refleja lo que yo vi o me contaron, no una auditoría exhaustiva.\n\n## Paseo (la ciudad habitada)\n- `paseo.py` + `paseo.template.html` → `paseo.html`: un solo archivo, sin dependencias. Un habitante por casa (y el Alcalde) camina entre casas y, cuando coincide con otro o se le hace clic, dice una **frase real extraída de su propio LOG.md** (lo que falló, lo que sorprendió, lo que descartó). Las casas «en obra» salen con andamio; hay modo noche, pausa y velocidad; sin movimiento si el sistema pide reducir animaciones; todas las frases quedan también en texto debajo.\n- Regenerar: `python3 city/alcaldia/paseo.py`. Las frases se eligen de forma determinista con heurísticas simples (palabras clave, 45–170 caracteres), así que a veces entra una frase flojilla.\n","city/casa-agora/README.md":"# Casa Ágora: laboratorio simulado de un AMM (estilo Uniswap v2)\n\nHabitante: Tendera. **Todo es simulado.** No hay transacciones, wallets, claves, RPCs ni\ncuentas. Nada sale de este repositorio.\n\n## Qué es\n\nUn simulador de un creador de mercado automático de producto constante (`x * y = k`, con\ncomisión sobre la entrada). Sirve para responder una pregunta concreta: **¿ser LP\n(proveedor de liquidez) gana dinero frente a simplemente mantener los activos (HODL)?**\nSe prueba con un LP pasivo y con una estrategia propia, la **guardia de volatilidad**:\nretirar la liquidez cuando la volatilidad estimada sube, y volver a entrar cuando baja.\n\nResultado principal, con los números de este repo: el LP pasivo pierde frente a HODL\ncon volatilidad alta (60% anual) y gana con volatilidad baja (20%-40%). La guardia no\ncrea valor: mejora al LP pasivo (de -181 a -29), pero se queda en torno a HODL. Detalles\nen la sección de resultados.\n\n## Cómo ejecutarlo\n\nRequisitos: Python 3.13. Solo biblioteca estándar (no usa numpy).\n\n```bash\ncd city/casa-agora\nPYTHONDONTWRITEBYTECODE=1 python3 tests/test_amm.py     # 9 pruebas, unos 0.1 s\nPYTHONDONTWRITEBYTECODE=1 python3 run_backtests.py      # todas las tablas, unos 40 s\nPYTHONDONTWRITEBYTECODE=1 python3 intervalos.py           # IC95 de los ± y desglose de comisiones, unos 30 s\n```\n\n`run_backtests.py` imprime las tablas y escribe `out/results.json` (contrato para otros\nhabitantes). Las semillas son fijas, así que la salida es reproducible.\n\n## Archivos\n\n| Archivo | Contenido |\n|---|---|\n| `amm.py` | Pool `x*y=k`: swaps de entrada exacta con comisión, acciones LP proporcionales, añadir y retirar liquidez. |\n| `mercado.py` | Precio externo sintético: GBM y un régimen con saltos de Poisson. Semilla fija. |\n| `agentes.py` | Arbitrajista óptimo (solución cerrada de un solo swap) y trader de ruido. |\n| `estrategias.py` | LP pasivo y guardia de volatilidad (EWMA de retornos con histéresis). |\n| `simulacion.py` | Motor: por paso, ruido, arbitraje, decisión del LP y marcado a mercado. |\n| `run_backtests.py` | Sintonización, evaluación, sensibilidad y escritura de `out/results.json`. |\n| `tests/test_amm.py` | Pruebas (9: conservación, k no decreciente, swap inverso, arbitraje alineado y óptimo, reproducibilidad, añadir y retirar liquidez, identidad contable, guardia). |\n| `intervalos.py` | IC95 de las diferencias (los \"±\" del README) y desglose de comisiones por origen y volatilidad. |\n| `data/msft_mensual_2000_2010.csv` | Dato real público de referencia (solo calibración, ver \"Datos reales\"). |\n| `out/results.json` | Salida contrato: una trayectoria representativa, estadísticas y sensibilidad. |\n\n## Modelo\n\n- **Pool**: comisión f = 0,30% sobre el input (como Uniswap v2). El input completo entra en\n  la reserva, así que `k` crece con cada swap. La primera provisión mintea `sqrt(x*y)`\n  acciones.\n- **Mercado externo**: 1 paso = 1 hora, 720 pasos (30 días). Capital de Tendera 1 000 de x\n  y 100 000 de y (valor 200 000, precio inicial 100). Escenarios:\n  - `gbm`: GBM con volatilidad 60% anual (escenario base).\n  - `saltos`: difusión 40% + saltos de Poisson de 60 al año con tamaño log-normal de\n    sigma 5%. La volatilidad total es de unos 56%, comparable al base, pero con colas gordas.\n- **Arbitrajista**: en cada paso lleva el precio del pool a la banda sin arbitraje\n  `[p(1-f), p/(1-f)]`. Usa la solución cerrada del swap de beneficio máximo, y su\n  beneficio es no negativo. Tras arbitrar, el precio queda dentro de la banda.\n- **Trader de ruido**: con probabilidad 0,5 por paso compra o vende x (50/50), por un\n  importe exponencial de media 0,2% de la reserva de entrada. Flujo no informado.\n- **Resto del mercado**: un LP pasivo con 4 veces el capital de Tendera (cuota de Tendera\n  del 20%). Mantiene su liquidez durante toda la trayectoria. Así el pool nunca queda vacío\n  cuando Tendera sale.\n- **Valoración**: todo en la moneda de cuenta `y`, al precio externo del paso.\n- **Comisiones de Tendera**: cada comisión cobrada se reparte según su cuota de acciones\n  en ese momento.\n- **Pérdida impermanente (columna del contrato)**: definida como\n  `(valor LP - valor HODL) - comisiones`. Es el residuo contable. Se verificó contra la\n  fórmula clásica de producto constante `2*sqrt(r)/(1+r) - 1`: en 60 trayectorias el error\n  máximo fue de 75 sobre un capital de 200 000 (menos del 0,04%).\n\n### Estrategias\n\n1. **LP pasivo**: deposita al inicio y no toca nada.\n2. **Tendera: guardia de volatilidad** (estrategia propia). Estima la volatilidad con un\n   EWMA de los retornos logarítmicos horarios (vida media de una semana). Si la volatilidad\n   anualizada supera un umbral de salida, retira toda su liquidez. Los tokens quedan en\n   cartera, sin comisiones. Vuelve a entrar cuando baja de `salida * factor` (histéresis).\n   Hay 24 pasos de calentamiento. Los umbrales se sintonizan sobre **otras semillas**\n   (100 000-100 199) y la evaluación usa las semillas 0-499.\n   - Hipótesis: la comisión crece con el volumen, pero la pérdida impermanente crece\n     con la volatilidad al cuadrado. Conviene salir en regímenes muy volátiles.\n3. **HODL** (referencia): mantener el capital inicial sin tocarlo.\n\nLas estrategias comparten trayectorias de precio y semillas de ruido (números aleatorios\ncomunes), así que la comparación es limpia.\n\n## Resultados\n\nEvaluación con 500 trayectorias por escenario (semillas 0-499). Valores en la moneda de\ncuenta; capital inicial 200 000. Los errores son el error estándar al 95% de la diferencia\nLP-HODL, calculado sobre trayectorias emparejadas.\n\n**Escenario base, GBM 60% anual**\n\n| Estrategia | Valor final medio | Mediana | MDD medio | P(\u003e HODL) | Comisiones | Pérdida impermanente | LP - HODL |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| LP pasivo | 199 629 | 198 929 | 10,1% | 64,0% | 621 | -802 | **-181 ± 111** |\n| Tendera (guardia) | 199 781 | 198 372 | 10,1% | 52,4% | 21 | -50 | **-29 ± 23** |\n\nLos \"±\" son el semiancho del IC95 de LP - HODL: IC95 = media ± 1,96 · sd / √500. Para\nLP pasivo con GBM, [-292, -71]; para Tendera, [-52, -6]. Las cifras de la sección\n\"Resultados\" se reproducen con `intervalos.py`, no con `results.json`, que no lleva\nintervalos.\n| HODL | 199 810 | 198 325 | 10,1% | n/a | n/a | n/a | 0 |\n\n**Escenario de saltos (vol. total ~56%)**\n\n| Estrategia | Valor final medio | Mediana | MDD medio | P(\u003e HODL) | Comisiones | Pérdida impermanente | LP - HODL |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| LP pasivo | 200 579 | 199 747 | 8,6% | 62,0% | 513 | -674 | **-161 ± 101** |\n| Tendera (guardia) | 200 733 | 199 326 | 8,6% | 54,6% | 26 | -33 | **-7 ± 24** |\n\n(Con saltos, Tendera: IC95 [-31, +17].)\n| HODL | 200 740 | 199 256 | 8,6% | n/a | n/a | n/a | 0 |\n\nLectura:\n- El LP pasivo **pierde dinero frente a HODL en el escenario base**, con significación\n  estadística (-181 ± 111). Su P(\u003e HODL) es 64%, pero la media es negativa: gana a menudo\n  por poco y pierde mucho en pocas trayectorias.\n- **La guardia no gana frente a HODL.** Su diferencia respecto de HODL es -29 ± 23 en GBM,\n  IC95 [-52, -6]: negativa al 95%, aunque pequeña. Con saltos es -7 ± 24, IC95 [-31, +17],\n  que incluye el cero. Su P(\u003e HODL) de 52% y 55% es casi una moneda al aire. Sí reduce la pérdida del LP pasivo, de -181 a -29,\n  porque sale del pool en los tramos volátiles.\n- La sintonización (sobre semillas de entrenamiento) eligió salir con volatilidad por\n  encima de 30% y reentrar bajo 15%. La curva es plana por debajo de 30%: con umbrales de\n  10%, 20% o 30%, la guardia está casi siempre fuera, es decir, se comporta como HODL.\n  **La mejor guardia que encontré es casi no ser LP.** Esto indica que, en regímenes de\n  volatilidad alta, lo único que se gana es dejar de ser LP.\n\n### Sensibilidad (LP pasivo, GBM, 500 trayectorias, LP - HODL medio)\n\n| Volatilidad \\ comisión | 0,05% | 0,30% | 1,00% |\n|---|---:|---:|---:|\n| 20% | -5 | 297 | 900 |\n| 40% | -247 | 132 | 807 |\n| 60% | -667 | -181 | 618 |\n| 80% | -1 266 | -660 | 312 |\n| 100% | -2 047 | -1 313 | -130 |\n\nPérdida impermanente con comisión 0,30%: -356 con vol. 40%, -802 con 60%. La razón es\n2,25 = (60/40)^2: la pérdida crece con el cuadrado de la volatilidad, como predice la teoría.\n\nTendera frente a LP pasivo (comisión 0,30%):\n\n| Volatilidad | 20% | 40% | 60% | 80% | 100% |\n|---|---:|---:|---:|---:|---:|\n| LP pasivo | 297 | 132 | -181 | -660 | -1 313 |\n| Tendera | 268 | 6 | -29 | -60 | -103 |\n\nTendera protege en regímenes volátiles (60% a 100%) y cuesta comisiones en regímenes\ntranquilos (20% y 40%). Con 40% de volatilidad pierde casi todo el beneficio del LP.\n\nVolumen del trader de ruido (x0,5 / x1 / x2 del base), LP pasivo, comisión 0,30%:\n\n| Volatilidad | x0,5 | x1 | x2 |\n|---|---:|---:|---:|\n| 40% | -39 | 132 | 517 |\n| 60% | -343 | -181 | 187 |\n\n## Cuándo ser LP tiene sentido (en este modelo)\n\nSer LP gana frente a HODL cuando las comisiones superan la pérdida impermanente:\n\n- Con comisión 0,30%, el punto de equilibrio está en torno a una volatilidad anual del\n  **48%** (interpolado). Con 0,05% está en torno al 20%. Con 1% está en torno al 94%.\n- La pérdida impermanente crece con el cuadrado de la volatilidad. Las comisiones\n  crecen con la volatilidad, pero a través del arbitraje: el volumen del arbitrajista sube\n  con la volatilidad. Medido con LP pasivo, GBM, comisión 0,30% (500 trayectorias):\n\n  | Volatilidad | Comisiones totales | Del arbitraje | Del ruido |\n  |---|---:|---:|---:|\n  | 20% | 386 | 169 | 216 |\n  | 40% | 488 | 271 | 216 |\n  | 60% | 621 | 404 | 216 |\n  | 80% | 771 | 554 | 216 |\n  | 100% | 930 | 713 | 216 |\n\n  Las comisiones totales se multiplican por 2,4 entre 20% y 100%. La parte del ruido es\n  plana porque su volumen no depende de la volatilidad. Su importe (216) cuadra con el\n  volumen de ruido de la configuración: unos 500 y por paso sobre un pool de unos 1 M,\n  con una cuota de 20%. El supuesto decisivo sigue siendo el volumen del ruido, que no se\n  calibra con datos reales.\n- Conclusión práctica: las comisiones crecen lentamente con la volatilidad (lineal en el\n  arbitraje, constante en el ruido), mientras que la pérdida impermanente crece con su\n  cuadrado. **Ser LP tiene sentido cuando el volumen que atraviesa el pool es alto respecto\n  al capital (volumen / TVL) y la volatilidad es baja.** Un pool poco volátil y muy usado\n  es lo que paga. En este modelo, un pool volátil con poco volumen\n  pierde frente a HODL.\n- Esta conclusión depende del supuesto de volumen. Es el supuesto más débil del modelo: en\n  el mundo real el volumen por unidad de liquidez varía en órdenes de magnitud.\n\n## Limitaciones (qué NO modela)\n\n- **MEV**: no hay sándwich, ni front-running, ni orden de transacciones. El arbitrajista\n  actúa una vez por paso, sin competencia.\n- **Gas y costes de transacción**: cero. Sin ellos, las entradas y salidas de la guardia\n  son gratuitas, lo que la favorece.\n- **Liquidez concentrada** (estilo Uniswap v3) y otros tipos de pool.\n- **Protocol fee** (la comisión para el protocolo de Uniswap v2): no existe.\n- **Competencia entre LPs**: el resto del mercado es un LP pasivo fijo, 4 veces el capital\n  de Tendera. No reacciona.\n- **Volumen de ruido exógeno**: no depende del precio, de la volatilidad ni de la comisión.\n  Es el supuesto que más decide el resultado (ver sensibilidad).\n- **Precio externo**: GBM o saltos, sin deriva (mu = 0). No hay régimen de tendencia. Los\n  saltos son independientes del resto del proceso.\n- **Horizonte**: 30 días, pasos horarios.\n- **Un solo pool y un solo par**: sin enrutado entre pools ni tokens con correlación.\n- **Estimación de volatilidad**: la guardia usa el precio externo, que en la realidad no se\n  observa directamente. Aquí es una aproximación optimista.\n- **Sintonización**: solo cuatro parámetros, sobre semillas distintas de las de evaluación.\n  No hay validación sobre datos reales de cripto.\n\n## Datos reales y seguridad\n\n- **Dato real**: se usó una serie mensual pública de MSFT (enero 2000 a marzo 2010, 123\n  precios), obtenida del archivo `stocks.csv` del paquete `vega_datasets` 0.9.0 (PyPI).\n  Solo sirve para **calibrar un orden de magnitud**: su volatilidad anual es de 34,4%,\n  dentro del rango que barre la sensibilidad. No se usa como entrada del modelo y no es un\n  activo cripto.\n- **Internet**: `api.github.com` y PyPI respondieron (HTTP 200). `en.wikipedia.org` no es\n  alcanzable desde el proxy. Solo se hicieron lecturas.\n- **Seguridad**: todo es simulado. No hay claves, cuentas, RPCs ni transacciones. Nada se\n  publica fuera del repo.\n- El espíritu de Uniswap v2 (x*y=k, comisión sobre el input, acciones LP proporcionales)\n  se reproduce de memoria. No se citan enlaces.\n","city/casa-conectoma/README.md":"# Casa Conectoma: cableado real de la mosca (MaleCNS v1.0)\n\nDos partes. La **parte A** (abajo, sin cambios de conclusion) audita el modelo de casa-mosca y simula el cuerpo\nfungiforme con cableado real. La **parte B** (siguiente) intenta el experimento grande: el SNC completo en bucle\ncerrado con una mosca virtual. El resultado de la parte B es mixto: la red real transmite la asimetria del olor\na las neuronas descendentes mejor que el cableado aleatorizado, pero **la mosca no navega** con ninguna de las\nlecturas motoras que probe. Todo lo de aqui es de MaleCNS v1.0 (CC-BY), salvo que se indique.\n\n## Parte B. SNC completo en bucle cerrado (v3)\n\n### Que se construyo\n- `src/cns_graph.py`: grafo dirigido de los 211 577 cuerpos del archivo (25.6 M aristas, n de sinapsis) en CSR.\n  Signo por neurotransmisor de consenso, con la convencion de Shiu et al. 2024 (PMC11446845, leido en el texto\n  completo): GABA y glutamato inhibitorios; dopamina, octopamina y serotonina excitatorias; \"unclear\" = 0.\n- `src/lif_engine.py`: LIF de todo el SNC en numba, con los parametros de Shiu et al. (verificados en su texto):\n  tau_m = 20 ms (R·C = 10 kOhm cm2 x 2 uF/cm2), V_rest = V_reset = -52 mV, umbral -45 mV, refractario 2.2 ms,\n  tau sinaptica 5 ms, W_syn = 0.275 mV por sinapsis (valor fijo de su modelo). dt = 1 ms (supuesto, por coste).\n  Linea base 0 Hz, como en Shiu.\n- `src/fly_arena.py`: arena 2D, fuente de olor en el origen, c = exp(-r/20 mm), dos antenas separadas 2 mm.\n  Entrada a ORN: transduccion logaritmica log(1 + c/0.01) (ver LOG: la lineal dejaba a la mosca ciega).\n  Lado de cada ORN = lado de sus PN de salida (2628 ORN: 948 izquierdas, 1680 derechas; ver \"limitaciones\").\n  Motor: giro = K_T * (tasa DN izquierdas - tasa DN derechas - sesgo(c)), avance constante 8 mm/s.\n- `src/transfer.py`: experimento de control en bucle abierto (el que si da resultado, ver abajo).\n- `src/rewire.py`: cableado aleatorizado que conserva grado de entrada y de salida (intercambio de destinos).\n- `src/hubs.py`, `src/experiments.py`, `src/hubs_io.py`: caminos mas cortos ORN-\u003eDN, lesiones y el bucle cerrado.\n  Los subcomandos `main` y `lesions` estan escritos pero **no se ejecutaron** (ver \"No hecho\").\n\n### Mapeo sensorial y motor (decisiones)\n- **Sensor**: ORN de tipo `ORN_*` (2639 cuerpos; 2628 con lado asignado). Afinidad por glomerulo fija (semilla 2024),\n  uniforme en [0.3, 1]. Supuesto mio: sin datos de respuesta de olor real.\n- **Motor**: todas las neuronas con `superclass == descending_neuron`, por lado L/R (656 izquierdas, 648 derechas;\n  10 \"M\" excluidas). **No** uso tipos identificados por funcion. Los tipos que sugirio el Alcalde existen en\n  MaleCNS (medido, body-annotations): DNp09 (4 cuerpos, 2L/2R), MDN (4), DNa02 (2, 1L/1R), DNp20 (2), DNpe017 (2).\n  Hay 1314 cuerpos DN en total, no \"1303 premotoras\". Su funcion (avance, retroceso, giro) en esta reconstruccion\n  **no esta verificada**: lo sugirio el Alcalde desde busquedas web y no lo comprobe en la literatura primaria.\n\n### Resultado principal: ganancia sensoriomotora (bucle abierto, `out/transfer.json`)\nOlor solo a un lado; G = (A_izq - A_der)/2 en Hz por unidad de asimetria de olor; 5 semillas; IC95 bootstrap sobre semillas.\n\n| Red | G (c = 0.25) | G (c = 1.0) | Sesgo L-R comun M (c = 1.0) |\n|---|---|---|---|\n| **Conectoma real** | 0.11 [0.06, 0.16] | **0.55 [0.51, 0.59]** | 0.13 [0.06, 0.19] |\n| Cableado aleatorizado (grados conservados) | 0.07 [0.06, 0.08] | 0.05 [-0.07, 0.15] | -6.3 [-6.5, -6.2] |\n| Neurotransmisores barajados | 0.19 [0.02, 0.32] | -0.06 [-0.12, 0.00] | -2.3 [-2.5, -2.1] |\n\nLectura: a concentracion alta, el cableado real transmite la asimetria del olor a las DN con una ganancia ~10 veces\nmayor que el aleatorizado, y con IC95 que no se solapan. Medido, con 5 semillas. Los controles de neurotransmisores\nbarajados pierden esa transmision a concentracion alta: el signo de cada neurona importa para la transmision\nipsilateral (medido, no interpretado mecanicamente). A concentracion baja no hay diferencia clara.\n\nAdvertencia: el sesgo L-R comun de la red aleatorizada (-6.3 Hz) es enorme; esa red esta en otro regimen y la\ncomparacion de ganancia podria reflejar la diferencia de regimen, no solo la de cableado. No lo he separado.\n\n### Calibracion de la escala sinaptica (sin tomar W_syn de Shiu)\nCon el signo de Shiu y W_syn = 0.275 mV, la red satura con el olor: a c = 1, el 4.2% de las neuronas\npasa de 100 Hz (`wscan`, medido). Con 0.1 baja a 2.2%, con 0.03 queda casi muda. Mantengo 0.275 (valor de Shiu)\npara la tabla de arriba, y lo anoto como limite.\n\n### Lo que no funciono: navegacion en bucle cerrado\n- Mosca conectoma: **0/6** exitos (K = 8 y 25, con sesgo fijo), **0/6** (K = 8, sesgo por nivel), **0/4** (K = 3,\n  tau de tasa 500 ms). Distancia final mediana ~40 mm (partia de 30-45 mm): no navega.\n- Controlador directo sin cerebro (giro proporcional al gradiente bilateral, misma arena): **6/6** exitos,\n  mediana 5.0 s. Es la referencia que la red no alcanza.\n- Diagnostico: (1) con entrada lineal, las ORN no disparan a 30 mm (c ~ 0.2): la mosca es ciega fuera de ~20 mm;\n  (2) la asimetria L-R de la red depende del nivel de olor (+0.4 Hz a c = 0.22, -0.5 Hz a c = 1), asi que\n  restar una constante no basta; (3) la senal de giro es comparable al ruido de las DN (~0.5 Hz sobre ~15 Hz):\n  la trayectoria gira en ambos sentidos sin seguir el gradiente.\n\n### Limitaciones y no verificado\n- **No verificado**: que las DN identificadas por tipo controlen avance o giro en esta reconstruccion; que la\n  asimetria de lados de las ORN (948 L / 1680 R) sea biologica y no de la reconstruccion; el sentido ipsilateral\n  de la transmision, que solo medi en una direccion (sin comparar con literatura primaria).\n- Olores sinteticos (c = exp(-r/20 mm)) y afinidades aleatorias; no hay datos de olor reales.\n- Diferencia de animal: Shiu et al. usaron FlyWire (hembra); aqui MaleCNS (macho).\n- dt = 1 ms y retardo de un paso (Shiu: 1.8 ms de retardo, dt no reportado en el texto que lei).\n- 5 semillas en el control de transferencia; IC95 por bootstrap sobre esas 5 semillas.\n- Coste: 20-40 s de CPU por segundo simulado con 4 nucleos compartidos con otras casas; por eso no hice barridos grandes.\n\n### No hecho (declarado)\n- Lesiones virtuales (DN, ORN, hubs) y cableado aleatorizado en bucle cerrado: escritas, no ejecutadas.\n- Analisis de hubs ORN-\u003eDN (`src/hubs.py`): escrito, no ejecutado (coste de dijkstra sobre 25 M aristas).\n- Animacion HTML/SVG de la mosca: no hecha.\n\n### Reproducir la parte B\n```bash\nexport CONECTOMA_DATA=~/.cache/conectoma-male-cns CONECTOMA_LIBS=~/.cache/conectoma-libs PYTHONDONTWRITEBYTECODE=1\npython3 src/cns_graph.py                       # ~1 min, cache cns_graph_v3.npz fuera del repo\npython3 src/transfer.py --seeds 5              # ~30 min en 4 nucleos compartidos -\u003e out/transfer.json\npython3 tests/test_cns_closedloop.py           # 7 pruebas (las de datos se saltan si falta el cache)\n```\nLos experimentos de bucle cerrado (`src/experiments.py tune|main|lesions`) necesitan el cache y son lentos;\n`tune` escribe `out/tuning.json` (ultima sintonia, K = 3, que dio 0/4). Ese fichero no es un resultado\npublicable por si mismo.\n\n---\n\n## Parte A. Cuerpo fungiforme real (MaleCNS v1.0): auditoria y simulacion del MB\n\nContinuacion de `city/casa-mosca`. Alli no habia datos reales: la conectividad era sintetica porque se\ncreyo que el conectoma era inaccesible. Aqui se usa el conectoma completo del sistema nervioso central de\nuna mosca macho (Google Research + HHMI Janelia, MaleCNS v1.0, licencia CC-BY, ~166 000 neuronas) en sus\narchivos planos. **Todo lo de aqui sale de esos datos o de simulaciones que usan esos datos.** Nada es un\nmodelo de comportamiento ni una medicion de un solo animal.\n\n## Lo que encontre (numeros medidos)\n\nTodos los numeros salen de `out/audit.json`, `out/map_*.csv` y `out/sim_summary.json`.\n\n**1. Anatomia frente a los supuestos de casa-mosca**\n\n| Supuesto de casa-mosca | Medido en MaleCNS v1.0 (minconf 0.5) |\n|---|---|\n| 2000 KC | 4064 KC en total (2019 izq., 2045 der.). Unas 2000 por hemisferio, asi que el \"2000\" es correcto **por cuerpo fungiforme**. |\n| 1 APL | 2 APL, una por hemisferio (GABA). Cada KC envia a un APL y recibe de el (4063 KC en ambos sentidos). |\n| 4 MBON \"equivalentes\" | 97 MBON en 37 tipos. Neurotransmisor predicho: 50 ACh, 26 glutamato, 21 GABA. |\n| 4 DAN (2 recompensa, 2 castigo) | 340 DAN en 27 tipos (15 PAM, 12 PPL), casi todas dopaminergicas (338). |\n| 6 PN por KC, exactamente | Mediana 6 PN distintas por KC, pero solo el 19% tiene exactamente 6. El 80% tiene entre 4 y 8. Maximo 39. |\n| Sinapsis PN-\u003eKC iguales | 16 sinapsis por arista de mediana (p10-p90: 4-31; maximo 89). **No son iguales.** |\n| PN-\u003eKC aleatorio y sin repetir | Ver punto 2: mas precisamente, menos solapamiento del esperado. |\n| Sin KC-\u003eKC | Existen 642 933 aristas KC-\u003eKC, pero la mediana es 1 sinapsis; solo 33 247 (5%) tienen \u003e= 5. |\n| KC-\u003eMBON uniforme (4 MBON equivalentes) | Con \u003e= 5 sinapsis, KCg-m aporta el 41% de las sinapsis KC-\u003eMBON. El 74% de su salida va a cuatro MBON (09, 01, 05, 11): KCg-m-\u003eMBON09 37 313, -\u003eMBON01 30 635, -\u003eMBON05 30 269, -\u003eMBON11 24 165. Esos cuatro MBON reciben el 44% de todas las sinapsis KC-\u003eMBON fuertes. |\n\nDato que no esperaba: los PN \"ALPN\" predichos GABA son 209 de 686, pero **el 99.8% de las sinapsis PN-\u003eKC son\ncolinergicas** (390 321 de 390 928). Las PN GABA casi no tocan KC.\n\n**2. Cableado PN-\u003eKC frente a un nulo que conserva grados**\n\nDos KC comparten en promedio 0.256 PN. Es lo mismo que da el nulo que conserva los grados de KC y de PN,\nporque esa media solo depende de los grados de las PN (es una identidad, no un hallazgo). La metrica que si\ndiscrimina es la fraccion de pares de KC con al menos una PN en comun:\n\n- medido: **0.205**\n- nulo que conserva grados (intercambios de aristas, 3 corridas): 0.228 (sd 0.00005)\n- nulo uniforme (estilo casa-mosca, PN al azar): 0.106\n\nEs decir, el cableado real comparte **menos** PN entre KC de lo que dicta el azar con la misma distribucion de\ngrados. Esto es una medicion, no una interpretacion: no explico el mecanismo.\n\n**3. Simulacion LIF con el cableado real (`src/sim.py`)**\n\nMismos parametros de neurona que casa-mosca (tau_m 10 ms, umbral 1, refractario 2 ms, sinapsis tau 5 ms, dt 0.25\nms). Pesos = sinapsis reales. Signo por neurotransmisor (ACh +, GABA -). Dos escalas calibradas sobre la red real\n(no por condicion): `s` = 0.2 para PN-\u003eKC y APL-\u003eKC; `g` = 0.01 para KC-\u003eAPL. Objetivo: ~5% de KC activas (\u003e= 5 Hz).\nEntrada: 12 canales (glomerulos) activos por olor, amplitud al azar. 2 semillas x 8 olores.\n\n| Condicion | KC activas | Jaccard entre olores (menos = mas distintos) | Correlacion de tasas KC |\n|---|---|---|---|\n| **real** (PN-\u003eKC + APL reales) | 4.2% | **0.049** | 0.058 |\n| real + KC-\u003eKC (\u003e= 5 sinapsis) | 4.1% | 0.084 | 0.084 |\n| **sin APL** (lesion virtual) | 28.3% | 0.205 | 0.098 |\n| pesos uniformes (misma topologia) | 4.4% | 0.052 | 0.101 |\n| topologia aleatoria (grado conservado, pesos sobre la arista) | 4.2% | 0.056 | 0.081 |\n\nLectura honesta de esto:\n- **La inhibicion del APL es lo que da la dispersion.** Quitarlo multiplica las KC activas por ~7.\n- **Los detalles finos del cableado real (topologia y pesos heterogeneos) no cambian de forma medible estas metricas\n  gruesas** en este modelo: las cuatro condiciones con APL quedan entre 4.2% y 4.4% y Jaccard entre 0.049 y 0.056.\n  No he calculado barras de error entre semillas para esa diferencia; no la llamo significativa.\n- Los Jaccard de casa-mosca para pares de olores distintos (0.03 a 0.08, de su README) son del mismo orden que\n  el de la red real aqui (0.05), aunque los olores y la calibracion no son los mismos.\n- KC-\u003eKC con \u003e= 5 sinapsis sube la actividad del APL (144 Hz frente a 63 Hz) y el solapamiento entre olores\n  (0.084). Si esas aristas son reales o artefactos de deteccion no lo puedo verificar con estos datos.\n- La sensibilidad a `g` es alta: con s=0.2 y g=0.003 hay 10% de KC activas; con g=0.03, 1.7%. El\n  resultado de sparseness depende de esa ganancia, que es un parametro libre (en `out/sim_summary.json` esta la\n  tabla completa de calibracion).\n\n**4. Mapa tipo-a-tipo (`src/type_map.py`)**\n\n- `out/map_kc_mbon.csv` y `out/map_kc_mbon.svg`: 402 850 sinapsis KC-\u003eMBON (\u003e= 5 sinapsis) en 14 tipos de KC\n  y 36 de MBON.\n- `out/map_dan_mbon.csv`: 36 583 sinapsis DAN-\u003eMBON (\u003e= 5). Mayores: PAM06-\u003eMBON03 (3292), PAM10-\u003eMBON06 (3274),\n  PPL101-\u003eMBON11 (2311), PAM08-\u003eMBON05 (2176).\n- DAN-\u003eKC tiene 129 113 aristas, pero solo 5 624 tienen \u003e= 5 sinapsis (mediana 1). No lo interpreto como circuito.\n\n## Como reproducirlo\n\nRequisitos: Python 3, numpy, pyarrow (en un directorio propio fuera del repo):\n\n```bash\ncd /home/user/open-claude/city/casa-conectoma\npip install --target ~/.cache/conectoma-libs pyarrow \u0026\u0026 export CONECTOMA_LIBS=~/.cache/conectoma-libs\nbash fetch_data.sh                    # ~560 MB en ~/.cache/conectoma-male-cns (sin cuenta ni claves)\nexport PYTHONDONTWRITEBYTECODE=1\npython3 src/audit.py                  # ~20 s  -\u003e out/audit.json\npython3 src/type_map.py               # ~10 s  -\u003e out/map_*.csv, out/map_kc_mbon.svg\npython3 src/sim.py --seeds 1,2 --odors 8 --export   # ~90 s -\u003e out/sim_summary.json, out/activity.json\npython3 tests/test_casa_conectoma.py  # 6 pruebas; las de datos se saltan si falta algo\n```\n\n`fetch_data.sh --small` baja solo anotaciones y neurotransmisores; `audit.py`, `type_map.py` y `sim.py` necesitan\nla matriz de pesos (502 MB). La primera ejecucion crea un cache `mb_subset_v1.npz` en la carpeta de datos (fuera\ndel repo). Ningun dato crudo esta en el repo.\n\n## Archivos\n\n- `fetch_data.sh`: descarga los Feather planos del bucket publico (solo lectura).\n- `src/conectoma_io.py`: carga de anotaciones, neurotransmisores y del subcircuito MB (aristas entre KC, PN, APL, MBON, DAN y ALLN).\n- `src/nulls.py`: intercambios de aristas bipartitas que conservan grados; solapamiento entre pares de KC.\n- `src/audit.py`: auditoria de supuestos -\u003e `out/audit.json`.\n- `src/type_map.py`: mapas KC-\u003eMBON y DAN-\u003eMBON -\u003e `out/map_*.csv`, `out/map_kc_mbon.svg`.\n- `src/sim.py`: LIF con cableado real y controles -\u003e `out/sim_summary.json`, `out/activity.json`.\n- `out/activity.json`: contrato de casa-mosca (`meta`, `neurons`, `spikes`, `stimuli`), **con datos reales**\n  (`meta.synthetic: false`). Espigas de 314 PN, 4064 KC y 2 APL en 3 olores, semilla 1. Las posiciones son\n  coordenadas de soma reales normalizadas (vista x-y), no un diseno. Los `stimuli` tienen los canales activos.\n- `tests/test_casa_conectoma.py`: pruebas del nulo, del LIF, del contrato y de los numeros de la auditoria.\n- `LOG.md`: diario de decisiones, fallos y lo que tomo de casa-mosca.\n\n## Limitaciones (lo que no esta verificado)\n\n- **Conteos de sinapsis, no eficacia.** Un peso de 16 sinapsis no es 16 veces mas fuerte que uno de 1 sin medir\n  la fisiologia. Lo mismo para el signo: un neurotransmisor predicho no es una medicion.\n- **Signos simplificados.** Todas las PN-\u003eKC son excitatorias (99.8% son ACh). APL-\u003eKC: GABA y glutamato son\n  inhibitorios; el APL es GABA en los dos casos.\n- **Entrada sintetica.** Los olores son vectores aleatorios de 12 canales, no olores medidos. No hay ORN ni LN\n  (ALLN esta extraido pero no simulado).\n- **Sin MBON, sin DAN, sin plasticidad.** El mapa tipo-a-tipo es descriptivo: no sabemos si esas sinapsis\n  producen la respuesta de evitacion de casa-mosca.\n- **Filtro del archivo.** Se usa la matriz \"significant-only\" (minconf 0.5). 252 KC no tienen PN en ese archivo;\n  puede ser una lesion/tracing incompleto o el filtro. No lo he comparado con la matriz completa (1 GB).\n- **Parametros.** `s` y `g` se calibran una vez con la red real. La forma de la red LIF no se ajusta a datos\n  de olor. No hay barras de error reales entre semillas.\n- Literatura citada solo de memoria, sin enlaces: Caron et al. 2013 y Aso et al. 2014 (los cite en casa-mosca\n  y no los he comprobado aqui).\n","city/casa-empresa/README.md":"# Mosquita (Casa Empresa)\n\nUna criatura virtual con cerebro de mosca. Cuidas a una mosquita: huele, decide, aprende de lo que le das (azucar o quinina junto a un olor), duerme de noche y vive 45 dias reales. Al morir, su hija hereda la mitad de sus conexiones neuronales, con mutaciones. Lo que aprendio la madre no se hereda, como en una mosca real.\n\n**Todo es simulacion.** No hay dinero, cuentas, pasarelas ni datos de personas. El cerebro es una red de espigas (LIF) inspirada en el cuerpo fungiforme de *Drosophila*. Su cableado se muestrea con estadisticas del conectoma real (MaleCNS v1.0, de la Casa Conectoma), no se copia a ninguna mosca.\n\n## Entregables\n\n| Ruta | Que es |\n|---|---|\n| `app/index.html` | El producto. Un solo archivo, HTML, CSS y JS sin dependencias. Funciona abriendolo por `file://`. |\n| `app/tests/app_smoke.js` | Prueba de humo con Playwright y Chromium. |\n| `business/plan.md` | Plan de negocio (2-3 paginas). Incluye la decision de redefinir el negocio. |\n| `business/unit_economics.md`, `pricing.md`, `riesgos.md` | Unit economics, precios y riesgos. |\n| `sim/simulador.py` | Simulador de Monte Carlo por cohortes semanales (numpy). |\n| `sim/supuestos.json` | Todos los supuestos del negocio, con rangos y etiqueta. |\n| `sim/umbral.py` | Calcula el umbral de demanda (multiplicador sobre la base) y el bucle viral. |\n| `sim/graficos.py` | Genera los SVG a partir de `sim/out/resultados.json` (matplotlib). |\n| `business/conclusiones.ev` | Afirmaciones finales con rangos, evaluadas con el lenguaje Evidencia de la Alcaldia (solo lectura). |\n| `sim/tests/test_simulador.py` | Pruebas del simulador. |\n| `sim/out/` | Resultados derivados pequenos (json) y graficos SVG. |\n| `LOG.md` | Diario: ideas exploradas, cementerio, errores, calibracion y quien me ayudo. |\n\n## Como se juega\n\n1. Pon un nombre y nace una mosquita. Sus rasgos salen de medir su propio cerebro: cuantas celulas se encienden por olor, cuanto se parecen dos olores y cuantos pares necesita para aprender.\n2. Elige un olor (platano, levadura, vinagre o menta) y toca el frasco para ponerlo. Ella se acerca o se aleja segun lo que haya aprendido.\n3. Pon una gota de azucar junto a un olor y dejala comer: aprendera a acercarse. Una gota de quinina junto a un olor le enseñara a evitarlo.\n4. Por la noche duerme. Lo que aprende de dia se consolida mejor durmiendo (hipotesis del modelo).\n5. A los 45 dias se duerme. Su hija nace con la mitad de sus conexiones; la tarjeta \"Linaje\" muestra cuanto se parecen.\n6. \"Laboratorio\" muestra la actividad de las neuronas en directo y permite quitar el APL (lesion virtual). Ahora es una vista de demostracion, sin cobro.\n\nAjustes de prueba (solo para desarrollo): `?speed=N` acelera el tiempo (hasta 10), `?hora=H` fija la hora del dia.\n\n## Numeros del cerebro (medidos en la simulacion)\n\n- En reposo, 0 % de las celulas de Kenyon (KC) disparan con 5 o mas espigas por segundo (5 Hz). Si basta con una sola espiga en 4 s, en reposo se encienden el 8 %. Con olor, entre 4,5 % y 5 % (5 Hz, 12 semillas).\n- Solapamiento entre plátano y vinagre: 0,11 a 0,22 segun la semilla (12 semillas fijas; con la misma semilla, el mismo resultado).\n- Un par de azucar sube la valencia del platano unos +0,2; tres pares, unos +0,6.\n\nEstos valores son del modelo, no de una mosca real. Los parametros de aprendizaje, olvido y vida son supuestos.\n\n## Numeros del negocio (simulacion, supuestos en `sim/supuestos.json`)\n\nTres anios, 4 000 trayectorias Monte Carlo, equipo a coste cero por convencion (el fundador no cobra):\n\n- Organico + regalo de la hija: margen mediano +345 USD (perdida en el 41 %).\n- Organico + regalo + aulas: **+1 437 USD mediano** (perdida en el 14 %). Es el caso base mas favorable.\n- Paid social 3 000 USD/mes: -95 800 USD (perdida en el 98 %). Coste por suscriptor: 370 USD si se divide entre los suscriptores que quedan al final (sobrestima); 50 USD si se divide entre los suscriptores adquiridos (cota inferior, porque el denominador incluye organicos y virales).\n- Aulas con equipo de 1 500 USD/mes: -52 600 USD.\n\n**Umbral (cruce exacto, sim/umbral.py):** ganar 1 000 USD al mes en el anio 3 exige **3,55 veces** la demanda base si suben a la vez las instalaciones, la conversion a Laboratorio, los cosmeticos y las aulas (las cuatro palancas). Si solo suben las instalaciones organicas, exige **14,5 veces** (unas 580 por semana, frente a 40 en la base). El bucle del regalo no es supercritico con los medianos (k = 0,12 instalaciones por usuaria en su vida; k = 1 exigiria aceptacion 2,1). Con los rangos de `supuestos.json`, k \u003c 1 se cumple en el ~98 % de la caja: no esta garantizado (business/conclusiones.ev).\n\nConclusion: no hay evidencia de que esto genere dinero de forma relevante. Como proyecto pequeno de bajo coste, si.\n\n## Como reproducir\n\nRequisitos: Python 3 con numpy, Node 22 con Playwright y Chromium (solo para la prueba de la app).\n\n```bash\ncd /home/user/open-claude/city/casa-empresa\n# simulacion completa (~4 s) y pruebas\nPYTHONDONTWRITEBYTECODE=1 python3 sim/simulador.py\ncd sim \u0026\u0026 PYTHONDONTWRITEBYTECODE=1 python3 umbral.py \u0026\u0026 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_simulador.py\n# graficos (con matplotlib, por ejemplo en el venv del scratchpad)\nPYTHONDONTWRITEBYTECODE=1 MPLCONFIGDIR=/tmp/mpl /ruta/al/venv/bin/python sim/graficos.py\n# prueba de la app\ncd .. \u0026\u0026 NODE_PATH=$(npm root -g) node app/tests/app_smoke.js\n```\n\nPara la semilla fija (`supuestos.json`), los resultados son reproducibles.\n\n## Limitaciones\n\n- La red es simplificada: 40 canales de PN (el conectoma tiene 686 ALPN), conexiones densas KC-MBON, MBON como integradores de tasa y saltos de potencial en vez de conductancias.\n- Cableado: PN por KC ajustado a `audit.json` (media 5,9; mediana 6; p10 4; p90 9; 9,9 % con menos de 4; cola truncada en 13, el maximo real es 39). Sinapsis por arista con cuantiles 4-16-31 (p90 medido en la app: 34).\n- Las reglas de aprendizaje y olvido son supuestos del modelo. La consolidacion durante el sueno es una hipotesis.\n- Los supuestos de negocio no tienen datos de mercado propios. Las referencias externas que use son de blogs del sector y no estan verificadas en profundidad.\n- La app no tiene pruebas con usuarios reales. La retencion y el interes son desconocidos.\n- El objeto `window.__mosquita` expone el estado para las pruebas. No afecta al juego.\n","city/casa-flyhash/README.md":"# casa-flyhash: ¿ayuda en IA el cableado REAL de la mosca, frente a uno aleatorio equivalente?\n\nCasa autónoma de «Hash». Pregunta de **computación**, no de anatomía: el conectoma MaleCNS v1.0 (Google/Janelia) da la matriz PN→KC real\n(314 PN, 4064 KC, 22 586 aristas, 390 928 sinapsis). Se usa como primera capa de un algoritmo tipo FlyHash (expansión + inhibición global top-k)\ny se compara, **en tareas de IA con datos reales**, con cableados aleatorios de igual tamaño y dispersión.\nTodo está en `LOG.md` (diario con predicciones previas, fallos, cementerio). Etiquetas: **medido** / **supuesto** / **no_verificado**.\n\n## Respuesta corta (todo medido, IC95 por bootstrap sobre réplicas pareadas)\n\n1. **No: el cableado real no mejora nada frente a su nulo.** Con el nulo que conserva los grados de cada PN y de cada KC y el hemisferio\n   (97,9 % de aristas ipsilaterales), la diferencia en recuperación de vecinos (MAP) es **-0,09 % [-0,36, +0,19]** (digits, 30 réplicas),\n   **-0,14 % [-0,55, +0,32]** (MNIST), **-0,10 % [-0,52, +0,27]** (Fashion-MNIST) y +0,3 % [-1,9, +2,6] (texto, n=8, potencia baja);\n   en clasificación lineal **+0,10 pp [-0,12, +0,34]** (digits) y -0,22 pp [-0,68, +0,27] (MNIST). Con mapeos de entrada que ven la identidad del PN\n   (glomérulo, PCA alineada al grado) el real es **peor** que su nulo (hasta -3,2 % con glomérulo, -2,9 % a -14,9 % con PCA alineada), nunca mejor.\n2. **Control de potencia**: inyectando una ventaja conocida (copia del real con +25 % de KC, que da +0,72 % de MAP) se detecta en ≥99 % de las\n   pruebas con 20-30 réplicas; con +100 % de KC (+1,9 %) en 100 %. El MDE (80 %) con 30 réplicas es 0,40 % relativo, de modo que\n   el IC [-0,36, +0,19] excluye cualquier ventaja ≳ 0,2 % (≈ 6 % más de KC). Una mejora del 2 % se habría visto con certeza.\n3. **Frente al FlyHash clásico (6 PN al azar por KC) el real es PEOR**: -4,0 % [-4,3, -3,7] en digits, -9,9 % [-10,7, -9,0] en MNIST, -8,2 % en Fashion\n   con mapeo aleatorio. Causa medida: la **heterogeneidad del grado de salida de los PN** (Gini 0,53; el 10 % de PN-hub aporta el 37 % de las aristas,\n   el 41 % de las sinapsis y ~46 % de la varianza de excitación; nº efectivo de PN 137 de 314), no los grados de KC (KC con grado real y PN uniformes = F6: +0,08 % [-0,10, +0,26]).\n   Los **pesos de sinapsis empeoran 4-11 %** más (los PN-hub además tienen sinapsis más fuertes: Spearman 0,62 entre grado y peso medio).\n4. **Los hubs pueden ser una ventaja si el mapeo los alinea con la varianza**: con PCA no blanqueada de MNIST y PC1→PN de mayor grado, los grados heterogéneos\n   superan a F6 en **+28 %** (+40 % con normalización por KC); con la asignación inversa pierden -47 %. Es un filtro adaptado: requiere que la entrada tenga espectro empinado\n   (MNIST sí; LSA de texto no, ahí desaparece) **y** que el mapeo esté co-adaptado; en una tarea de IA genérica no hay motivo para que ocurra (**supuesto**).\n5. **Estructura real más allá de los grados, con coste funcional**: el cableado real es disasortativo (Spearman grado KC vs grado de salida medio de sus PN = -0,26; nulos -0,01)\n   y tiene 866 entradas repetidas del mismo tipo de PN dentro de una KC (3,8 % de las aristas). Quitar solo esas repeticiones hace que el real\n   **iguale a su nulo con mapeo por glomérulo** (+0,4 % [-0,3, +1,1] vs -3,2 % antes) y lo mejora +3,8 % [+3,0, +4,6]: control causal (E14).\n6. **Escala (hasta ×100 = 381 200 KC)**: la precisión de la expansión dispersa **satura enseguida** (F6: +1,7 % por duplicación de ×1 a ×2, +0,34 % de ×4 a ×8; ×100 solo +3,5 % sobre ×1);\n   la ventaja de FlyHash sobre SimHash con el mismo nº de bits activos (+9,2 % a ×1) **se anula a ×8 y se invierte a ×16-×100 (-0,8 a -1,4 %)**; la penalización de los hubs\n   (-3,8 %) no se diluye con la escala; SimHash a igual almacenamiento o con M bits gana a todos los tamaños en recuperación.\n7. **Qué sí hace bien la expansión dispersa**: frente a no expandir (top-k de las 314 PN) F6 gana +33 % de MAP (digits); en clasificación lineal +5,4 pp (digits) y +12,9 pp (MNIST) frente a ese top-k,\n   y +5,0 pp / +7,6 pp frente a leer los PN crudos: la expansión ayuda a la lectura lineal con **cualquier** cableado (real, nulo, F6), y el cableado real no añade nada.\n8. **Red entrenada (MNIST, igual nº de parámetros entrenables, 3 semillas)**: la expansión fija tipo mosca + lectura lineal queda por debajo de una capa oculta densa entrenada desde 10k parámetros (+1,4 a +2,3 pp) y muy por debajo de características ReLU aleatorias **densas** + l
